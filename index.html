              <div className="flex items-center justify-between border-b border-stone-800 pb-2 mb-2">
                <div>
                  <h3 className="font-serif font-bold text-sm text-amber-200">{currentScript.name}</h3>
                </div>
                <button onClick={() => setIsScriptDrawerOpen(false)} className="text-stone-400 hover:text-white">
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                {currentScript.roles.map(id => {
                  const r = ROLES_DB[id];
                  if (!r) return null;
                  return (
                    <div
                      key={r.id}
                      onClick={() => setWikiRoleModal(r)}
                      className="p-1.5 rounded-lg bg-stone-900/60 hover:bg-stone-800 border border-stone-800 flex flex-col gap-1 cursor-pointer transition group"
                    >
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-1.5">
                          <img src={r.cdnIcon} alt={r.name} className="w-5 h-5 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                          <span className="font-semibold text-stone-200 group-hover:text-amber-300">{r.name}</span>
                        </div>
                        <Icon name="Info" className="w-3 h-3 text-stone-500" />
                      </div>
                      {/* POUVOIR DIRECTEMENT VISIBLE AU SURVOL DU RÔLE */}
                      <p className="text-[10px] text-stone-400 line-clamp-2 italic font-serif">
                        « {r.ability} »
                      </p>
                    </div>
                  );
                })}
              </div>
            </aside>
          </div>

          {/* ACCUSATION EN ATTENTE DE VALIDATION */}
          {pendingAccusation && (
            <div className="bg-amber-950/95 border-t-2 border-amber-500 px-4 py-2 z-40 flex items-center justify-between shadow-2xl absolute bottom-0 left-0 right-0">
              <div className="flex items-center gap-2 text-xs text-amber-200">
                <Icon name="AlertTriangle" className="w-4 h-4 text-amber-400 animate-bounce" />
                <span>
                  Accusation : <strong className="text-white">{pendingAccusation.nominatorName}</strong> accuse <strong className="text-red-400">{pendingAccusation.nomineeName}</strong> !
                </span>
              </div>

              {isStorytellerMode ? (
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => startNomination(pendingAccusation)}
                    className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold text-xs flex items-center gap-1 shadow"
                  >
                    <Icon name="Check" className="w-3.5 h-3.5" /> Valider & Lancer
                  </button>
                  <button
                    onClick={clearPending}
                    className="px-2 py-1 bg-red-800 hover:bg-red-700 text-white rounded font-bold text-xs"
                  >
                    Rejeter
                  </button>
                </div>
              ) : (
                <span className="text-xs italic text-stone-400">En attente du Conteur...</span>
              )}
            </div>
          )}

          {/* MODALE D'ACCUSATION EN 2 ÉTAPES */}
          {accusationWizard && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-red-600 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h3 className="font-serif font-bold text-sm text-amber-200">
                    {accusationWizard.step === 1 ? 'Qui formule l’accusation ?' : 'Qui est accusé ?'}
                  </h3>
                  <button onClick={() => setAccusationWizard(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-1.5 max-h-52 overflow-y-auto pr-1">
                  {players.map(p => (
                    <button
                      key={p.id}
                      onClick={() => {
                        if (accusationWizard.step === 1) setAccusationWizard(w => ({ ...w, step: 2, nominatorId: p.id }));
                        else submitAccusation(p);
                      }}
                      className="p-2 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-500 text-stone-200 flex items-center gap-2 text-left"
                    >
                      <span className="text-lg">{p.avatar}</span>
                      <div className="truncate">
                        <div className="text-xs font-bold">{p.name}</div>
                        <div className="text-[9px] text-stone-400">{p.alive ? 'Vivant' : 'Fantôme'}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE : SÉLECTEUR DE RÔLE */}
        {rolePickerModal && (
          <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
            <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-lg w-full p-4 shadow-2xl space-y-3 max-h-[85vh] flex flex-col">
              <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                <h3 className="font-serif font-bold text-sm text-amber-200">
                  {rolePickerModal.isPlayerHypothesis

                    : `Attribuer un rôle à ${players[rolePickerModal.seatIndex]?.name}`}
                </h3>
                <button onClick={() => setRolePickerModal(null)} className="text-stone-400 hover:text-white">
                  <Icon name="X" className="w-4 h-4" />
                </button>

              <div className="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                <button
                  onClick={() => {
                    if (rolePickerModal.isPlayerHypothesis) {
                      setPlayers(prev => prev.map((p, idx) => idx === rolePickerModal.seatIndex ? { ...p, hypothesisRole: null } : p));
                    } else {
                      const updated = playersRef.current.map((p, idx) => idx === rolePickerModal.seatIndex ? { ...p, role: null } : p);
                      setPlayers(updated);
                      broadcastGameState(updated);
                    }
                    setRolePickerModal(null);
                  }}
                  className="w-full py-1.5 bg-stone-900 hover:bg-red-950 border border-stone-700 rounded-xl text-stone-300 font-bold"
                >
                  Effacer / Aucun rôle
                </button>

                <div className="grid grid-cols-2 gap-1.5">
                  {currentScript.roles.map(id => {
                    const r = ROLES_DB[id];
                    if (!r) return null;
                    return (
                      <div key={r.id} className="relative group/roleopt" onMouseEnter={() => setHoverRole(r)} onMouseLeave={() => setHoverRole(null)}>
                        <button
                          onClick={() => {
                            if (rolePickerModal.isPlayerHypothesis) {
                              setPlayers(prev => prev.map((p, idx) => idx === rolePickerModal.seatIndex ? { ...p, hypothesisRole: r.id } : p));
                            } else {
                              const updated = playersRef.current.map((p, idx) => idx === rolePickerModal.seatIndex ? { ...p, role: r.id } : p);
                              setPlayers(updated);
                              broadcastGameState(updated);
                            }
                            setRolePickerModal(null);
                            playSound('bell');
                          }}
                          className="w-full p-2 rounded-xl border bg-stone-900 border-stone-800 hover:border-amber-400 flex items-center gap-2 text-left"
                        >
                          <img src={r.cdnIcon} alt={r.name} className="w-6 h-6 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                          <div className="truncate flex-1">
                            <div className="font-bold text-stone-200">{r.name}</div>
                            <div className="text-[9px] text-stone-400 uppercase font-mono">{r.team}</div>
                          </div>
                        </button>

                                              </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* 8. MODALE : SÉLECTION DE JETON DE RAPPEL POUR MJ ET JOUEURS */}

          <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
            <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-3">

                  { id: 'redherring', label: 'Red Herring', code: 'REDH', icon: '🔮' },
                  { id: 'protected', label: 'Protégé', code: 'PROT', icon: '🛡️' },
                  { id: 'dead_night', label: 'Mort ce soir', code: 'MORT', icon: '💀' },
                  { id: 'master', label: 'Maître', code: 'MAÎT', icon: '🍷' },
                  { id: 'ability_used', label: 'Pouvoir épuisé', code: 'ÉPUI', icon: '🚫' },

                >

              </div>
            </div>

          {nightOrderModalOpen && (

                    <Icon name="Clock" className="w-4 h-4 text-indigo-400" />

                  </div>

                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs overflow-x-hidden">
                  {(nightOrderTab === 'first'
                    ? currentScript.roles.map(id => ROLES_DB[id]).filter(r => r && r.firstNight > 0).sort((a, b) => a.firstNight - b.firstNight)
                    : currentScript.roles.map(id => ROLES_DB[id]).filter(r => r && r.otherNight > 0).sort((a, b) => a.otherNight - b.otherNight)
                  ).map((role, idx) => (
                    <div key={role.id} className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 flex items-center gap-3">
                      <span className="w-6 h-6 rounded-full bg-indigo-950 text-indigo-300 font-mono text-xs font-bold flex items-center justify-center border border-indigo-800 shrink-0">
                        {idx + 1}
                      </span>
                      <img src={role.cdnIcon} alt={role.name} className="w-7 h-7 object-contain shrink-0" onError={(e) => { e.target.style.display = 'none'; }} />
                      <div className="flex-1 min-w-0">
                        <span className="font-bold text-stone-200 text-xs block">{role.name}</span>
                        <p className="text-[11px] text-stone-400 leading-snug">{role.ability}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 8. MODALE : HISTORIQUE DES VOTES PAR JOUR POUR LE MJ */}
          {voteHistoryModalOpen && isStorytellerMode && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-3 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <Icon name="Gavel" className="w-4 h-4 text-amber-400" />
                    <h4 className="font-serif font-bold text-base text-amber-200">Historique des Votes par Jour</h4>
                  </div>
                  <button onClick={() => setVoteHistoryModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-1 text-xs">
                  {voteHistory.length === 0 ? (
                    <p className="text-stone-500 italic text-center py-4">Aucun vote n'a encore eu lieu.</p>
                  ) : (
                    voteHistory.map((vh, vIdx) => (
                      <div key={vIdx} className="p-3 rounded-2xl bg-stone-900 border border-stone-800 space-y-2">
                        <div className="flex items-center justify-between font-bold">
                          <span className="text-amber-300">Jour {vh.day} : {vh.nominatorName} accuse {vh.nomineeName}</span>
                          <span className={`px-2 py-0.5 rounded text-[10px] ${vh.votesCount >= vh.majorityRequired ? 'bg-red-950 text-red-200 border border-red-500' : 'bg-stone-800 text-stone-400'}`}>
                            {vh.votesCount} / {vh.majorityRequired} voix
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-1 pt-1">
                          {vh.voters.map((vt, vtIdx) => (
                            <span
                              key={vtIdx}
                              className={`px-1.5 py-0.5 rounded text-[10px] font-semibold flex items-center gap-1 ${
                                vt.voted
                                  ? 'bg-amber-400 text-stone-950'
                                  : 'bg-stone-800 text-stone-500'
                              }`}
                            >
                              {vt.voted ? '✋' : '—'} {vt.name}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* COTTAGE DE NUIT : chaque joueur est dans le sien, le Conteur peut venir (vocal + messages privés) */}
          {phase === 'night' && panelCottageId && (isStorytellerMode || myPlayer) && (
            <div className="fixed bottom-3 right-3 z-40 w-[22rem] max-w-[94vw] bg-stone-950/97 border-2 border-indigo-500 rounded-2xl shadow-2xl text-xs">
              <div className="flex items-center justify-between px-3 py-2 border-b border-stone-800 cursor-pointer" onClick={() => setCotPanelMin(m => !m)}>
                <div className="font-serif font-bold text-sm text-indigo-300 truncate">{cottageLabel(panelCottageId)}</div>
                <div className="flex items-center gap-2 shrink-0">
                  {!isStorytellerMode && mjIsHere && <span className="px-1.5 rounded-full bg-emerald-950 border border-emerald-500 text-emerald-300 text-[9px] font-bold">🧙 Conteur présent</span>}
                  <span className="text-stone-400">{cotPanelMin ? '▲' : '▼'}</span>
                </div>
              </div>

              {!cotPanelMin && (
                <div className="p-3 space-y-2">
                  <div className="flex flex-wrap items-center gap-1.5">
                    {cotMembersP.map(p => (
                      <span key={p.id} className="px-2 py-0.5 rounded-lg bg-indigo-950 border border-indigo-500 text-indigo-200 font-bold">{p.avatar} {p.name}</span>
                    ))}
                    {mjIsHere && <span className="px-2 py-0.5 rounded-lg bg-amber-950 border border-amber-600 text-amber-200 font-bold">🧙‍♂️ {storyteller.name} (MJ)</span>}
                    {!mjIsHere && !isStorytellerMode && <span className="text-stone-500 italic">Le Conteur n'est pas là pour l'instant.</span>}
                  </div>

                  {isStorytellerMode && (
                    <div className="space-y-1.5">
                      <div className="p-2 bg-stone-900 rounded-xl border border-stone-800 space-y-1">
                        {cotMembersP.map(p => (
                          <div key={p.id} className="flex items-start justify-between gap-2">
                            <span className="text-stone-400 shrink-0">{p.name} :</span>
                            <span className="text-amber-300 font-bold text-right">{p.role ? ROLES_DB[p.role]?.name : 'Sans rôle'}</span>
                          </div>
                        ))}
                      </div>
                      {!panelCottageId.startsWith('own_') && (
                        <div className="flex items-center gap-1.5">
                          <select
                            value=""
                            onChange={(e) => {
                              const pl = players.find(x => String(x.id) === e.target.value);
                              if (pl) regroup(panelCottageId, [...(((groupList.find(g => g.id === panelCottageId) || {}).ids) || []), pl.id], false);
                            }}
                            className="flex-1 px-2 py-1 bg-stone-900 border border-stone-700 rounded-lg text-[11px] text-white focus:outline-none"
                          >
                            <option value="">➕ Ajouter un joueur…</option>
                            {players.filter(p => cottageIdOf(p.id) !== panelCottageId).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                          </select>
                          <button onClick={() => dissolveGroup(panelCottageId)} className="px-2 py-1 rounded-lg bg-red-950 border border-red-700 text-red-200 text-[11px]">Dissoudre</button>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="h-28 bg-stone-950 rounded-xl p-2 border border-stone-800 overflow-y-auto space-y-1 text-[11px]">
                    {cotMessages.length === 0 ? (
                      <span className="text-stone-600 italic">Messages privés : seuls les présents les voient…</span>
                    ) : (
                      cotMessages.map(msg => (
                        <div key={msg.id} className="text-stone-300"><strong className="text-amber-400">{msg.from} :</strong> {msg.text}</div>
                      ))
                    )}
                  </div>
                  <div className="flex gap-1.5">
                    <input
                      type="text"
                      placeholder="Message privé…"
                      value={cottageInputText}
                      onChange={(e) => setCottageInputText(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') sendCottageMsg(); }}
                      className="flex-1 px-2.5 py-1 bg-stone-900 border border-stone-700 rounded-lg text-xs text-white focus:outline-none select-text"
                    />
                    <button onClick={sendCottageMsg} className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold">Envoyer</button>
                  </div>
                  <div className="flex justify-between items-center">
                    <button
                      onClick={toggleMicrophone}
                      className={`px-2.5 py-1 rounded-xl text-[11px] font-bold border ${isMicMuted || !audioStream ? 'bg-red-950 border-red-600 text-red-200' : 'bg-emerald-950 border-emerald-600 text-emerald-200'}`}
                    >
                      {isMicMuted || !audioStream ? '🎙️ Activer le micro' : '🎙️ Micro actif'}
                    </button>
                    {isStorytellerMode && <button onClick={leaveCottage} className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-xl">Sortir du cottage</button>}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* CRÉER UN COTTAGE PARTAGÉ (Conteur) */}
          {groupPickerOpen && isStorytellerMode && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-purple-500 rounded-3xl max-w-sm w-full p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-base text-purple-300">🏘️ Cottage partagé</h4>
                  <button onClick={() => setGroupPickerOpen(false)} className="text-stone-400 hover:text-white"><Icon name="X" className="w-4 h-4" /></button>
                </div>
                <p className="text-[11px] text-stone-400">Choisis les joueurs qui se retrouveront dans le même cottage (ex : Démon et Sbires). Ils s'entendent et s'écrivent ; toi tu y entres automatiquement.</p>
                <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto">
                  {players.map(p => {
                    const on = groupPickerSel.includes(p.id);
                    return (
                      <button
                        key={p.id}
                        onClick={() => setGroupPickerSel(sel => on ? sel.filter(i => i !== p.id) : [...sel, p.id])}
                        className={`px-2 py-1 rounded-lg border text-xs font-bold ${on ? 'bg-purple-600 border-purple-300 text-white' : 'bg-stone-900 border-stone-700 text-stone-300 hover:border-purple-500'}`}
                      >
                        {p.avatar} {p.name}
                      </button>
                    );
                  })}
                </div>
                <button
                  disabled={groupPickerSel.length < 2}
                  onClick={() => { createSharedCottage(groupPickerSel); setGroupPickerOpen(false); }}
                  className="w-full py-2 rounded-xl bg-purple-600 hover:bg-purple-500 disabled:opacity-40 text-white font-bold text-xs"
                >
                  Créer et y entrer ({groupPickerSel.length} joueur{groupPickerSel.length > 1 ? 's' : ''})
                </button>
              </div>
            </div>
          )}

          {/* APARTÉ (salon privé de jour) : chat entre les présents */}
          {phase === 'day' && myPrivateRoom && (
            <div className="fixed bottom-3 left-3 z-40 w-80 max-w-[94vw] bg-stone-950/97 border-2 border-indigo-500 rounded-2xl shadow-2xl text-xs">
              <div className="px-3 py-2 border-b border-stone-800">
                <div className="font-serif font-bold text-sm text-indigo-300">🔒 Aparté</div>
                <div className="flex flex-wrap gap-1 mt-1">
                  {roomOccupants.map(p => <span key={p.id} className="px-1.5 rounded bg-stone-800 text-stone-200 font-semibold">{p.name}</span>)}
                  {storyteller.currentRoom === myPrivateRoom.id && <span className="px-1.5 rounded bg-amber-500 text-stone-950 font-black">🧙‍♂️ {storyteller.name}</span>}
                </div>
              </div>
              <div className="p-3 space-y-2">
                <div className="h-24 bg-stone-950 rounded-xl p-2 border border-stone-800 overflow-y-auto space-y-1 text-[11px]">
                  {roomMessages.length === 0 ? (
                    <span className="text-stone-600 italic">Invite d'autres joueurs avec le bouton 👤+ sur leur siège…</span>
                  ) : (
                    roomMessages.map(msg => (
                      <div key={msg.id} className="text-stone-300"><strong className="text-amber-400">{msg.from} :</strong> {msg.text}</div>
                    ))
                  )}
                </div>
                <div className="flex gap-1.5">
                  <input
                    type="text"
                    placeholder="Message à l'aparté…"
                    value={roomInput}
                    onChange={(e) => setRoomInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') sendRoomMsg(); }}
                    className="flex-1 px-2.5 py-1 bg-stone-900 border border-stone-700 rounded-lg text-xs text-white focus:outline-none select-text"
                  />
                  <button onClick={sendRoomMsg} className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold">Envoyer</button>
                </div>
                <p className="text-[9px] text-stone-500">Ce salon disparaît quand tout le monde en est sorti. Clique sur un autre salon pour le quitter.</p>
              </div>
            </div>
          )}

          {/* MESSAGERIE : conversations + historique */}
          {cottageMailboxOpen && (() => {
            const threads = {};
            chatMessages.forEach(m => {
              const t = threads[m.thread] || (threads[m.thread] = { id: m.thread, label: m.threadLabel || 'Conversation', members: m.members, msgs: [] });
              t.msgs.push(m);
            });
            if (!isStorytellerMode && myPlayer && !threads['dm:' + myKey]) threads['dm:' + myKey] = { id: 'dm:' + myKey, label: '', members: ['host', myKey], msgs: [] };
            if (mailThread && !threads[mailThread.id]) threads[mailThread.id] = { ...mailThread, msgs: [] };
            const labelOf = (t) => t.id.startsWith('dm:')
              ? (isStorytellerMode ? '✉️ ' + ((players.find(p => vk(p.id) === t.id.slice(3)) || {}).name || 'Joueur') : '✉️ Conteur')
              : t.label;
            const list = Object.values(threads).sort((a, b) => ((b.msgs[b.msgs.length - 1] || {}).ts || 0) - ((a.msgs[a.msgs.length - 1] || {}).ts || 0));
            const cur = threads[mailThread ? mailThread.id : ''] || list[0] || null;
            const send = () => {
              if (!cur || !mailText.trim()) return;
              sendChat(mailText.trim(), cur.id, cur.label, cur.members);
              setMailText('');
            };
            return (
              <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
                <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-md w-full p-4 shadow-2xl space-y-2.5 max-h-[85vh] flex flex-col">
                  <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                    <h4 className="font-serif font-bold text-base text-amber-200">💬 Messagerie</h4>
                    <button onClick={() => setCottageMailboxOpen(false)} className="text-stone-400 hover:text-white"><Icon name="X" className="w-4 h-4" /></button>
                  </div>

                  <div className="flex flex-wrap gap-1.5 text-[11px]">
                    {list.map(t => (
                      <button
                        key={t.id}
                        onClick={() => setMailThread({ id: t.id, label: t.label, members: t.members })}
                        className={`px-2 py-1 rounded-lg border font-bold ${cur && cur.id === t.id ? 'bg-amber-600 text-stone-950 border-amber-400' : 'bg-stone-900 text-stone-300 border-stone-700 hover:border-amber-500'}`}
                      >
                        {labelOf(t)}
                      </button>
                    ))}
                    {isStorytellerMode && (
                      <select
                        value=""
                        onChange={(e) => {
                          const pl = players.find(x => String(x.id) === e.target.value);
                          if (pl) setMailThread({ id: 'dm:' + vk(pl.id), label: '', members: ['host', vk(pl.id)] });
                        }}
                        className="px-2 py-1 rounded-lg bg-stone-900 border border-stone-700 text-stone-300"
                      >
                        <option value="">＋ Écrire à…</option>
                        {players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                    )}
                  </div>

                  <div className="flex-1 min-h-[160px] overflow-y-auto space-y-1.5 pr-1 text-xs">
                    {!cur || cur.msgs.length === 0 ? (
                      <p className="text-stone-500 italic text-center py-6">Aucun message pour le moment.</p>
                    ) : (
                      cur.msgs.map(msg => (
                        <div key={msg.id} className={`p-2 rounded-xl border space-y-0.5 ${msg.fromId === myKey ? 'bg-amber-950/60 border-amber-800 ml-8' : 'bg-stone-900 border-stone-800 mr-8'}`}>
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-amber-400">{msg.from}</span>
                            <span className="text-[9px] text-stone-500 font-mono">{new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                          </div>
                          <p className="text-stone-200">{msg.text}</p>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="flex gap-1.5 pt-2 border-t border-stone-800">
                    <input
                      type="text"
                      placeholder={cur ? 'Écrire un message...' : 'Choisis un destinataire'}
                      value={mailText}
                      onChange={(e) => setMailText(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') send(); }}
                      className="flex-1 px-2.5 py-1.5 bg-stone-900 border border-stone-700 rounded-lg text-xs text-white focus:outline-none select-text"
                    />
                    <button onClick={send} className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-stone-950 rounded-lg text-xs font-bold">Envoyer</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* MODALE : FIN DE PARTIE & VICTOIRE */}
          {victoryModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-500 rounded-3xl max-w-lg w-full p-6 shadow-2xl text-center space-y-4">
                <div className="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl shadow-xl bg-purple-950 border-2 border-amber-400">
                  {victoryModal === 'good' ? '🕊️' : '😈'}
                </div>

                <h3 className={`font-serif font-black text-2xl tracking-widest ${
                  victoryModal === 'good' ? 'text-blue-400' : 'text-red-500'
                }`}>
                  {victoryModal === 'good' ? 'VICTOIRE DU BIEN !' : 'VICTOIRE DU MAL !'}
                </h3>

                <p className="text-xs text-stone-300">
                  La partie est terminée. Vous pouvez tout révéler, mélanger les sièges ou réinitialiser.
                </p>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                  <button
                    onClick={() => {
                      playSound('bell');
                      const allRev = {};
                      players.forEach((_, idx) => { allRev[idx] = true; });
                      setRevealedSeats(allRev);
                    }}
                    className="px-2 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow"
                  >
                    Tout Révéler
                  </button>

                  <button
                    onClick={shufflePlayerSeats}
                    className="px-2 py-1.5 rounded-xl bg-indigo-900 hover:bg-indigo-800 text-indigo-100 font-bold text-xs shadow flex items-center justify-center gap-1"
                  >
                    <Icon name="Shuffle" className="w-3 h-3" /> Mélanger
                  </button>

                  <button
                    onClick={() => setSwitchStorytellerModalOpen(true)}
                    className="px-2 py-1.5 rounded-xl bg-purple-900 hover:bg-purple-800 text-purple-100 font-bold text-xs shadow flex items-center justify-center gap-1"
                  >
                    <Icon name="Crown" className="w-3 h-3 text-amber-300" /> Changer MJ
                  </button>

                  <button
                    onClick={resetGameForRematch}
                    className="px-2 py-1.5 rounded-xl bg-emerald-800 hover:bg-emerald-700 text-emerald-100 font-bold text-xs shadow flex items-center justify-center gap-1"
                  >
                    <Icon name="RotateCcw" className="w-3 h-3" /> Rejouer
                  </button>
                </div>

                <div className="pt-2">
                  <button
                    onClick={() => setVictoryModal(null)}
                    className="px-4 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs"
                  >
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : CHANGER DE CONTEUR */}
          {switchStorytellerModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-500 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-sm text-amber-200 flex items-center gap-1.5">
                    <Icon name="Crown" className="w-4 h-4 text-amber-400" /> Transférer le rôle de Conteur
                  </h4>
                  <button onClick={() => setSwitchStorytellerModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                  {players.map(p => (
                    <button
                      key={p.id}
                      onClick={() => handlePromoteToStoryteller(p)}
                      className="w-full p-2 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-400 flex items-center justify-between text-left transition"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-lg">{p.avatar}</span>
                        <span className="text-xs font-bold text-stone-200">{p.name}</span>
                      </div>
                      <span className="text-[10px] font-bold text-amber-400">Promouvoir →</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE : WIKI OFFICIEL */}
          {wikiRoleModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <img src={wikiRoleModal.cdnIcon} alt={wikiRoleModal.name} className="w-8 h-8 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                    <h3 className="font-serif font-black text-lg text-amber-200">{wikiRoleModal.name}</h3>
                  </div>
                  <button onClick={() => setWikiRoleModal(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
                <div className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-xs italic text-stone-200">
                  « {wikiRoleModal.ability} »
                </div>
              </div>
            </div>
          )}

          {/* MODALE : PARAMÈTRES */}
          {settingsModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-stone-700 rounded-2xl max-w-xs w-full p-4 shadow-2xl space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-sm text-amber-200">Paramètres</h4>
                  <button onClick={() => setSettingsModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-1.5">
                  <label className="text-stone-300 font-semibold text-[11px]">
                    Vitesse balayage vote : {nomination.speed} ms
                  </label>
                  <input
                    type="range"
                    min="1500"
                    max="8000"
                    step="100"
                    value={nomination.speed}
                    onChange={(e) => setNomination(n => ({ ...n, speed: Number(e.target.value) }))}
                    className="w-full accent-amber-500"
                  />
                </div>

                {isStorytellerMode && (
                  <div className="space-y-1.5 pt-2 border-t border-stone-800">
                    <span className="text-stone-400 text-[10px] block">Déclarer la victoire :</span>
                    <div className="flex gap-1.5">
                      <button
                        onClick={() => { setVictoryModal('good'); setSettingsModalOpen(false); playSound('bell'); }}
                        className="flex-1 py-1 bg-blue-900/80 hover:bg-blue-800 border border-blue-500 text-blue-200 font-bold rounded-lg text-xs"
                      >
                        Bien
                      </button>
                      <button
                        onClick={() => { setVictoryModal('evil'); setSettingsModalOpen(false); playSound('bell'); }}
                        className="flex-1 py-1 bg-red-900/80 hover:bg-red-800 border border-red-500 text-red-200 font-bold rounded-lg text-xs"
                      >
                        Mal
                      </button>
                    </div>
                  </div>
                )}

                <div className="pt-2 border-t border-stone-800">
                  <button
                    onClick={() => {
                      setInLobbyScreen(true);
                      setSettingsModalOpen(false);
                    }}
                    className="w-full py-1.5 bg-red-950 hover:bg-red-900 text-red-200 rounded-lg font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="LogOut" className="w-3.5 h-3.5" /> Quitter la salle
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
