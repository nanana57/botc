    const FIREBASE_DB_URL = "https://botc-3e48e-default-rtdb.europe-west1.firebasedatabase.app";

    const generateUniqueRoomCode = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    };

    // Client REST Firebase temps réel direct
    const firebaseSync = {
      async getRoom(code) {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`);
          if (!res.ok) return null;
          const data = await res.json();
          if (!data) return null;
          if (data.players && !Array.isArray(data.players)) {
            data.players = Object.values(data.players);
          }
          return data;
        } catch (e) {
          return null;
        }
      },
      async setRoom(code, data) {
        try {
          await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } catch (e) {}
      },
      async updateRoom(code, partial) {
        try {
          await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(partial)
          });
        } catch (e) {}
      }
    };

    // Fonction d'assainissement systématique des joueurs pour éviter les crashs de rendu
    const sanitizePlayer = (p, idx = 0) => {
      if (!p || typeof p !== 'object') {
        return {
          id: Date.now() + Math.random(),
          name: `Joueur ${idx + 1}`,
          avatar: BOT_AVATARS[idx % BOT_AVATARS.length],
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };
      }
      return {
        id: p.id || (Date.now() + Math.random()),
        name: p.name || `Joueur ${idx + 1}`,
        avatar: p.avatar || BOT_AVATARS[idx % BOT_AVATARS.length],
        role: p.role || null,
        hypothesisRole: p.hypothesisRole || null,
        alive: p.alive !== undefined ? Boolean(p.alive) : true,
        ghostVote: p.ghostVote !== undefined ? Boolean(p.ghostVote) : true,
        reminders: Array.isArray(p.reminders) ? p.reminders : [],
        inRoom: p.inRoom || 'square',
        micActive: p.micActive !== undefined ? Boolean(p.micActive) : true
      };
    };

    const sanitizePlayerList = (list) => {
      if (!list) return [];
      const arr = Array.isArray(list) ? list : Object.values(list);
      return arr.filter(Boolean).map((p, idx) => sanitizePlayer(p, idx));
    };

    const PLAYER_DISTRIBUTION = {

    };

    const REMINDERS_PRESETS = [
      { id: 'drunk', label: 'Bourré / Ivre', code: 'IVRE', icon: '🍺', color: 'bg-amber-600', border: 'border-amber-300' },
      { id: 'poisoned', label: 'Empoisonné', code: 'POIS', icon: '🧪', color: 'bg-emerald-600', border: 'border-emerald-300' },
      { id: 'redherring', label: 'Red Herring', code: 'REDH', icon: '🔮', color: 'bg-purple-600', border: 'border-purple-300' },
      { id: 'protected', label: 'Protégé', code: 'PROT', icon: '🛡️', color: 'bg-blue-600', border: 'border-blue-300' },
      { id: 'dead_night', label: 'Mort ce soir', code: 'MORT', icon: '💀', color: 'bg-red-600', border: 'border-red-300' },
      { id: 'master', label: 'Maître', code: 'MAÎT', icon: '🍷', color: 'bg-indigo-600', border: 'border-indigo-300' },
      { id: 'ability_used', label: 'Pouvoir épuisé', code: 'ÉPUI', icon: '🚫', color: 'bg-stone-700', border: 'border-stone-400' },
      { id: 'demon_target', label: 'Cible Démon', code: 'CIBL', icon: '🎯', color: 'bg-rose-600', border: 'border-rose-300' }

    const DAY_BREAKOUT_ROOMS = [
      { id: 'square', name: 'Place du Village', icon: '🏛️' },
      { id: 'tavern', name: 'Taverne du Corbeau', icon: '🍺' },
      { id: 'forest', name: 'Forêt Sombre', icon: '🌲' },

    ];

    const BOT_NAMES = ['Brockwell', 'Danielle', 'Kapt’n Kadaver', 'Elizabeth', 'Markus', 'Elin', 'Beardy', 'Ginge', 'Conor', 'Rhett', 'Kurobold', 'Schnauzer'];
    const BOT_AVATARS = ['🐴', '🐺', '🦉', '🦊', '🦅', '🐗', '🦇', '🐈‍⬛', '🦌', '🗡️', '🛡️', '🕯️'];

    function App() {
      // --- ÉCRAN 1 : LOBBY & AUTHENTIFICATION ---
      const [inLobbyScreen, setInLobbyScreen] = useState(true);
      const [authMode, setAuthMode] = useState('create');
      const [userPseudo, setUserPseudo] = useState('');
      const [inputRoomCode, setInputRoomCode] = useState('');
      const [roomCode, setRoomCode] = useState('');
      const [currentUserId, setCurrentUserId] = useState(null);
      const [joinError, setJoinError] = useState(null);
      const [isConnecting, setIsConnecting] = useState(false);

      // --- STORYTELLER (CONTEUR) EN HAUT À GAUCHE ---
      const [storyteller, setStoryteller] = useState({
        name: 'Arif',
        avatar: '🧙‍♂️',
        cameraActive: false,
        micActive: true,
        currentRoom: 'square'
      });
      const [isStorytellerMode, setIsStorytellerMode] = useState(true);

      // --- SCRIPTS ---
      const [selectedScriptId, setSelectedScriptId] = useState('tb');
      const [isScriptDrawerOpen, setIsScriptDrawerOpen] = useState(false);

      // --- 3 BLUFFS DÉMON ---
      const [demonBluffs, setDemonBluffs] = useState([null, null, null]);
      const [demonBluffPickerIndex, setDemonBluffPickerIndex] = useState(null);

      // --- PHASES & MINUTEUR DU JOUR ---
      const [phase, setPhase] = useState('day');
      const [dayNumber, setDayNumber] = useState(1);
      const [dayTimerSeconds, setDayTimerSeconds] = useState(300);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      useEffect(() => {
        let interval = null;
        if (phase === 'day' && isTimerRunning && dayTimerSeconds > 0) {
          interval = setInterval(() => {
            setDayTimerSeconds(prev => Math.max(0, prev - 1));
          }, 1000);
        } else if (dayTimerSeconds === 0 && isTimerRunning) {
          setIsTimerRunning(false);
          playSound('gavel');
        }
        return () => clearInterval(interval);
      }, [phase, isTimerRunning, dayTimerSeconds]);

      // --- JOUEURS DU CERCLE ---
      const [players, setPlayers] = useState([]);
      const [rolesDistributedToPlayers, setRolesDistributedToPlayers] = useState(false);
      const [gameStarted, setGameStarted] = useState(false);

      // --- SALONS & COTTAGES ---
      const [currentDayRoom, setCurrentDayRoom] = useState('square');
      const [visitingCottagePlayer, setVisitingCottagePlayer] = useState(null);
      const [cottageGuestPlayerId, setCottageGuestPlayerId] = useState(null);
      const [customPrivateRooms, setCustomPrivateRooms] = useState([]);
      const [pendingInvite, setPendingInvite] = useState(null);
      const [roomsOverviewOpen, setRoomsOverviewOpen] = useState(false);

      // --- MODALES & PARAMÈTRES ---
      const [rolePickerModal, setRolePickerModal] = useState(null);
      const [reminderPickerModal, setReminderPickerModal] = useState(null);
      const [wikiRoleModal, setWikiRoleModal] = useState(null);
      const [nightOrderModalOpen, setNightOrderModalOpen] = useState(false);
      const [nightOrderTab, setNightOrderTab] = useState('first');
      const [settingsModalOpen, setSettingsModalOpen] = useState(false);
      const [switchStorytellerModalOpen, setSwitchStorytellerModalOpen] = useState(false);

      // --- ACCUSATION ET VOTE ---
      const [accusationWizard, setAccusationWizard] = useState(null);
      const [pendingAccusation, setPendingAccusation] = useState(null);
      const [nomination, setNomination] = useState({
        active: false,
        nominatorId: null,
        nomineeId: null,
        clockIndex: -1,
        isRunning: false,
        votes: {},
        speed: 1600
      });
      const [onTheBlock, setOnTheBlock] = useState(null);

      // --- FIN DE PARTIE & RÉVÉLATION ---
      const [victoryModal, setVictoryModal] = useState(null);
      const [revealedSeats, setRevealedSeats] = useState({});

      // --- WEBCAMS & MICRO ---
      const videoRef = useRef(null);
      const [webcamStream, setWebcamStream] = useState(null);
      const [isMicMuted, setIsMicMuted] = useState(false);

      // --- AUDIO SYNTHÉTISEUR ---
      const playSound = (type = 'bell') => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'bell') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(293.66, ctx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
            osc.start();
            osc.stop(ctx.currentTime + 1.3);
          } else if (type === 'tick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.start();
            osc.stop(ctx.currentTime + 0.09);
          } else if (type === 'gavel') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          }
        } catch (e) {}
      };

      const toggleUserWebcam = async () => {
        if (webcamStream) {
          webcamStream.getTracks().forEach(t => t.stop());
          setWebcamStream(null);
          setStoryteller(s => ({ ...s, cameraActive: false }));
        } else {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            setWebcamStream(stream);
            setStoryteller(s => ({ ...s, cameraActive: true }));
            if (videoRef.current) videoRef.current.srcObject = stream;
          } catch (err) {
            console.warn("Accès webcam refusé:", err);
          }
        }
      };

      useEffect(() => {
        if (videoRef.current && webcamStream) {
          videoRef.current.srcObject = webcamStream;
        }
      }, [webcamStream]);

      // --- SYNCHRONISATION MULTIJOUEUR EN TEMPS RÉEL (FIREBASE + LOCAL POLLING) ---
      useEffect(() => {
        if (!roomCode || inLobbyScreen) return;

        let isCancelled = false;

        const pollGameState = async () => {
          try {
            const data = await firebaseSync.getRoom(roomCode);
            if (data && !isCancelled) {
              if (data.players !== undefined) {
                setPlayers(sanitizePlayerList(data.players));
              }
              if (data.phase) setPhase(data.phase);
              if (data.dayNumber !== undefined) setDayNumber(Number(data.dayNumber) || 1);
              if (data.gameStarted !== undefined) setGameStarted(Boolean(data.gameStarted));
              if (data.nomination) setNomination(data.nomination);
              if (data.storyteller) {
                setStoryteller(prev => ({
                  ...prev,
                  ...data.storyteller,
                  name: data.storyteller.name || prev.name,
                  avatar: data.storyteller.avatar || prev.avatar,
                  currentRoom: data.storyteller.currentRoom || prev.currentRoom || 'square'
                }));
              }
              if (data.selectedScriptId && SCRIPTS_DATA[data.selectedScriptId]) {
                setSelectedScriptId(data.selectedScriptId);
              }
              if (data.demonBluffs && Array.isArray(data.demonBluffs)) {
                setDemonBluffs(data.demonBluffs);
              }
              if (data.onTheBlock !== undefined) setOnTheBlock(data.onTheBlock);
              if (data.dayTimerSeconds !== undefined && !isStorytellerMode) setDayTimerSeconds(Number(data.dayTimerSeconds) || 300);
              if (data.isTimerRunning !== undefined && !isStorytellerMode) setIsTimerRunning(Boolean(data.isTimerRunning));
            }
          } catch (e) {}

          // Fallback stockage local / inter-onglets
          try {
            const localRaw = localStorage.getItem(`botc_room_${roomCode}`);
            if (localRaw) {
              const localData = JSON.parse(localRaw);
              if (localData && !isCancelled) {
                if (localData.players !== undefined) setPlayers(sanitizePlayerList(localData.players));
                if (localData.phase) setPhase(localData.phase);
                if (localData.gameStarted !== undefined) setGameStarted(Boolean(localData.gameStarted));
                if (localData.nomination) setNomination(localData.nomination);
              }
            }
          } catch (e) {}
        };

        const interval = setInterval(pollGameState, 1500);
        pollGameState();

        return () => {
          isCancelled = true;
          clearInterval(interval);
        };
      }, [roomCode, inLobbyScreen, isStorytellerMode]);

      const broadcastGameState = (
        newPlayers = players, 
        newPhase = phase, 
        newStarted = gameStarted,
        extraUpdates = {}
      ) => {
        if (!roomCode) return;
        const payload = {
          roomCode,
          players: newPlayers,
          phase: newPhase,
          dayNumber,
          gameStarted: newStarted,
          storyteller,
          nomination,
          selectedScriptId,
          demonBluffs,
          onTheBlock,
          dayTimerSeconds,
          isTimerRunning,
          lastUpdated: Date.now(),
          ...extraUpdates
        };

        // 1. Envoi direct vers Firebase
        firebaseSync.setRoom(roomCode, payload);

        // 2. Synchronisation instantanée locale
        try {
          localStorage.setItem(`botc_room_${roomCode}`, JSON.stringify(payload));
        } catch (e) {}
      };

      // --- QUOTAS OFFICIELS & BARON ---
      const currentScript = SCRIPTS_DATA[selectedScriptId] || SCRIPTS_DATA.tb;
      const officialQuota = PLAYER_DISTRIBUTION[players.length] || null;

      const dynamicQuota = useMemo(() => {
        if (!officialQuota) return null;
        let townsfolk = officialQuota.townsfolk;
        let outsider = officialQuota.outsider;
        let minion = officialQuota.minion;
        let demon = officialQuota.demon;

        const hasBaron = players.some(p => p.role === 'baron');
        if (hasBaron) {
          outsider += 2;
          townsfolk = Math.max(0, townsfolk - 2);
        }

        return { townsfolk, outsider, minion, demon, hasBaron };
      }, [officialQuota, players]);

      const assignedCounts = useMemo(() => {
        const counts = { townsfolk: 0, outsider: 0, minion: 0, demon: 0 };
        players.forEach(p => {
          if (p && p.role && ROLES_DB[p.role]) {
            const team = ROLES_DB[p.role].team;
            if (counts[team] !== undefined) counts[team]++;
          }
        });
        return counts;
      }, [players]);

      const addPlayerSeat = (customName = null) => {
        if (players.length >= 15 || gameStarted) return;
        const nextIdx = players.length;
        const name = customName || BOT_NAMES[nextIdx % BOT_NAMES.length] || `Joueur ${nextIdx + 1}`;
        const newPlayer = {
          id: Date.now() + Math.random(),
          name,
          avatar: BOT_AVATARS[nextIdx % BOT_AVATARS.length],
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };
        setPlayers(prev => {
          const updated = [...prev, newPlayer];
          broadcastGameState(updated);
          return updated;
        });
      };

      const removePlayerSeat = (playerId) => {
        if (gameStarted) return;
        setPlayers(prev => {
          const updated = prev.filter(p => p.id !== playerId);
          broadcastGameState(updated);
          return updated;
        });
      };

      const handleAutoDistributeRoles = () => {
        if (players.length < 5 || gameStarted) return;
        const dist = PLAYER_DISTRIBUTION[players.length];
        if (!dist) return;

        let targetTownsfolk = dist.townsfolk;
        let targetOutsiders = dist.outsider;
        let targetMinions = dist.minion;
        let targetDemons = dist.demon;

        const scriptRoles = currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean);
        const avTownsfolk = scriptRoles.filter(r => r.team === 'townsfolk');
        const avOutsiders = scriptRoles.filter(r => r.team === 'outsider');
        const avMinions = scriptRoles.filter(r => r.team === 'minion');
        const avDemons = scriptRoles.filter(r => r.team === 'demon');

        const chosenDemon = avDemons[Math.floor(Math.random() * avDemons.length)];
        const chosenMinions = [...avMinions].sort(() => 0.5 - Math.random()).slice(0, targetMinions);

        if (chosenMinions.some(m => m.id === 'baron')) {
          targetOutsiders = Math.min(targetOutsiders + 2, avOutsiders.length);
          targetTownsfolk = Math.max(0, targetTownsfolk - 2);
        }

        const chosenOutsiders = [...avOutsiders].sort(() => 0.5 - Math.random()).slice(0, targetOutsiders);
        const chosenTownsfolk = [...avTownsfolk].sort(() => 0.5 - Math.random()).slice(0, targetTownsfolk);

        const fullPool = [
          chosenDemon,
          ...chosenMinions,
          ...chosenOutsiders,
          ...chosenTownsfolk
        ].filter(Boolean).sort(() => 0.5 - Math.random());

        setPlayers(curr => {
          const updated = curr.map((p, idx) => ({ ...p, role: fullPool[idx]?.id || null }));
          broadcastGameState(updated);
          return updated;
        });

        playSound('bell');
      };

      const handleRandomizeDemonBluffs = () => {
        const inGameRoles = new Set(players.map(p => p.role).filter(Boolean));
        const availableGood = currentScript.roles
          .map(id => ROLES_DB[id])
          .filter(r => r && (r.team === 'townsfolk' || r.team === 'outsider') && !inGameRoles.has(r.id));

        const shuffled = [...availableGood].sort(() => 0.5 - Math.random());
        const newBluffs = [
          shuffled[0]?.id || null,
          shuffled[1]?.id || null,
          shuffled[2]?.id || null
        ];
        setDemonBluffs(newBluffs);
        broadcastGameState(players, phase, gameStarted, { demonBluffs: newBluffs });
        playSound('bell');
      };

      const shufflePlayerSeats = () => {
        if (players.length < 2) return;
        setPlayers(prev => {
          const updated = [...prev].sort(() => 0.5 - Math.random());
          broadcastGameState(updated);
          return updated;
        });
        playSound('bell');
      };

      const handlePromoteToStoryteller = (newStorytellerPlayer) => {
        const demotedStorytellerPlayer = {
          id: Date.now() + Math.random(),
          name: storyteller.name,
          avatar: storyteller.avatar,
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };

        const updatedSt = {
          name: newStorytellerPlayer.name,
          avatar: newStorytellerPlayer.avatar,
          cameraActive: false,
          micActive: true,
          currentRoom: 'square'
        };

        setStoryteller(updatedSt);

        const updatedPlayers = [
          ...players.filter(p => p.id !== newStorytellerPlayer.id),
          demotedStorytellerPlayer
        ];

        setPlayers(updatedPlayers);
        setSwitchStorytellerModalOpen(false);
        broadcastGameState(updatedPlayers, phase, gameStarted, { storyteller: updatedSt });
        playSound('bell');
      };

      const resetGameForRematch = () => {
        setGameStarted(false);
        setPhase('day');
        setDayNumber(1);
        setRolesDistributedToPlayers(false);
        setNomination({ active: false, nominatorId: null, nomineeId: null, clockIndex: -1, isRunning: false, votes: {}, speed: 1600 });
        setOnTheBlock(null);
        setVictoryModal(null);
        setRevealedSeats({});
        setVisitingCottagePlayer(null);
        setCottageGuestPlayerId(null);
        setDemonBluffs([null, null, null]);
        setDayTimerSeconds(300);
        setIsTimerRunning(false);

        const updated = players.map(p => ({
          ...p,
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square'
        }));

        setPlayers(updated);
        broadcastGameState(updated, 'day', false);
        playSound('bell');
      };

      const handleDispatchRolesToPlayers = () => {
        if (gameStarted) return;
        setRolesDistributedToPlayers(true);
        playSound('bell');
      };

      const handleStartGame = () => {
        if (players.length < 5) return;
        setGameStarted(true);
        setPhase('night');
        setDayNumber(1);
        broadcastGameState(players, 'night', true);
        playSound('bell');
      };

      // --- VOTE & DOUBLE AIGUILLE DEPUIS L'ACCUSÉ ---
      const nomineeIndex = useMemo(() => {
        if (!nomination.active || !nomination.nomineeId || players.length === 0) return -1;
        return players.findIndex(p => p.id === nomination.nomineeId);
      }, [nomination.active, nomination.nomineeId, players]);

      const orderedVoters = useMemo(() => {
        if (nomineeIndex === -1 || players.length === 0) return [];
        const ordered = [];
        for (let i = 1; i <= players.length; i++) {
          const idx = (nomineeIndex + i) % players.length;
          ordered.push(players[idx]);
        }
        return ordered;
      }, [nomineeIndex, players]);

      useEffect(() => {
        if (!nomination.active || !nomination.isRunning || orderedVoters.length === 0) return;

        const timer = setTimeout(() => {
          playSound('tick');
          setNomination(prev => {
            const nextIdx = prev.clockIndex + 1;
            if (nextIdx >= orderedVoters.length) {
              playSound('gavel');
              const totalVotes = Object.values(prev.votes || {}).filter(Boolean).length;
              const aliveTotal = players.filter(p => p.alive).length;
              const required = Math.ceil(aliveTotal / 2);
              const nominee = players.find(p => p.id === prev.nomineeId);

              if (totalVotes >= required && nominee) {
                if (!onTheBlock || totalVotes > onTheBlock.votes) {
                  setOnTheBlock({ playerId: nominee.id, playerName: nominee.name, votes: totalVotes });
                } else if (onTheBlock && totalVotes === onTheBlock.votes) {
                  setOnTheBlock(null);
                }
              }

              // Consommation du vote fantôme
              setPlayers(curr => {
                const updated = curr.map(p => {
                  if (!p.alive && prev.votes && prev.votes[p.id]) {
                    return { ...p, ghostVote: false };
                  }
                  return p;
                });
                broadcastGameState(updated);
                return updated;
              });

              return { ...prev, isRunning: false, clockIndex: orderedVoters.length - 1 };
            }
            return { ...prev, clockIndex: nextIdx };
          });
        }, nomination.speed);

        return () => clearTimeout(timer);
      }, [nomination.active, nomination.isRunning, nomination.clockIndex, orderedVoters, players, onTheBlock]);

      const handleApproveAccusation = () => {
        if (!pendingAccusation) return;
        playSound('bell');
        const newNomination = {
          active: true,
          nominatorId: pendingAccusation.nominatorId,
          nomineeId: pendingAccusation.nomineeId,
          clockIndex: -1,
          isRunning: false,
          votes: {},
          speed: 1600
        };
        setNomination(newNomination);
        setPendingAccusation(null);
        broadcastGameState(players, phase, gameStarted, { nomination: newNomination });
      };

      const togglePlayerLife = (playerId) => {
        setPlayers(prev => {
          const updated = prev.map(p => p.id === playerId ? { ...p, alive: !p.alive } : p);
          broadcastGameState(updated);
          return updated;
        });
      };

      const executePlayerOnBlock = () => {
        if (!onTheBlock) return;
        playSound('gavel');
        setPlayers(prev => {
          const updated = prev.map(p => p.id === onTheBlock.playerId ? { ...p, alive: false } : p);
          broadcastGameState(updated, phase, gameStarted, { onTheBlock: null });
          return updated;
        });
        setOnTheBlock(null);
        setNomination(prev => ({ ...prev, active: false, isRunning: false }));
      };

      const sendRoomInvite = (targetPlayer, explicitRoomId = null, explicitRoomName = null) => {
        const customRoomId = explicitRoomId || `private_${Date.now()}`;
        const roomName = explicitRoomName || `Aparté avec ${targetPlayer.name}`;
        setPendingInvite({
          fromPlayerName: isStorytellerMode ? storyteller.name : 'Un villageois',
          toPlayerId: targetPlayer.id,
          roomName,
          roomId: customRoomId
        });
        setCustomPrivateRooms(prev => {
          if (prev.some(r => r.id === customRoomId)) return prev;
          return [...prev, { id: customRoomId, name: roomName, icon: '🔒' }];
        });
        playSound('bell');
      };

      const acceptInvite = () => {
        if (!pendingInvite) return;
        changeUserRoom(pendingInvite.roomId);
        setPendingInvite(null);
      };

      const changeUserRoom = (roomId) => {
        setCurrentDayRoom(roomId);
        if (!isStorytellerMode && players.length > 0) {
          setPlayers(prev => {
            const updated = prev.map(p => {
              if (currentUserId && p.id === currentUserId) {
                return { ...p, inRoom: roomId };
              }
              return p;
            });
            broadcastGameState(updated);
            return updated;
          });
        } else {
          setStoryteller(s => {
            const updatedSt = { ...s, currentRoom: roomId };
            broadcastGameState(players, phase, gameStarted, { storyteller: updatedSt });
            return updatedSt;
          });
        }
      };

      const aliveCount = players.filter(p => p.alive).length;
      const majorityRequired = Math.ceil(aliveCount / 2);

      const nomineeAngle = nomineeIndex !== -1 && players.length > 0
        ? (nomineeIndex / players.length) * 360
        : 0;

      const currentVoter = nomination.clockIndex >= 0 ? orderedVoters[nomination.clockIndex] : null;
      const activeVoterIndex = currentVoter ? players.findIndex(p => p.id === currentVoter.id) : -1;
      const sweeperAngle = activeVoterIndex !== -1 && players.length > 0
        ? (activeVoterIndex / players.length) * 360
        : 0;

      const firstNightRoles = currentScript.roles
        .map(id => ROLES_DB[id])
        .filter(r => r && r.firstNight > 0)
        .sort((a, b) => a.firstNight - b.firstNight);

      const otherNightRoles = currentScript.roles
        .map(id => ROLES_DB[id])
        .filter(r => r && r.otherNight > 0)
        .sort((a, b) => a.otherNight - b.otherNight);

      const nightOrderRankMap = useMemo(() => {
        const isFirst = dayNumber === 1;
        const inPlayNightRoles = players
          .filter(p => p.role && ROLES_DB[p.role] && (isFirst ? ROLES_DB[p.role].firstNight > 0 : ROLES_DB[p.role].otherNight > 0))
          .map(p => ({
            roleId: p.role,
            order: isFirst ? ROLES_DB[p.role].firstNight : ROLES_DB[p.role].otherNight
          }))
          .sort((a, b) => a.order - b.order);

        const rankMap = {};
        let currentRank = 1;
        inPlayNightRoles.forEach(item => {
          if (!rankMap[item.roleId]) {
            rankMap[item.roleId] = currentRank++;
          }
        });
        return rankMap;
      }, [players, dayNumber]);

      // ==========================================
      // RENDU 1 : ÉCRAN DE CONNEXION / LOBBY
      // ==========================================
      if (inLobbyScreen) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center p-4 bg-[#0e0712] text-stone-100 font-sans relative overflow-hidden select-none">
            <div className="absolute inset-0 pointer-events-none opacity-30 bg-[radial-gradient(#4a1d4a_1px,transparent_1px)] [background-size:24px_24px]" />
            
            <div className="relative z-10 w-full max-w-md bg-stone-950/90 border-2 border-amber-600/60 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
              <div className="text-center space-y-2 mb-6">
                <div className="w-16 h-16 rounded-full bg-purple-950/90 border-2 border-amber-500/80 flex items-center justify-center text-3xl mx-auto shadow-[0_0_25px_rgba(217,119,6,0.3)]">
                  😈
                </div>
                <h1 className="font-serif font-black text-2xl sm:text-3xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200">
                  BOTC ONLINE
                </h1>
                <p className="text-xs text-stone-400 font-serif italic">
                  Grimoire & Place du Village de Ravenswood Bluff
                </p>
              </div>

              <div className="flex rounded-xl bg-stone-900/80 p-1 border border-stone-800 mb-6">
                <button
                  onClick={() => setAuthMode('create')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${
                    authMode === 'create'
                      ? 'bg-amber-600 text-stone-950 shadow-md font-black'
                      : 'text-stone-400 hover:text-stone-200'
                  }`}
                >
                  <Icon name="Crown" className="w-3.5 h-3.5" /> Créer (Hôte / MJ)
                </button>
                <button
                  onClick={() => setAuthMode('join')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${
                    authMode === 'join'
                      ? 'bg-purple-700 text-white shadow-md'
                      : 'text-stone-400 hover:text-stone-200'
                  }`}
                >
                  <Icon name="LogIn" className="w-3.5 h-3.5" /> Rejoindre
                </button>
              </div>

              <div className="space-y-4 text-xs">
                <div>
                  <label className="block text-stone-300 font-bold mb-1">Votre Pseudo</label>
                  <input
                    type="text"
                    placeholder="Ex: Arif, Éléonore, Markus..."
                    value={userPseudo}
                    onChange={(e) => setUserPseudo(e.target.value)}
                    className="w-full px-3 py-2.5 rounded-xl bg-stone-900 border border-stone-700 focus:border-amber-500 focus:outline-none text-stone-100 placeholder:text-stone-600"
                  />
                </div>

                {authMode === 'create' ? (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Script de départ</label>
                    <select
                      value={selectedScriptId}
                      onChange={(e) => setSelectedScriptId(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-stone-900 border border-stone-700 focus:border-amber-500 focus:outline-none text-stone-200"
                    >
                      <optgroup label="Scripts Officiels">
                        <option value="tb">Trouble Brewing (Recommandé)</option>
                        <option value="bmr">Bad Moon Rising</option>
                        <option value="snv">Sects & Violets</option>
                      </optgroup>
                      <optgroup label="Teensyville (5-6 Joueurs)">
                        <option value="ngj">Teensyville: No Greater Joy</option>
                        <option value="luf">Teensyville: Laissez un Faire</option>
                      </optgroup>
                    </select>
                  </div>
                ) : (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Code de la Partie</label>
                    <input
                      type="text"
                      placeholder="Ex: 8X3B9Z"
                      value={inputRoomCode}
                      onChange={(e) => {
                        setInputRoomCode(e.target.value.toUpperCase());
                        setJoinError(null);
                      }}
                      className="w-full px-3 py-2.5 rounded-xl bg-stone-900 border border-stone-700 focus:border-purple-500 focus:outline-none text-amber-300 uppercase font-mono tracking-widest font-bold placeholder:text-stone-600"
                    />
                  </div>
                )}

                {joinError && (
                  <div className="p-2 rounded-lg bg-red-950/80 border border-red-500/80 text-red-200 text-xs font-semibold flex items-center gap-1.5 animate-shake">
                    <Icon name="AlertTriangle" className="w-3.5 h-3.5 text-red-400 shrink-0" />
                    <span>{joinError}</span>
                  </div>
                )}

                <button
                  disabled={isConnecting}
                  onClick={async () => {
                    const finalPseudo = userPseudo.trim() || (authMode === 'create' ? 'Conteur' : 'Villageois');
                    setJoinError(null);
                    setIsConnecting(true);

                    if (authMode === 'create') {
                      const newCode = generateUniqueRoomCode();
                      const initialStoryteller = {
                        name: finalPseudo,
                        avatar: '🧙‍♂️',
                        cameraActive: false,
                        micActive: true,
                        currentRoom: 'square'
                      };

                      const newRoomData = {
                        roomCode: newCode,
                        storyteller: initialStoryteller,
                        players: [],
                        selectedScriptId,
                        phase: 'day',
                        dayNumber: 1,
                        gameStarted: false,
                        demonBluffs: [null, null, null],
                        createdAt: Date.now()
                      };

                      await firebaseSync.setRoom(newCode, newRoomData);
                      localStorage.setItem(`botc_room_${newCode}`, JSON.stringify(newRoomData));

                      setRoomCode(newCode);
                      setStoryteller(initialStoryteller);
                      setIsStorytellerMode(true);
                      setPlayers([]);
                      setInLobbyScreen(false);
                      setIsConnecting(false);
                      playSound('bell');
                    } else {
                      const codeToJoin = inputRoomCode.trim().toUpperCase();
                      if (!codeToJoin) {
                        setJoinError("Veuillez saisir le code à 6 lettres du salon.");
                        setIsConnecting(false);
                        return;
                      }

                      // Vérification de l'existence du vrai salon en ligne
                      let existingRoom = await firebaseSync.getRoom(codeToJoin);
                      if (!existingRoom) {
                        try {
                          const localCheck = localStorage.getItem(`botc_room_${codeToJoin}`);
                          if (localCheck) existingRoom = JSON.parse(localCheck);
                        } catch (e) {}
                      }

                      if (!existingRoom) {
                        setJoinError(`Le salon « ${codeToJoin} » n'existe pas. Vérifiez le code avec le Conteur.`);
                        setIsConnecting(false);
                        return;
                      }

                      const currentList = sanitizePlayerList(existingRoom.players);
                      const myId = Date.now() + Math.random();
                      const nextAvatar = BOT_AVATARS[currentList.length % BOT_AVATARS.length];
                      const newJoinedPlayer = sanitizePlayer({
                        id: myId,
                        name: finalPseudo,
                        avatar: nextAvatar,
                        role: null,
                        hypothesisRole: null,
                        alive: true,
                        ghostVote: true,
                        reminders: [],
                        inRoom: 'square',
                        micActive: true
                      }, currentList.length);

                      const updatedPlayers = [...currentList, newJoinedPlayer];
                      await firebaseSync.updateRoom(codeToJoin, { players: updatedPlayers });

                      setRoomCode(codeToJoin);
                      setCurrentUserId(myId);
                      if (existingRoom.storyteller) {
                        setStoryteller(prev => ({ ...prev, ...existingRoom.storyteller }));
                      }
                      setSelectedScriptId(existingRoom.selectedScriptId || 'tb');
                      setPlayers(updatedPlayers);
                      setPhase(existingRoom.phase || 'day');
                      setDayNumber(existingRoom.dayNumber || 1);
                      setGameStarted(Boolean(existingRoom.gameStarted));
                      setIsStorytellerMode(false);
                      setInLobbyScreen(false);
                      setIsConnecting(false);
                      playSound('bell');
                    }
                  }}
                  className={`w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 text-sm shadow-xl transition active:scale-95 ${
                    isConnecting
                      ? 'bg-stone-800 text-stone-500 cursor-not-allowed'
                      : authMode === 'create'
                      ? 'bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-stone-950 font-black'
                      : 'bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 text-white'
                  }`}
                >
                  <span>
                    {isConnecting
                      ? 'Connexion au salon...'
                      : authMode === 'create'
                      ? 'Générer la salle & Ouvrir le Grimoire'
                      : 'Rejoindre ce salon réel'}
                  </span>
                  {!isConnecting && <Icon name="ArrowRight" className="w-4 h-4" />}
                </button>
              </div>

              <div className="mt-6 pt-4 border-t border-stone-800/80 text-center text-[10px] text-stone-500">
                Conforme aux règles officielles The Pandemonium Institute & botc.app
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // RENDU 2 : APPLICATION DE JEU PRINCIPALE
      // ==========================================
      return (
        <div className="min-h-screen w-full flex flex-col font-sans select-none bg-[#100a14] text-stone-100 overflow-hidden relative">
          <div className="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#4a1d4a_1px,transparent_1px)] [background-size:24px_24px]" />

          {/* NOTIFICATION D'INVITATION EN SALON PRIVÉ */}
          {pendingInvite && (
            <div className="bg-gradient-to-r from-purple-900 via-indigo-950 to-purple-900 border-b-2 border-amber-400 px-4 py-2 z-50 flex items-center justify-between shadow-2xl animate-bounce">
              <div className="flex items-center gap-2 text-xs text-amber-200">
                <Icon name="DoorOpen" className="w-4 h-4 text-amber-300" />
                <span>
                  <strong>{pendingInvite.fromPlayerName}</strong> vous invite à rejoindre <strong>« {pendingInvite.roomName} »</strong> pour discuter à l'écart !
                </span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={acceptInvite}
                  className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-xs shadow flex items-center gap-1"
                >
                  <Icon name="Check" className="w-3.5 h-3.5" /> Rejoindre le salon
                </button>
                <button
                  onClick={() => setPendingInvite(null)}
                  className="px-2 py-1 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded text-xs"
                >
                  Décliner
                </button>
              </div>
            </div>
          )}

          {/* BARRE SUPÉRIEURE DE NAVIGATION */}
          <header className="h-12 border-b border-purple-900/40 bg-black/85 backdrop-blur-md px-3 sm:px-4 flex items-center justify-between z-40">
            <div className="flex items-center gap-2 sm:gap-3">
              <div className="flex items-center gap-2">
                <span className="font-serif font-black tracking-widest text-amber-200 text-xs sm:text-sm">
                  BOTC ONLINE
                </span>
                <button
                  onClick={() => {
                    const temp = document.createElement('textarea');
                    temp.value = roomCode;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                    playSound('tick');
                  }}
                  className="px-2 py-0.5 rounded bg-purple-950/80 border border-purple-600/40 text-[10px] font-mono text-amber-300 font-bold hover:bg-purple-900 transition flex items-center gap-1"
                  title="Cliquer pour copier le code de la partie"
                >
                  <span>{roomCode}</span>
                  <span className="text-[9px] text-stone-400">📋</span>
                </button>
              </div>

              <div className="h-4 w-px bg-stone-800 hidden sm:block" />

              {!gameStarted ? (
                <div className="flex items-center gap-1">
                  <select
                    value={selectedScriptId}
                    onChange={(e) => setSelectedScriptId(e.target.value)}
                    className="px-2 py-1 rounded-lg bg-stone-900 border border-amber-600/50 text-xs text-amber-300 font-serif font-bold focus:outline-none"
                  >
                    <optgroup label="Scripts Officiels">
                      <option value="tb">Trouble Brewing</option>
                      <option value="bmr">Bad Moon Rising</option>
                      <option value="snv">Sects & Violets</option>
                    </optgroup>
                    <optgroup label="Teensyville (5-6 Joueurs)">
                      <option value="ngj">Teensy: No Greater Joy</option>
                      <option value="luf">Teensy: Laissez un Faire</option>
                    </optgroup>
                  </select>
                </div>
              ) : (

          {settingsModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-stone-700 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-base text-amber-200">Paramètres de la partie</h4>
                  <button onClick={() => setSettingsModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="block text-stone-300 font-semibold">
                    Vitesse de balayage : {nomination.speed} ms / joueur
                  </label>
                  <input
                    type="range"
                    min="800"
                    max="3000"
                    step="100"
                    value={nomination.speed}
                    onChange={(e) => setNomination(n => ({ ...n, speed: Number(e.target.value) }))}
                    className="w-full accent-amber-500"
                  />
                </div>

                <div className="space-y-2 pt-2 border-t border-stone-800">
                  <div className="text-stone-400 text-[11px]">Déclarer la fin de partie :</div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => { setVictoryModal('good'); setSettingsModalOpen(false); playSound('bell'); }}
                      className="flex-1 py-1.5 bg-blue-900/80 hover:bg-blue-800 border border-blue-500 text-blue-200 font-bold rounded-lg"
                    >
                      Victoire Bien
                    </button>
                    <button
                      onClick={() => { setVictoryModal('evil'); setSettingsModalOpen(false); playSound('bell'); }}
                      className="flex-1 py-1.5 bg-red-900/80 hover:bg-red-800 border border-red-500 text-red-200 font-bold rounded-lg"
                    >
                      Victoire Mal
                    </button>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2 border-t border-stone-800">
                  <button
                    onClick={() => {
                      setInLobbyScreen(true);
                      setSettingsModalOpen(false);
                    }}
                    className="px-3 py-1.5 bg-red-950 hover:bg-red-900 text-red-200 rounded-lg font-semibold flex items-center gap-1"
                  >
                    <Icon name="LogOut" className="w-3.5 h-3.5" /> Quitter la salle
                  </button>

                  <button
                    onClick={() => setSettingsModalOpen(false)}
                    className="px-4 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-lg font-semibold"
                  >
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Composant Error Boundary de secours pour empêcher tout écran noir
    class SafeErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Erreur critique interceptée :", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#100a14] flex flex-col items-center justify-center p-6 text-center select-none">
              <div className="w-16 h-16 rounded-full bg-red-950/80 border-2 border-red-500 flex items-center justify-center text-3xl mb-4">
                ⚠️
              </div>
              <h2 className="text-xl font-bold font-serif text-amber-200 mb-2">Une interruption est survenue</h2>
              <p className="text-xs text-stone-400 max-w-md mb-4">
                {this.state.error?.message || "Erreur de synchronisation avec le salon."}
              </p>
              <button
                onClick={() => {
                  this.setState({ hasError: false, error: null });
                  window.location.reload();
                }}
                className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold rounded-xl text-xs shadow-lg"
              >
                Recharger la salle
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <SafeErrorBoundary>
        <App />
      </SafeErrorBoundary>
    );
  </script>
</body>
</html>
