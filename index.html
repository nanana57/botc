  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==========================================
    // SYNCHRONISATION MULTIJOUEUR FIREBASE & LOCALE
    // ==========================================
    const FIREBASE_DB_URL = "https://botc-3e48e-default-rtdb.europe-west1.firebasedatabase.app";

    const generateUniqueRoomCode = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    };

    const firebaseSync = {
      async getRoom(code) {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`);
          if (!res.ok) return null;
          return await res.json();
        } catch (e) {
          return null;
        }
      },
      async setRoom(code, data) {
        try {
          await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } catch (e) {}
      },
      async updateRoom(code, partial) {
        try {
          await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(partial)
          });
        } catch (e) {}
      }
    };

    const sanitizePlayerList = (raw) => {
      if (!raw) return [];
      const arr = Array.isArray(raw) ? raw : Object.values(raw);
      return arr.filter(Boolean).map(p => ({
        id: p.id || (Date.now() + Math.random()),
        name: p.name || 'Villageois',
        avatar: p.avatar || '🐴',
        role: p.role || null,
        hypothesisRole: p.hypothesisRole || null,
        alive: p.alive !== undefined ? p.alive : true,
        ghostVote: p.ghostVote !== undefined ? p.ghostVote : true,
        reminders: Array.isArray(p.reminders) ? p.reminders : [],
        inRoom: p.inRoom || 'square',
        micActive: p.micActive !== undefined ? p.micActive : true
      }));
    };

    // ---- Helpers de synchro / médias ----
    const vk = (id) => String(id).replace(/[^a-zA-Z0-9]/g, '');
    const peerKeyOf = (code, id) => `botc_${code}_p_${vk(id)}`;
    const fbUrl = (code, path) => `${FIREBASE_DB_URL}/rooms/${code}/${path}.json`;
    const fb = {
      put: (code, path, data) => fetch(fbUrl(code, path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).catch(() => {}),
      del: (code, path) => fetch(fbUrl(code, path), { method: 'DELETE' }).catch(() => {})
    };
    const keep = (prev, next) => (JSON.stringify(prev) === JSON.stringify(next) ? prev : next);
    const hasVideo = (s) => !!s && s.getVideoTracks().some(t => t.readyState === 'live');
    const StreamVideo = ({ stream, className }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && stream) { ref.current.srcObject = stream; ref.current.play().catch(() => {}); }
      }, [stream]);
      return <video ref={ref} autoPlay playsInline muted className={className} />;
    };

    const PLAYER_DISTRIBUTION = {
      5:  { townsfolk: 3, outsider: 0, minion: 1, demon: 1 },

    const DAY_BREAKOUT_ROOMS = [
      { id: 'square', name: 'Place du Village', icon: '🏛️' },
      { id: 'tavern', name: 'Taverne du Corbeau', icon: '🍺' },
      { id: 'forest', name: 'Forêt Sombre', icon: '🌲' },
      { id: 'library', name: 'Bibliothèque', icon: '📚' },
      { id: 'belfry', name: 'Haut Clocher', icon: '🔔' }
    ];

    const BOT_NAMES = ['Brockwell', 'Danielle', 'Kapt’n Kadaver', 'Elizabeth', 'Markus', 'Elin', 'Beardy', 'Ginge', 'Conor', 'Rhett', 'Kurobold', 'Schnauzer'];
    const BOT_AVATARS = ['🐴', '🐺', '🦉', '🦊', '🦅', '🐗', '🦇', '🐈‍⬛', '🦌', '🗡️', '🛡️', '🕯️'];

    function App() {
      // --- LOBBY & SESSION ---
      const [inLobbyScreen, setInLobbyScreen] = useState(true);
      const [authMode, setAuthMode] = useState('create');
      const [userPseudo, setUserPseudo] = useState('');
      const [inputRoomCode, setInputRoomCode] = useState('');
      const [roomCode, setRoomCode] = useState('');
      const [currentUserId, setCurrentUserId] = useState(null);
      const [joinError, setJoinError] = useState(null);
      const [isConnecting, setIsConnecting] = useState(false);

      // --- STORYTELLER (MJ) & VUE ---
      const [storyteller, setStoryteller] = useState({
        name: 'Arif',
        avatar: '🧙‍♂️',
        cameraActive: false,
        micActive: true,
        currentRoom: 'square'
      });
      const [isStorytellerMode, setIsStorytellerMode] = useState(true);

      // --- SCRIPT & BLUFFS ---
      const [selectedScriptId, setSelectedScriptId] = useState('tb');
      const [isScriptDrawerOpen, setIsScriptDrawerOpen] = useState(false);
      const [demonBluffs, setDemonBluffs] = useState([null, null, null]);
      const [demonBluffPickerIndex, setDemonBluffPickerIndex] = useState(null);

      // --- PHASES & MINUTEUR DU JOUR ---
      const [phase, setPhase] = useState('day');
      const [dayNumber, setDayNumber] = useState(1);
      const [dayTimerSeconds, setDayTimerSeconds] = useState(300);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // 8. HISTORIQUE DES VOTES PAR JOUR (RÉSERVÉ AU MJ)
      const [voteHistory, setVoteHistory] = useState([]); // [{ day, nominatorName, nomineeName, votesCount, majorityRequired, voters: [{ name, voted }] }]
      const [voteHistoryModalOpen, setVoteHistoryModalOpen] = useState(false);

      useEffect(() => {
        let interval = null;
        if (phase === 'day' && isTimerRunning && dayTimerSeconds > 0) {
          interval = setInterval(() => {
            setDayTimerSeconds(prev => Math.max(0, prev - 1));
          }, 1000);
        } else if (dayTimerSeconds === 0 && isTimerRunning) {
          setIsTimerRunning(false);
          playSound('gavel');
        }
        return () => clearInterval(interval);
      }, [phase, isTimerRunning, dayTimerSeconds]);

      // --- JOUEURS DU CERCLE ---
      const [players, setPlayers] = useState([]);
      const playersRef = useRef([]);
      playersRef.current = players;
      const [rolesDistributedToPlayers, setRolesDistributedToPlayers] = useState(false);
      const [gameStarted, setGameStarted] = useState(false);

      // --- 3. RÉVÉLATION SECRÈTE DE RÔLE & FERMETURE ---
      const [secretRoleCardOpen, setSecretRoleCardOpen] = useState(false);
      const myPlayer = useMemo(() => {
        return players.find(p => p.id === currentUserId) || null;
      }, [players, currentUserId]);

      const myRoleObj = useMemo(() => {
        if (!myPlayer || !myPlayer.role) return null;
        return ROLES_DB[myPlayer.role] || null;
      }, [myPlayer]);

      useEffect(() => {
        if (!isStorytellerMode && rolesDistributedToPlayers && myRoleObj) {
          setSecretRoleCardOpen(true);
        }
      }, [rolesDistributedToPlayers, isStorytellerMode, myRoleObj]);

      // --- SALONS & COTTAGES ---
      const [currentDayRoom, setCurrentDayRoom] = useState('square');
      const [pendingInvite, setPendingInvite] = useState(null);
      const [customPrivateRooms, setCustomPrivateRooms] = useState([]);
      const [nightState, setNightState] = useState({ at: null, groups: {} }); // nuit : { at = cottage où est le Conteur, groups = cottages partagés }
      const [groupPickerOpen, setGroupPickerOpen] = useState(false);
      const [groupPickerSel, setGroupPickerSel] = useState([]);
      const [cotPanelMin, setCotPanelMin] = useState(false);
      const [roomInput, setRoomInput] = useState('');
      const [needleIn, setNeedleIn] = useState(false);
      const groupList = Object.values(nightState.groups || {});
      const cottageIdOf = (pid) => { const g = groupList.find(x => (x.ids || []).includes(pid)); return g ? g.id : 'own_' + vk(pid); };
      const cottageMembers = (cid) => !cid ? [] : (cid.startsWith('own_')
        ? players.filter(p => 'own_' + vk(p.id) === cid)
        : ((groupList.find(x => x.id === cid) || {}).ids || []).map(id => players.find(p => p.id === id)).filter(Boolean));
      const cottageLabel = (cid) => {
        const m = cottageMembers(cid);
        return cid && cid.startsWith('own_') ? '🏠 Cottage de ' + (m[0] ? m[0].name : '?') : '🏘️ Cottage partagé (' + m.map(x => x.name).join(', ') + ')';
      };
      const myCottageId = myPlayer ? cottageIdOf(myPlayer.id) : null;
      const panelCottageId = phase === 'night' ? (isStorytellerMode ? nightState.at : myCottageId) : null;
      const mjIsHere = !!panelCottageId && nightState.at === panelCottageId;
      const myRoomId = isStorytellerMode ? storyteller.currentRoom : (myPlayer ? myPlayer.inRoom : null);
      const myPrivateRoom = phase === 'day' ? (customPrivateRooms.find(r => r.id === myRoomId) || null) : null;
      const [votes, setVotes] = useState({});
      const votesRef = useRef({});
      const lastVoteTs = useRef(0);
      const posTs = useRef(0);
      const nomRef = useRef(null);
      const tickRef = useRef(null);
      const broadcastRef = useRef(null);
      const lastInviteTs = useRef(0);
      const lastTimerAt = useRef(0);
      const [myTokens, setMyTokens] = useState({});
      const [hoverRole, setHoverRole] = useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [lastReadTs, setLastReadTs] = useState(Date.now());
      const [mailThread, setMailThread] = useState(null);
      const [mailText, setMailText] = useState('');
      const [peerReady, setPeerReady] = useState(false);
      const [peerRetry, setPeerRetry] = useState(0);
      const [cottageChatMessages, setCottageChatMessages] = useState([]);
      const [cottageInputText, setCottageInputText] = useState('');
      const [cottageMailboxOpen, setCottageMailboxOpen] = useState(false);
      const [hasUnreadMessages, setHasUnreadMessages] = useState(false);

      // Un salon d'aparté disparaît quand plus personne n'est dedans (côté Conteur, synchronisé)
      useEffect(() => {
        if (!isStorytellerMode || !roomCode) return;
        const check = () => {
          customPrivateRooms.forEach(r => {
            const used = players.some(p => p.inRoom === r.id) || storyteller.currentRoom === r.id;
            if (!used && Date.now() - (r.createdAt || 0) > 6000) {
              fb.del(roomCode, `privateRooms/${r.id}`);
              setCustomPrivateRooms(prev => prev.filter(x => x.id !== r.id));
            }
          });
        };
        check();
        const iv = setInterval(check, 2000);
        return () => clearInterval(iv);
      }, [players, storyteller.currentRoom, customPrivateRooms]);

      // --- MODALES ---
      const [rolePickerModal, setRolePickerModal] = useState(null);
      const [reminderPickerModal, setReminderPickerModal] = useState(null);
      const [wikiRoleModal, setWikiRoleModal] = useState(null);
      const [nightOrderModalOpen, setNightOrderModalOpen] = useState(false);
      const [nightOrderTab, setNightOrderTab] = useState('first');
      const [settingsModalOpen, setSettingsModalOpen] = useState(false);
      const [victoryModal, setVictoryModal] = useState(null);
      const [switchStorytellerModalOpen, setSwitchStorytellerModalOpen] = useState(false);

      // --- 4. ACCUSATION ET VOTE (DOUBLE AIGUILLE FLUIDE) ---
      const [accusationWizard, setAccusationWizard] = useState(null);
      const [pendingAccusation, setPendingAccusation] = useState(null);
      const [nomination, setNomination] = useState({
        active: false,
        nominatorId: null,
        nomineeId: null,
        clockIndex: -1,
        isRunning: false,
        speed: 3000
      });
      const [onTheBlock, setOnTheBlock] = useState(null);
      const [revealedSeats, setRevealedSeats] = useState({});

      // --- 2. WEBCAM, MICRO & VOCAL : maillage WebRTC complet (PeerJS) ---
      const videoRef = useRef(null);
      const [webcamStream, setWebcamStream] = useState(null);
      const [audioStream, setAudioStream] = useState(null);
      const [isMicMuted, setIsMicMuted] = useState(false);
      const [playerCamActive, setPlayerCamActive] = useState(false);
      const [remoteStreams, setRemoteStreams] = useState({});
      const peerInstance = useRef(null);
      const callsRef = useRef({});
      const localStreamRef = useRef(null);
      const dummyRef = useRef(null);
      const peerIdsRef = useRef([]);
      const hostKey = `botc_${roomCode}_host`;
      const myPeerId = isStorytellerMode ? hostKey : peerKeyOf(roomCode, currentUserId || 'guest');
      const otherPeerIds = [hostKey, ...players.map(p => peerKeyOf(roomCode, p.id))].filter((id, i, a) => id !== myPeerId && a.indexOf(id) === i);
      peerIdsRef.current = otherPeerIds;
      const peerIdsKey = otherPeerIds.join('|');

      // Flux silencieux : permet à tout le monde d'être appelé/entendu même sans micro actif
      const getDummyStream = () => {
        if (!dummyRef.current) {
          try {
            const c = new (window.AudioContext || window.webkitAudioContext)();
            dummyRef.current = c.createMediaStreamDestination().stream;
          } catch (e) { dummyRef.current = new MediaStream(); }
        }
        return dummyRef.current;
      };

      const callPeer = (id, force = false) => {
        const peer = peerInstance.current;
        if (!peer || !peer.open) return;
        const existing = callsRef.current[id];
        if (!force && existing && existing.open) return;
        try { if (existing) existing.close(); } catch (e) {}
        let call = null;
        try { call = peer.call(id, localStreamRef.current || getDummyStream()); } catch (e) {}
        if (!call) return;
        callsRef.current[id] = call;
        call.on('stream', (s) => setRemoteStreams(prev => ({ ...prev, [id]: s })));
        call.on('error', () => {});
      };

      useEffect(() => {
        if (!roomCode || inLobbyScreen || !window.Peer) return;
        let peer = null;
        let retry = null;
        try {
          peer = new window.Peer(myPeerId, {
            debug: 0,
            config: { iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
            ] }
          });
        } catch (e) { return; }
        peerInstance.current = peer;
        peer.on('open', () => setPeerReady(true));
        peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
        peer.on('error', (err) => {
          if (err && err.type === 'unavailable-id') retry = setTimeout(() => setPeerRetry(n => n + 1), 3000);
        });
        peer.on('call', (call) => {
          const old = callsRef.current[call.peer];
          try { if (old && old !== call) old.close(); } catch (e) {}
          callsRef.current[call.peer] = call;
          call.answer(localStreamRef.current || getDummyStream());
          call.on('stream', (s) => setRemoteStreams(prev => ({ ...prev, [call.peer]: s })));
          call.on('error', () => {});
        });
        return () => {
          clearTimeout(retry);
          setPeerReady(false);
          try { peer.destroy(); } catch (e) {}
          callsRef.current = {};
        };
      }, [roomCode, inLobbyScreen, myPeerId, peerRetry]);

      // Connexion aux autres : le plus petit identifiant appelle (évite les appels croisés), relance toutes les 5 s
      useEffect(() => {
        if (!peerReady) return;
        const run = () => peerIdsRef.current.forEach(id => {
          const c = callsRef.current[id];
          if (myPeerId < id && (!c || !c.open)) callPeer(id);
        });
        run();
        const iv = setInterval(run, 5000);
        return () => clearInterval(iv);
      }, [peerReady, peerIdsKey]);

      const rebuildLocal = async (wantAudio, wantVideo) => {
        const wasMuted = isMicMuted;
        if (localStreamRef.current) localStreamRef.current.getTracks().forEach(t => t.stop());
        localStreamRef.current = null;
        try {
          if (wantAudio || wantVideo) {
            localStreamRef.current = await navigator.mediaDevices.getUserMedia({
              audio: wantAudio ? { echoCancellation: true, noiseSuppression: true } : false,
              video: wantVideo ? { width: { ideal: 320 }, height: { ideal: 240 } } : false
            });
            if (wantAudio && wasMuted) localStreamRef.current.getAudioTracks().forEach(t => { t.enabled = false; });
          }
        } catch (e) {
          wantAudio = false; wantVideo = false;
          alert("Micro / caméra inaccessible : autorise l'accès dans le navigateur (la page doit être en HTTPS ou ouverte depuis un fichier local).");
        }
        const s = localStreamRef.current;
        setAudioStream(wantAudio ? s : null);
        setWebcamStream(wantVideo ? s : null);
        setIsMicMuted(wantAudio ? wasMuted : false);
        setPlayerCamActive(wantVideo);
        if (isStorytellerMode) setStoryteller(st => ({ ...st, cameraActive: wantVideo }));
        peerIdsRef.current.forEach(id => callPeer(id, true));
      };

      const toggleMicrophone = async () => {
        if (!audioStream) { await rebuildLocal(true, !!webcamStream); return; }
        const next = !isMicMuted;
        audioStream.getAudioTracks().forEach(t => { t.enabled = !next; });
        setIsMicMuted(next);
      };

      const toggleUserWebcam = async () => {
        await rebuildLocal(!!audioStream, !webcamStream);
      };

      // Qui entend qui : même salon le jour ; la nuit chacun dans son cottage (ou cottage partagé), le Conteur là où il se trouve
      const locOf = (peerId) => {
        const isHost = peerId === hostKey;
        const pl = isHost ? null : players.find(p => peerKeyOf(roomCode, p.id) === peerId);
        if (!isHost && !pl) return null;
        if (phase === 'night') return isHost ? (nightState.at || 'hall') : cottageIdOf(pl.id);
        return isHost ? storyteller.currentRoom : pl.inRoom;
      };

      useEffect(() => {
        const myLoc = locOf(myPeerId);
        Object.entries(remoteStreams).forEach(([pId, stream]) => {
          let audioEl = document.getElementById(`audio_peer_${pId}`);
          if (!audioEl) {
            audioEl = document.createElement('audio');
            audioEl.id = `audio_peer_${pId}`;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);
          }
          if (audioEl.srcObject !== stream) audioEl.srcObject = stream;
          const theirLoc = locOf(pId);
          audioEl.muted = !(myLoc && theirLoc && myLoc === theirLoc);
          audioEl.play().catch(() => {});
        });
      }, [remoteStreams, players, phase, storyteller, nightState, myPeerId]);

      // --- AUDIO SYNTHÉTISEUR ---
      const playSound = (type = 'bell') => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'bell') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(293.66, ctx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
            osc.start();
            osc.stop(ctx.currentTime + 1.3);
          } else if (type === 'tick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.start();
            osc.stop(ctx.currentTime + 0.09);
          } else if (type === 'gavel') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          }
        } catch (e) {}
      };

      // --- SYNCHRONISATION MULTIJOUEUR (le Conteur fait autorité, chaque joueur écrit seulement ses propres données) ---
      useEffect(() => {
        if (!roomCode || inLobbyScreen) return;
        let isCancelled = false;
        const myK = isStorytellerMode ? 'host' : vk(currentUserId || 'x');

        const pollGameState = async () => {
          const data = await firebaseSync.getRoom(roomCode);
          if (!data || isCancelled) return;
          const positions = data.positions || {};
          const remoteList = sanitizePlayerList(data.players);

          if (isStorytellerMode) {
            // Le Conteur garde son état et n'ajoute que les nouveaux arrivants
            const local = playersRef.current;
            const known = new Set(local.map(p => p.id));
            const incoming = [...remoteList, ...sanitizePlayerList(data.joins)];
            const fresh = incoming.filter((p, i, a) => !known.has(p.id) && a.findIndex(q => q.id === p.id) === i);
            const merged = [...local.map(p => ({ ...p, inRoom: positions[vk(p.id)] || p.inRoom })), ...fresh];
            if (fresh.length || merged.some((p, i) => p.inRoom !== local[i].inRoom)) {
              playersRef.current = merged;
              setPlayers(merged);
              if (fresh.length && broadcastRef.current) broadcastRef.current(merged);
            }
          } else {
            setPlayers(prev => remoteList.map(rp => {
              const lp = prev.find(x => x.id === rp.id);
              const mineRecent = rp.id === currentUserId && Date.now() - posTs.current < 2500;
              return {
                ...rp,
                inRoom: mineRecent && lp ? lp.inRoom : (positions[vk(rp.id)] || rp.inRoom),
                hypothesisRole: lp && lp.hypothesisRole !== undefined ? lp.hypothesisRole : rp.hypothesisRole
              };
            }));
            if (data.phase) setPhase(data.phase);
            if (data.dayNumber !== undefined) setDayNumber(data.dayNumber);
            setGameStarted(Boolean(data.gameStarted));
            setRolesDistributedToPlayers(Boolean(data.rolesDistributedToPlayers));
            setNomination(prev => keep(prev, data.nomination || { active: false, nominatorId: null, nomineeId: null, clockIndex: -1, isRunning: false, speed: 3000 }));
            if (data.storyteller) setStoryteller(prev => keep(prev, data.storyteller));
            if (data.selectedScriptId) setSelectedScriptId(data.selectedScriptId);
            setOnTheBlock(prev => keep(prev, data.onTheBlock || null));
            const nt = data.night || {};
            setNightState(prev => keep(prev, { at: nt.at || null, groups: nt.groups || {} }));
            if (data.timerAt && data.timerAt !== lastTimerAt.current) {
              lastTimerAt.current = data.timerAt;
              const run = Boolean(data.isTimerRunning);
              const base = data.dayTimerSeconds || 0;
              setIsTimerRunning(run);
              setDayTimerSeconds(run ? Math.max(0, base - Math.floor((Date.now() - data.timerAt) / 1000)) : base);
            }
            if (currentUserId) {
              const inv = (data.invites || {})[vk(currentUserId)];
              if (inv && inv.ts !== lastInviteTs.current) {
                lastInviteTs.current = inv.ts;
                setPendingInvite(inv);
                playSound('bell');
              }
            }
          }

          // Salons d'aparté : visibles par tous (le Conteur aussi), on garde ceux créés il y a moins de 4 s en local
          const remoteRooms = Object.values(data.privateRooms || {});
          setCustomPrivateRooms(prev => keep(prev, [...remoteRooms, ...prev.filter(r => Date.now() - (r.createdAt || 0) < 4000 && !remoteRooms.some(x => x.id === r.id))]));

          // Votes : une entrée par joueur, écrite par le joueur lui-même
          if (Date.now() - lastVoteTs.current > 1500) {
            const v = data.votes || {};
            if (JSON.stringify(v) !== JSON.stringify(votesRef.current)) { votesRef.current = v; setVotes(v); }
          }
          setPendingAccusation(prev => keep(prev, data.pending || null));

          // Messagerie : le Conteur voit tout, un joueur voit ce qui le concerne
          const all = Object.values(data.chat || {}).sort((a, b) => a.ts - b.ts);
          const mine = isStorytellerMode ? all.filter(m => !String(m.thread).startsWith('room:') || (m.members || []).includes('host')) : all.filter(m => Array.isArray(m.members) && m.members.includes(myK));
          setChatMessages(prev => (prev.length === mine.length && (prev[prev.length - 1] || {}).id === (mine[mine.length - 1] || {}).id) ? prev : mine);
        };

        const interval = setInterval(pollGameState, 1000);
        pollGameState();
        return () => { isCancelled = true; clearInterval(interval); };
      }, [roomCode, inLobbyScreen, isStorytellerMode, currentUserId]);

      // Le Conteur écrit uniquement ses champs (PATCH) : plus d'écrasement de l'état des autres
      const broadcastGameState = (
        newPlayers = playersRef.current,
        newPhase = phase,
        newStarted = gameStarted,
        extraUpdates = {}
      ) => {
        if (!roomCode) return;
        if (!isStorytellerMode) {
          if (Object.keys(extraUpdates).length) firebaseSync.updateRoom(roomCode, extraUpdates);
          return;
        }
        firebaseSync.updateRoom(roomCode, {
          players: newPlayers,
          phase: newPhase,
          dayNumber,
          gameStarted: newStarted,
          rolesDistributedToPlayers,
          storyteller,
          selectedScriptId,
          demonBluffs,
          onTheBlock: onTheBlock || null,
          voteHistory,
          dayTimerSeconds,
          isTimerRunning,
          timerAt: Date.now(),
          lastUpdated: Date.now(),
          ...extraUpdates
        });
      };
      broadcastRef.current = broadcastGameState;

      // Minuteur du jour synchronisé (marche/pause)
      useEffect(() => {
        if (isStorytellerMode && roomCode && !inLobbyScreen) {
          firebaseSync.updateRoom(roomCode, { isTimerRunning, dayTimerSeconds, timerAt: Date.now() });
        }
      }, [isTimerRunning, Math.floor(dayTimerSeconds / 15)]);

      // --- SALONS ---
      const changeUserRoom = (roomId) => {
        if (phase === 'night') return;
        setCurrentDayRoom(roomId);
        if (isStorytellerMode) {
          const st = { ...storyteller, currentRoom: roomId };
          setStoryteller(st);
          broadcastGameState(playersRef.current, phase, gameStarted, { storyteller: st });
        } else if (myPlayer) {
          posTs.current = Date.now();
          setPlayers(prev => prev.map(p => p.id === myPlayer.id ? { ...p, inRoom: roomId } : p));
          fb.put(roomCode, `positions/${vk(myPlayer.id)}`, roomId);
        }
      };

      // --- COTTAGES DE NUIT : chacun dans le sien, le Conteur circule, cottages partagés possibles ---
      const pushNight = (n) => { setNightState(n); if (roomCode) fb.put(roomCode, 'night', n); };
      const moveToCottage = (cid) => pushNight({ ...nightState, at: cid });
      const leaveCottage = () => pushNight({ ...nightState, at: null });
      const closeCottage = () => { setNightState({ at: null, groups: {} }); if (roomCode) fb.del(roomCode, 'night'); };
      const regroup = (gid, ids, goThere) => {
        const groups = {};
        Object.values(nightState.groups || {}).forEach(g => {
          if (g.id === gid) return;
          const rest = (g.ids || []).filter(i => !ids.includes(i));
          if (rest.length >= 2) groups[g.id] = { ...g, ids: rest };
        });
        if (ids.length >= 2) groups[gid] = { id: gid, ids };
        let at = nightState.at;
        if (goThere && groups[gid]) at = gid;
        else if (at && !groups[at] && !at.startsWith('own_')) at = null;
        else if (at && at.startsWith('own_') && ids.some(i => 'own_' + vk(i) === at)) at = groups[gid] ? gid : at;
        pushNight({ at, groups });
      };
      const createSharedCottage = (ids) => { if (ids.length >= 2) regroup('grp_' + Date.now(), ids, true); };
      const dissolveGroup = (gid) => regroup(gid, [], false);

      // Messages du cottage où l'on se trouve (visibles uniquement par ses occupants + le Conteur)
      const cotThread = panelCottageId ? 'cot:' + panelCottageId : null;
      const cotMembersP = cottageMembers(panelCottageId);
      const cotMessages = chatMessages.filter(m => m.thread === cotThread);
      const sendCottageMsg = () => {
        const text = cottageInputText.trim();
        if (!text || !cotThread) return;
        sendChat(text, cotThread, cottageLabel(panelCottageId), ['host', ...cotMembersP.map(p => vk(p.id))]);
        setCottageInputText('');
      };

      // Chat de l'aparté (salon privé de jour)
      const roomOccupants = myPrivateRoom ? players.filter(p => p.inRoom === myPrivateRoom.id) : [];
      const roomThread = myPrivateRoom ? 'room:' + myPrivateRoom.id : null;
      const roomMessages = chatMessages.filter(m => m.thread === roomThread);
      const sendRoomMsg = () => {
        const text = roomInput.trim();
        if (!text || !roomThread) return;
        const members = roomOccupants.map(p => vk(p.id));
        if (storyteller.currentRoom === myPrivateRoom.id) members.push('host');
        if (!members.includes(myKey)) members.push(myKey);
        sendChat(text, roomThread, '🔒 Aparté (' + roomOccupants.map(p => p.name).join(', ') + ')', members);
        setRoomInput('');
      };

      // Passage jour <-> nuit : tout le monde revient sur la place / dans son cottage, apartés supprimés
      const switchPhase = () => {
        playSound('bell');
        const nextPhase = phase === 'day' ? 'night' : 'day';
        const nextDay = phase === 'night' ? dayNumber + 1 : dayNumber;
        const reset = playersRef.current.map(p => ({ ...p, inRoom: 'square' }));
        const st = { ...storyteller, currentRoom: 'square' };
        playersRef.current = reset;
        setPhase(nextPhase);
        setDayNumber(nextDay);
        setPlayers(reset);
        setStoryteller(st);
        setCurrentDayRoom('square');
        setNightState({ at: null, groups: {} });
        setCustomPrivateRooms([]);
        if (nomRef.current && nomRef.current.active) pushNomination({ ...nomRef.current, active: false, isRunning: false, clockIndex: -1 });
        if (roomCode) ['night', 'positions', 'privateRooms', 'invites'].forEach(k => fb.del(roomCode, k));
        broadcastGameState(reset, nextPhase, gameStarted, { storyteller: st, dayNumber: nextDay });
      };

      // --- MESSAGERIE (historique + notification) ---
      const myKey = isStorytellerMode ? 'host' : vk(currentUserId || 'x');
      const sendChat = (text, thread, threadLabel, members) => {
        const id = `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const msg = {
          id, text, thread, threadLabel, members,
          from: isStorytellerMode ? storyteller.name : (myPlayer ? myPlayer.name : 'Moi'),
          fromId: myKey,
          ts: Date.now()
        };
        setChatMessages(prev => [...prev, msg]);
        fb.put(roomCode, `chat/${id}`, msg);
      };
      const cottagePanelVisible = phase === 'night' && !!panelCottageId && !cotPanelMin;
      const unreadCount = chatMessages.filter(m => m.ts > lastReadTs && m.fromId !== myKey).length;
      useEffect(() => {
        if (cottageMailboxOpen || cottagePanelVisible || myPrivateRoom) setLastReadTs(Date.now());
      }, [chatMessages.length, cottageMailboxOpen, cottagePanelVisible, !!myPrivateRoom]);
      useEffect(() => { if (!isStorytellerMode && mjIsHere) playSound('bell'); }, [mjIsHere]);
      const prevUnread = useRef(0);
      useEffect(() => {
        if (unreadCount > prevUnread.current) playSound('bell');
        prevUnread.current = unreadCount;
      }, [unreadCount]);

      // --- JETONS DE RAPPEL : le Conteur les synchronise, les joueurs ont les leurs (privés) ---
      const addReminder = (idx, label) => {
        const target = playersRef.current[idx];
        if (!target) return;
        if (isStorytellerMode) {
          const updated = playersRef.current.map((p, i) => (i === idx && !p.reminders.includes(label)) ? { ...p, reminders: [...p.reminders, label] } : p);
          setPlayers(updated);
          broadcastGameState(updated);
        } else {
          setMyTokens(prev => {
            const cur = prev[target.id] || [];
            return cur.includes(label) ? prev : { ...prev, [target.id]: [...cur, label] };
          });
        }
        setReminderPickerModal(null);
        playSound('bell');
      };
      const removeReminder = (p, rIdx) => {
        if (isStorytellerMode) {
          const updated = playersRef.current.map(pl => pl.id === p.id ? { ...pl, reminders: pl.reminders.filter((_, i) => i !== rIdx) } : pl);
          setPlayers(updated);
          broadcastGameState(updated);
        } else {
          setMyTokens(prev => ({ ...prev, [p.id]: (prev[p.id] || []).filter((_, i) => i !== rIdx) }));
        }
      };

      // --- QUOTAS OFFICIELS BOTC ---
      const currentScript = SCRIPTS_DATA[selectedScriptId] || SCRIPTS_DATA.tb;
      const officialQuota = PLAYER_DISTRIBUTION[players.length] || null;

      const dynamicQuota = useMemo(() => {
        if (!officialQuota) return null;
        let townsfolk = officialQuota.townsfolk;
        let outsider = officialQuota.outsider;
        let minion = officialQuota.minion;
        let demon = officialQuota.demon;

        const hasBaron = players.some(p => p.role === 'baron');
        if (hasBaron) {
          outsider += 2;
          townsfolk = Math.max(0, townsfolk - 2);
        }

        return { townsfolk, outsider, minion, demon, hasBaron };
      }, [officialQuota, players]);

      const addPlayerSeat = (customName = null) => {
        if (players.length >= 15 || gameStarted) return;
        const nextIdx = players.length;
        const name = customName || BOT_NAMES[nextIdx % BOT_NAMES.length] || `Joueur ${nextIdx + 1}`;
        const newPlayer = {
          id: Date.now() + Math.random(),
          name,
          avatar: BOT_AVATARS[nextIdx % BOT_AVATARS.length],
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };
        const updated = [...playersRef.current, newPlayer];
        setPlayers(updated);
        broadcastGameState(updated);
      };

      const handleAutoDistributeRoles = () => {
        if (players.length < 5 || gameStarted) return;
        const dist = PLAYER_DISTRIBUTION[players.length];
        if (!dist) return;

        let targetTownsfolk = dist.townsfolk;
        let targetOutsiders = dist.outsider;
        let targetMinions = dist.minion;
        let targetDemons = dist.demon;

        const scriptRoles = currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean);
        const avTownsfolk = scriptRoles.filter(r => r.team === 'townsfolk');
        const avOutsiders = scriptRoles.filter(r => r.team === 'outsider');
        const avMinions = scriptRoles.filter(r => r.team === 'minion');
        const avDemons = scriptRoles.filter(r => r.team === 'demon');

        const chosenDemon = avDemons[Math.floor(Math.random() * avDemons.length)];
        const chosenMinions = [...avMinions].sort(() => 0.5 - Math.random()).slice(0, targetMinions);

        if (chosenMinions.some(m => m.id === 'baron')) {
          targetOutsiders = Math.min(targetOutsiders + 2, avOutsiders.length);
          targetTownsfolk = Math.max(0, targetTownsfolk - 2);
        }

        const chosenOutsiders = [...avOutsiders].sort(() => 0.5 - Math.random()).slice(0, targetOutsiders);
        const chosenTownsfolk = [...avTownsfolk].sort(() => 0.5 - Math.random()).slice(0, targetTownsfolk);

        const fullPool = [
          chosenDemon,
          ...chosenMinions,
          ...chosenOutsiders,
          ...chosenTownsfolk
        ].filter(Boolean).sort(() => 0.5 - Math.random());

        const updated = playersRef.current.map((p, idx) => ({ ...p, role: fullPool[idx]?.id || null }));
        setPlayers(updated);
        broadcastGameState(updated);
        playSound('bell');
      };

      const handleRandomizeDemonBluffs = () => {
        const inGameRoles = new Set(players.map(p => p.role).filter(Boolean));
        const availableGood = currentScript.roles
          .map(id => ROLES_DB[id])
          .filter(r => r && (r.team === 'townsfolk' || r.team === 'outsider') && !inGameRoles.has(r.id));

        const shuffled = [...availableGood].sort(() => 0.5 - Math.random());
        const bluffs = [shuffled[0]?.id || null, shuffled[1]?.id || null, shuffled[2]?.id || null];
        setDemonBluffs(bluffs);
        broadcastGameState(playersRef.current, phase, gameStarted, { demonBluffs: bluffs });
        playSound('bell');
      };

      const handleStartGame = () => {
        if (players.length < 5) return;
        let currentPoolPlayers = [...playersRef.current];
        const needsDistribution = currentPoolPlayers.some(p => !p.role);
        
        // 3. DISTRIBUTION ET TRANSMISSION AUTOMATIQUE DES RÔLES AU DÉMARRAGE
        if (needsDistribution) {
          const dist = PLAYER_DISTRIBUTION[players.length];
          if (dist) {
            let targetTownsfolk = dist.townsfolk;
            let targetOutsiders = dist.outsider;
            let targetMinions = dist.minion;
            let targetDemons = dist.demon;

            const scriptRoles = currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean);
            const avTownsfolk = scriptRoles.filter(r => r.team === 'townsfolk');
            const avOutsiders = scriptRoles.filter(r => r.team === 'outsider');
            const avMinions = scriptRoles.filter(r => r.team === 'minion');
            const avDemons = scriptRoles.filter(r => r.team === 'demon');

            const chosenDemon = avDemons[Math.floor(Math.random() * avDemons.length)];
            const chosenMinions = [...avMinions].sort(() => 0.5 - Math.random()).slice(0, targetMinions);

            if (chosenMinions.some(m => m.id === 'baron')) {
              targetOutsiders = Math.min(targetOutsiders + 2, avOutsiders.length);
              targetTownsfolk = Math.max(0, targetTownsfolk - 2);
            }

            const chosenOutsiders = [...avOutsiders].sort(() => 0.5 - Math.random()).slice(0, targetOutsiders);
            const chosenTownsfolk = [...avTownsfolk].sort(() => 0.5 - Math.random()).slice(0, targetTownsfolk);

            const fullPool = [
              chosenDemon,
              ...chosenMinions,
              ...chosenOutsiders,
              ...chosenTownsfolk
            ].filter(Boolean).sort(() => 0.5 - Math.random());

            currentPoolPlayers = currentPoolPlayers.map((p, idx) => ({ ...p, role: fullPool[idx]?.id || null }));
            setPlayers(currentPoolPlayers);
          }
        }
        
        setGameStarted(true);
        setRolesDistributedToPlayers(true);
        setPhase('night');
        setDayNumber(1);
        broadcastGameState(currentPoolPlayers, 'night', true, { rolesDistributedToPlayers: true });
        playSound('bell');
      };

      // --- 4. ACCUSATION & VOTE (façon botc.app) : aiguille accusateur + aiguille accusé, puis la main dorée balaie automatiquement ---
      nomRef.current = nomination;

      const nomineeIndex = useMemo(() => {
        if (!nomination.active || !nomination.nomineeId || players.length === 0) return -1;
        return players.findIndex(p => p.id === nomination.nomineeId);
      }, [nomination.active, nomination.nomineeId, players]);

      const nominatorIndex = useMemo(() => {
        if (!nomination.active || !nomination.nominatorId || players.length === 0) return -1;
        return players.findIndex(p => p.id === nomination.nominatorId);
      }, [nomination.active, nomination.nominatorId, players]);

      // Ordre de vote : on commence juste après l'accusé et on finit par lui, dans le sens des aiguilles
      const orderedVoters = useMemo(() => {
        if (nomineeIndex === -1 || players.length === 0) return [];
        const ordered = [];
        for (let i = 1; i <= players.length; i++) ordered.push(players[(nomineeIndex + i) % players.length]);
        return ordered;
      }, [nomineeIndex, players]);

      const nomineeAngle = nomineeIndex === -1 || players.length === 0 ? 0 : (nomineeIndex / players.length) * 360;
      const nominatorAngle = nominatorIndex === -1 || players.length === 0 ? 0 : (nominatorIndex / players.length) * 360;
      // Angle continu (toujours croissant) : la main dorée avance de siège en siège sans repartir en arrière
      const sweeperAngle = nomination.clockIndex < 0 || players.length === 0 ? 0 : nomineeAngle + (nomination.clockIndex + 1) * (360 / players.length);

      const currentVoter = nomination.clockIndex >= 0 ? orderedVoters[nomination.clockIndex] : null;
      const lockedVotes = nomination.locked || {};
      const eligibleToVote = (p) => !!p && (p.alive || p.ghostVote);
      const orderIdxOf = (pid) => orderedVoters.findIndex(v => v.id === pid);
      // 'passed' : l'aiguille est déjà passée (vote verrouillé) · 'current' : l'aiguille est dessus · 'future' : pas encore
      const voteStatusOf = (p) => {
        const i = orderIdxOf(p.id);
        if (nomination.clockIndex > i) return 'passed';
        return nomination.clockIndex === i ? 'current' : 'future';
      };
      const voteValueOf = (p) => {
        if (!eligibleToVote(p)) return false;
        return voteStatusOf(p) === 'passed' ? Boolean(lockedVotes[vk(p.id)]) : Boolean(votes[vk(p.id)]);
      };
      const countedVotes = orderedVoters.filter((v, i) => i <= nomination.clockIndex && voteValueOf(v)).length;

      const myOrderIdx = myPlayer ? orderIdxOf(myPlayer.id) : -1;
      const canIVote = !isStorytellerMode && nomination.active && !!myPlayer && eligibleToVote(myPlayer) && myOrderIdx !== -1;
      const myVoteLocked = canIVote && nomination.clockIndex > myOrderIdx;
      const myTurnToVote = canIVote && nomination.clockIndex === myOrderIdx;

      useEffect(() => { if (myTurnToVote) playSound('bell'); }, [myTurnToVote]);

      // Les deux aiguilles se placent en douceur au début de l'accusation
      useEffect(() => {
        if (!nomination.active) { setNeedleIn(false); return; }
        const t = setTimeout(() => setNeedleIn(true), 80);
        return () => clearTimeout(t);
      }, [nomination.active, nomination.nomineeId, nomination.nominatorId]);

      const pushNomination = (n) => {
        nomRef.current = n;
        setNomination(n);
        if (roomCode) fb.put(roomCode, 'nomination', n);
      };

      // Chaque joueur peut changer d'avis librement tant que l'aiguille n'a pas quitté son siège
      const castVote = (p, val) => {
        const i = orderIdxOf(p.id);
        const cur = nomRef.current;
        if (cur && cur.clockIndex > i) {
          if (!isStorytellerMode) return;
          pushNomination({ ...cur, locked: { ...(cur.locked || {}), [vk(p.id)]: val } });
          return;
        }
        const key = vk(p.id);
        const next = { ...votesRef.current, [key]: val };
        votesRef.current = next;
        setVotes(next);
        lastVoteTs.current = Date.now();
        if (roomCode) fb.put(roomCode, `votes/${key}`, val);
      };

      const finishNomination = (locked) => {
        playSound('gavel');
        const cur = nomRef.current;
        const ps = playersRef.current;
        const nominee = ps.find(p => p.id === cur.nomineeId);
        const nominator = ps.find(p => p.id === cur.nominatorId);
        const voters = ps.map(p => ({ id: p.id, name: p.name, voted: Boolean(locked[vk(p.id)]) }));
        const total = voters.filter(v => v.voted).length;
        const required = Math.ceil(ps.filter(p => p.alive).length / 2);
        let block = onTheBlock;
        if (nominee && total >= required) {
          if (!block || total > block.votes) block = { playerId: nominee.id, playerName: nominee.name, votes: total };
          else if (total === block.votes) block = null;
        }
        const updated = ps.map(p => (!p.alive && locked[vk(p.id)]) ? { ...p, ghostVote: false } : p);
        const rec = {
          day: dayNumber,
          nominatorName: nominator ? nominator.name : 'Inconnu',
          nomineeName: nominee ? nominee.name : '?',
          votesCount: total,
          majorityRequired: required,
          voters
        };
        const newHist = [...voteHistory, rec];
        setPlayers(updated);
        setOnTheBlock(block);
        setVoteHistory(newHist);
        pushNomination({
          ...cur, locked, active: false, isRunning: false, clockIndex: -1,
          result: { nomineeName: rec.nomineeName, total, required, onBlock: Boolean(block && nominee && block.playerId === nominee.id) }
        });
        broadcastGameState(updated, phase, gameStarted, { onTheBlock: block || null, voteHistory: newHist });
      };

      // Chaque pas de l'horloge : on verrouille le vote du joueur que l'aiguille quitte
      tickRef.current = () => {
        const cur = nomRef.current;
        if (!cur || !cur.active) return;
        const locked = { ...(cur.locked || {}) };
        const leaving = cur.clockIndex >= 0 ? orderedVoters[cur.clockIndex] : null;
        if (leaving) locked[vk(leaving.id)] = eligibleToVote(leaving) && Boolean(votesRef.current[vk(leaving.id)]);
        if (cur.clockIndex + 1 >= orderedVoters.length) finishNomination(locked);
        else pushNomination({ ...cur, locked, clockIndex: cur.clockIndex + 1 });
      };

      // Horloge automatique (vitesse réglable dans les paramètres du Conteur)
      useEffect(() => {
        if (!isStorytellerMode || !nomination.active || !nomination.isRunning) return;
        const t = setTimeout(() => {
          playSound('tick');
          if (tickRef.current) tickRef.current();
        }, nomination.clockIndex < 0 ? 2500 : (nomination.speed || 3000));
        return () => clearTimeout(t);
      }, [isStorytellerMode, nomination.active, nomination.isRunning, nomination.clockIndex, nomination.speed]);

      const startNomination = (acc) => {
        if (!acc || !isStorytellerMode) return;
        playSound('bell');
        votesRef.current = {};
        setVotes({});
        lastVoteTs.current = Date.now();
        if (roomCode) { fb.del(roomCode, 'votes'); fb.del(roomCode, 'pending'); }
        setPendingAccusation(null);
        pushNomination({
          active: true,
          nominatorId: acc.nominatorId,
          nomineeId: acc.nomineeId,
          clockIndex: -1,
          isRunning: true,
          speed: (nomRef.current && nomRef.current.speed) || 3000
        });
      };

      const clearPending = () => {
        setPendingAccusation(null);
        if (roomCode) fb.del(roomCode, 'pending');
      };

      const openAccusationWizard = () => setAccusationWizard(
        isStorytellerMode
          ? { step: 1, nominatorId: null, nomineeId: null }
          : { step: 2, nominatorId: myPlayer ? myPlayer.id : null, nomineeId: null }
      );

      const submitAccusation = (accused) => {
        const nominator = players.find(pl => pl.id === accusationWizard.nominatorId);
        setAccusationWizard(null);
        if (!nominator) return;
        const acc = { nominatorId: nominator.id, nomineeId: accused.id, nominatorName: nominator.name, nomineeName: accused.name };
        if (isStorytellerMode) startNomination(acc);
        else { setPendingAccusation(acc); fb.put(roomCode, 'pending', acc); playSound('bell'); }
      };

      const togglePlayerLife = (playerId) => {
        const updated = playersRef.current.map(p => p.id === playerId ? { ...p, alive: !p.alive } : p);
        setPlayers(updated);
        broadcastGameState(updated);
      };

      const executePlayerOnBlock = () => {
        if (!onTheBlock) return;
        playSound('gavel');
        const updated = playersRef.current.map(p => p.id === onTheBlock.playerId ? { ...p, alive: false } : p);
        setPlayers(updated);
        setOnTheBlock(null);
        const newNom = { ...nomination, active: false, isRunning: false };
        setNomination(newNom);
        broadcastGameState(updated, phase, gameStarted, { onTheBlock: null, nomination: newNom });
      };

      // Invitation en aparté : si on est déjà dans un aparté, on y invite le joueur ; sinon on en crée un
      const sendRoomInvite = (target) => {
        let room = myPrivateRoom;
        if (!room) {
          room = { id: `private_${Date.now()}`, name: 'Aparté', icon: '🔒', private: true, createdAt: Date.now() };
          setCustomPrivateRooms(prev => [...prev, room]);
          fb.put(roomCode, `privateRooms/${room.id}`, room);
          changeUserRoom(room.id);
        }
        fb.put(roomCode, `invites/${vk(target.id)}`, {
          roomId: room.id, roomName: room.name, ts: Date.now(),
          from: isStorytellerMode ? storyteller.name : (myPlayer ? myPlayer.name : 'Un villageois')
        });
        playSound('bell');
      };

      const dismissInvite = () => {
        if (myPlayer) fb.del(roomCode, `invites/${vk(myPlayer.id)}`);
        setPendingInvite(null);
      };

      const acceptInvite = () => {
        if (!pendingInvite) return;
        changeUserRoom(pendingInvite.roomId);
        dismissInvite();
      };

      const shufflePlayerSeats = () => {
        if (players.length < 2) return;
        const updated = [...playersRef.current].sort(() => 0.5 - Math.random());
        setPlayers(updated);
        broadcastGameState(updated);
        playSound('bell');
      };

      const handlePromoteToStoryteller = (newStorytellerPlayer) => {
        const demotedStorytellerPlayer = {
          id: Date.now() + Math.random(),
          name: storyteller.name,
          avatar: storyteller.avatar,
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };

        const updatedSt = {
          name: newStorytellerPlayer.name,
          avatar: newStorytellerPlayer.avatar,
          cameraActive: false,
          micActive: true,
          currentRoom: 'square'
        };

        setStoryteller(updatedSt);

        const updatedPlayers = [
          ...playersRef.current.filter(p => p.id !== newStorytellerPlayer.id),
          demotedStorytellerPlayer
        ];

        setPlayers(updatedPlayers);
        setSwitchStorytellerModalOpen(false);
        broadcastGameState(updatedPlayers, phase, gameStarted);
        playSound('bell');
      };

      const resetGameForRematch = () => {
        setGameStarted(false);
        setPhase('day');
        setDayNumber(1);
        setRolesDistributedToPlayers(false);
        setNomination({ active: false, nominatorId: null, nomineeId: null, clockIndex: -1, isRunning: false, votes: {}, speed: 1600 });
        setOnTheBlock(null);
        setVictoryModal(null);
        setRevealedSeats({});
        closeCottage();
        votesRef.current = {};
        setVotes({});
        if (roomCode) { fb.del(roomCode, 'votes'); fb.del(roomCode, 'nomination'); fb.del(roomCode, 'pending'); }
        setDemonBluffs([null, null, null]);
        setDayTimerSeconds(300);
        setIsTimerRunning(false);

        const updated = playersRef.current.map(p => ({
          ...p,
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square'
        }));

        setPlayers(updated);
        broadcastGameState(updated, 'day', false);
        playSound('bell');
      };

      const aliveCount = players.filter(p => p.alive).length;
      const majorityRequired = Math.ceil(aliveCount / 2);

      // ==========================================
      // RENDU 1 : ÉCRAN DE CONNEXION / LOBBY
      // ==========================================
      if (inLobbyScreen) {
        return (
          <div className="h-screen w-screen flex items-center justify-center p-4 bg-[#0e0712] text-stone-100 font-sans relative overflow-hidden select-none">
            <div className="absolute inset-0 pointer-events-none opacity-30 bg-[radial-gradient(#4a1d4a_1px,transparent_1px)] [background-size:24px_24px]" />
            
            <div className="relative z-10 w-full max-w-sm sm:max-w-md bg-stone-950/90 border-2 border-amber-600/60 rounded-3xl p-6 shadow-2xl backdrop-blur-xl">
              <div className="text-center space-y-2 mb-5">
                <div className="w-14 h-14 rounded-full bg-purple-950/90 border-2 border-amber-500/80 flex items-center justify-center text-3xl mx-auto shadow-lg">
                  😈
                </div>
                <h1 className="font-serif font-black text-2xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200">
                  BOTC ONLINE
                </h1>
                <p className="text-xs text-stone-400 font-serif italic">
                  Grimoire & Place du Village de Ravenswood Bluff
                </p>
              </div>

              <div className="flex rounded-xl bg-stone-900/80 p-1 border border-stone-800 mb-5">
                <button
                  onClick={() => setAuthMode('create')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${
                    authMode === 'create'
                      ? 'bg-amber-600 text-stone-950 shadow-md font-black'
                      : 'text-stone-400 hover:text-stone-200'
                  }`}
                >
                  <Icon name="Crown" className="w-3.5 h-3.5" /> Créer (MJ)
                </button>
                <button
                  onClick={() => setAuthMode('join')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${
                    authMode === 'join'
                      ? 'bg-purple-700 text-white shadow-md'
                      : 'text-stone-400 hover:text-stone-200'
                  }`}
                >
                  <Icon name="LogIn" className="w-3.5 h-3.5" /> Rejoindre
                </button>
              </div>

              <div className="space-y-4 text-xs">
                <div>
                  <label className="block text-stone-300 font-bold mb-1">Votre Pseudo</label>
                  <input
                    type="text"
                    placeholder="Ex: Arif, Markus..."
                    value={userPseudo}
                    onChange={(e) => setUserPseudo(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-stone-900 border border-stone-700 focus:border-amber-500 focus:outline-none text-stone-100 placeholder:text-stone-600"
                  />
                </div>

                {authMode === 'create' ? (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Script de départ</label>
                    <select
                      value={selectedScriptId}
                      onChange={(e) => setSelectedScriptId(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-stone-900 border border-stone-700 focus:border-amber-500 focus:outline-none text-stone-200"
                    >
                      <optgroup label="Scripts Officiels">
                        <option value="tb">Trouble Brewing (Recommandé)</option>
                        <option value="bmr">Bad Moon Rising</option>
                        <option value="snv">Sects & Violets</option>
                      </optgroup>
                      <optgroup label="Teensyville (5-6 Joueurs)">
                        <option value="ngj">Teensyville: No Greater Joy</option>
                        <option value="luf">Teensyville: Laissez un Faire</option>
                      </optgroup>
                    </select>
                  </div>
                ) : (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Code de la Partie</label>
                    <input
                      type="text"
                      placeholder="Ex: 8X3B9Z"
                      value={inputRoomCode}
                      onChange={(e) => {
                        setInputRoomCode(e.target.value.toUpperCase());
                        setJoinError(null);
                      }}
                      className="w-full px-3 py-2 rounded-xl bg-stone-900 border border-stone-700 focus:border-purple-500 focus:outline-none text-amber-300 uppercase font-mono tracking-widest font-bold placeholder:text-stone-600"
                    />
                  </div>
                )}

                {joinError && (
                  <div className="p-2 rounded-lg bg-red-950/80 border border-red-500/80 text-red-200 text-xs font-semibold flex items-center gap-1.5">
                    <Icon name="AlertTriangle" className="w-3.5 h-3.5 text-red-400 shrink-0" />
                    <span>{joinError}</span>
                  </div>
                )}

                <button
                  disabled={isConnecting}
                  onClick={async () => {
                    const finalPseudo = userPseudo.trim() || (authMode === 'create' ? 'Conteur' : 'Villageois');
                    setJoinError(null);
                    setIsConnecting(true);

                    if (authMode === 'create') {
                      const newCode = generateUniqueRoomCode();
                      const initialStoryteller = {
                        name: finalPseudo,
                        avatar: '🧙‍♂️',
                        cameraActive: false,
                        micActive: true,
                        currentRoom: 'square'
                      };

                      const newRoomData = {
                        roomCode: newCode,
                        storyteller: initialStoryteller,
                        players: [],
                        selectedScriptId,
                        phase: 'day',
                        dayNumber: 1,
                        gameStarted: false,
                        rolesDistributedToPlayers: false,
                        demonBluffs: [null, null, null],
                        createdAt: Date.now()
                      };

                      await firebaseSync.setRoom(newCode, newRoomData);

                      setRoomCode(newCode);
                      setStoryteller(initialStoryteller);
                      setIsStorytellerMode(true);
                      setPlayers([]);
                      setInLobbyScreen(false);
                      setIsConnecting(false);
                      playSound('bell');
                    } else {
                      const codeToJoin = inputRoomCode.trim().toUpperCase();
                      if (!codeToJoin) {
                        setJoinError("Veuillez saisir le code du salon.");
                        setIsConnecting(false);
                        return;
                      }

                      let existingRoom = await firebaseSync.getRoom(codeToJoin);
                      if (!existingRoom) {
                        setJoinError(`Le salon « ${codeToJoin} » n'existe pas.`);
                        setIsConnecting(false);
                        return;
                      }

                      const myId = Date.now() + Math.random();
                      const sanitizedExisting = sanitizePlayerList(existingRoom.players);
                      const nextAvatar = BOT_AVATARS[sanitizedExisting.length % BOT_AVATARS.length];
                      const newJoinedPlayer = {
                        id: myId,
                        name: finalPseudo,
                        avatar: nextAvatar,
                        role: null,
                        hypothesisRole: null,
                        alive: true,
                        ghostVote: true,
                        reminders: [],
                        inRoom: 'square',
                        micActive: true
                      };

                      const updatedPlayers = [...sanitizedExisting, newJoinedPlayer];
                      await firebaseSync.updateRoom(codeToJoin, { players: updatedPlayers });
                      await fb.put(codeToJoin, 'joins/' + vk(myId), newJoinedPlayer);

                      setRoomCode(codeToJoin);
                      setCurrentUserId(myId);
                      setStoryteller(existingRoom.storyteller || storyteller);
                      setSelectedScriptId(existingRoom.selectedScriptId || 'tb');
                      setPlayers(updatedPlayers);
                      setPhase(existingRoom.phase || 'day');
                      setDayNumber(existingRoom.dayNumber || 1);
                      setGameStarted(Boolean(existingRoom.gameStarted));
                      setIsStorytellerMode(false);
                      setInLobbyScreen(false);
                      setIsConnecting(false);
                      playSound('bell');
                    }
                  }}
                  className={`w-full py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 text-xs shadow-xl transition active:scale-95 ${
                    isConnecting
                      ? 'bg-stone-800 text-stone-500 cursor-not-allowed'
                      : authMode === 'create'
                      ? 'bg-gradient-to-r from-amber-600 to-amber-500 text-stone-950 font-black'
                      : 'bg-gradient-to-r from-purple-700 to-indigo-700 text-white'
                  }`}
                >
                  <span>
                    {isConnecting
                      ? 'Connexion...'
                      : authMode === 'create'
                      ? 'Créer la Partie (Grimoire)'
                      : 'Rejoindre le Cercle'}
                  </span>
                  {!isConnecting && <Icon name="ArrowRight" className="w-3.5 h-3.5" />}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // RENDU 2 : APPLICATION PRINCIPALE SUR 1 SEULE PAGE
      // ==========================================
      return (
        <div className="h-screen w-screen flex flex-col font-sans select-none bg-[#100a14] text-stone-100 overflow-hidden relative">
          <div className="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#4a1d4a_1px,transparent_1px)] [background-size:24px_24px]" />

          {/* INFOBULLE DE POUVOIR (survol d'un rôle : cercle, sélecteur, hypothèse) */}
          {hoverRole && (
            <div className="fixed bottom-16 left-1/2 -translate-x-1/2 z-[60] w-72 max-w-[92vw] p-2.5 rounded-xl bg-stone-950/98 border border-amber-500 shadow-2xl pointer-events-none">
              <div className="flex items-center gap-2 border-b border-stone-800 pb-1 mb-1">
                <img src={hoverRole.cdnIcon} alt="" className="w-6 h-6 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                <span className="text-xs font-bold text-amber-300 font-serif">{hoverRole.name}</span>
                <span className="text-[9px] font-mono text-stone-400 uppercase ml-auto">{hoverRole.team}</span>
              </div>
              <p className="text-[11px] text-stone-200 leading-snug italic font-serif">« {hoverRole.ability} »</p>
            </div>
          )}

          {/* INVITATION EN APARTÉ */}
          {pendingInvite && !isStorytellerMode && (
            <div className="fixed top-14 left-1/2 -translate-x-1/2 z-[55] bg-indigo-950/95 border-2 border-indigo-400 rounded-2xl px-4 py-2 shadow-2xl flex items-center gap-3 text-xs">
              <span>🔒 <strong className="text-amber-300">{pendingInvite.from}</strong> t'invite : « {pendingInvite.roomName} »</span>
              <button onClick={acceptInvite} className="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-white">Rejoindre</button>
              <button onClick={dismissInvite} className="px-2 py-1 bg-stone-800 hover:bg-stone-700 rounded-lg text-stone-300">Refuser</button>
            </div>
          )}

          {/* MON VOTE : bouton modifiable librement, pris en compte quand l'aiguille arrive sur moi, verrouillé après */}
          {canIVote && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[55] w-80 max-w-[94vw] bg-stone-950/95 border-2 border-amber-400 rounded-3xl px-4 py-3 shadow-2xl text-center space-y-2 animate-fade-in">
              <div className="text-[11px] text-stone-300">
                <strong className="text-sky-300">{(players.find(p => p.id === nomination.nominatorId) || {}).name}</strong> accuse{' '}
                <strong className="text-red-400">{(players.find(p => p.id === nomination.nomineeId) || {}).name}</strong>
              </div>
              <button
                disabled={myVoteLocked}
                onClick={() => castVote(myPlayer, !votes[vk(myPlayer.id)])}
                className={`w-full px-4 py-3 rounded-2xl font-black text-sm shadow-xl transition active:scale-95 ${
                  myVoteLocked
                    ? (lockedVotes[vk(myPlayer.id)] ? 'bg-amber-400/60 text-stone-950 cursor-not-allowed' : 'bg-stone-800 text-stone-500 cursor-not-allowed')
                    : votes[vk(myPlayer.id)]
                      ? 'bg-amber-400 text-stone-950 ring-4 ring-amber-300/60'
                      : 'bg-stone-800 text-amber-200 border border-amber-500'
                }`}
              >
                {myVoteLocked
                  ? (lockedVotes[vk(myPlayer.id)] ? '✋ Tu as voté OUI' : '✗ Tu n\'as pas voté')
                  : votes[vk(myPlayer.id)] ? '✋ Je vote OUI (cliquer pour retirer)' : '🖐️ Je ne vote pas (cliquer pour voter OUI)'}
              </button>
              <div className={`text-[10px] ${myTurnToVote ? 'text-amber-300 font-bold animate-pulse' : 'text-stone-400'}`}>
                {myVoteLocked
                  ? "L'aiguille est passée : ton vote est verrouillé."
                  : myTurnToVote
                    ? "L'aiguille est sur toi : ton vote compte maintenant !"
                    : "Ton choix ne compte que quand l'aiguille arrive sur toi. Tu peux changer d'avis."}
              </div>
            </div>
          )}

          {/* 3. MODALE DE RÉVÉLATION SECRÈTE DE RÔLE : BOUTON FERMER FIABILISÉ */}
          {secretRoleCardOpen && myRoleObj && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-amber-500 rounded-3xl max-w-xs sm:max-w-sm w-full p-5 text-center space-y-3 shadow-2xl">
                <span className="text-[10px] uppercase font-bold tracking-widest text-amber-400">
                  Votre Rôle Secret
                </span>
                <div className="w-20 h-20 rounded-full border-4 border-amber-400/80 bg-stone-900 flex items-center justify-center mx-auto shadow-2xl">
                  <img src={myRoleObj.cdnIcon} alt={myRoleObj.name} className="w-14 h-14 object-contain drop-shadow" />
                </div>
                <div>
                  <h3 className="text-xl font-serif font-black text-amber-200">{myRoleObj.name}</h3>
                  <span className="text-[10px] font-mono uppercase tracking-wider text-amber-400">{myRoleObj.team}</span>
                </div>
                <div className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-xs text-stone-200 italic leading-relaxed">
                  « {myRoleObj.ability} »
                </div>
                <button
                  onClick={() => setSecretRoleCardOpen(false)}
                  className="w-full py-2 bg-gradient-to-r from-amber-600 to-amber-500 text-stone-950 font-bold rounded-xl text-xs shadow-lg hover:from-amber-500 transition"
                >

                                className="px-2 py-0.5 bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold rounded text-[11px] flex items-center gap-1 shadow"

                              onClick={() => {

                              className="p-1 bg-stone-800 hover:bg-red-900 rounded text-stone-300"

                              <Icon name="X" className="w-3 h-3" />
                            </button>
                          </div>

                        {nomination.result && (
                          <div className="mt-0.5 text-[9px] font-bold text-amber-300 leading-tight">

                            {nomination.result.onBlock ? <span className="text-red-400">☠️ sur le billot</span> : <span className="text-stone-400">épargné</span>}

                        {officialQuota && (
                          <div className="mt-0.5 text-[8px] sm:text-[9px] font-mono text-stone-400">
                            {officialQuota.townsfolk}V • {officialQuota.outsider}E • {officialQuota.minion}S • {officialQuota.demon}D
                          </div>
                        )}
                      </>
                    )}
                  </div>

                  {/* SIÈGES DES JOUEURS */}
                  {players.map((p, index) => {
                    const angle = (index / players.length) * 2 * Math.PI - Math.PI / 2;
                    const left = `${50 + 41 * Math.cos(angle)}%`;
                    const top = `${50 + 41 * Math.sin(angle)}%`;

                    const isMe = p.id === currentUserId;
                    const roleObj = p.role ? ROLES_DB[p.role] : null;
                    const hypothesisObj = p.hypothesisRole ? ROLES_DB[p.hypothesisRole] : null;
                    const canSeeRole = isStorytellerMode || revealedSeats[index] || isMe;
                    const shownRole = canSeeRole && roleObj ? roleObj : hypothesisObj;

                    const isNominee = nomination.active && nomination.nomineeId === p.id;
                    const isVotingNow = nomination.active && currentVoter && currentVoter.id === p.id;
                    const elig = eligibleToVote(p);
                    const vStatus = nomination.active ? voteStatusOf(p) : null;
                    const hasVoted = nomination.active && voteValueOf(p);
                    const intent = Boolean(votes[vk(p.id)]);
                    const canClickVote = nomination.active && isStorytellerMode && elig;
                    const mjAtThisCottage = phase === 'night' && nightState.at === cottageIdOf(p.id);

                    const stream = isMe ? webcamStream : remoteStreams[peerKeyOf(roomCode, p.id)];
                    const tokens = isStorytellerMode ? p.reminders : (myTokens[p.id] || []);

                    return (

                            onClick={() => { if (canClickVote) castVote(p, !hasVoted); }}
                            className={`mb-0.5 px-2 py-0.5 rounded-full text-[10px] font-black shadow-lg transition select-none ${
                              isVotingNow ? 'animate-bounce ring-4 ring-amber-400' : ''
                            } ${canClickVote ? 'cursor-pointer hover:scale-110' : 'cursor-default'} ${
                              hasVoted
                                ? 'bg-amber-400 text-stone-950 border-2 border-white scale-105'
                                : 'bg-stone-900 text-stone-400 border border-stone-700'
                            }`}
                          >
                            {!elig ? '🚫' : vStatus === 'passed' ? (hasVoted ? '✋ OUI' : '✗ NON') : vStatus === 'current' ? (hasVoted ? '✋ OUI' : '… vote') : (isStorytellerMode && intent ? '(oui)' : '—')}
                          </div>

                        {/* CARRÉ AVATAR / WEBCAM */}

                          onClick={() => { if (isStorytellerMode && phase === 'night') moveToCottage(cottageIdOf(p.id)); }}

                          } ${
                            isNominee ? 'border-red-500 ring-4 ring-red-500/80 animate-pulse'
                              : isVotingNow ? 'border-amber-400 ring-4 ring-amber-400/80'
                              : 'border-stone-700 hover:border-amber-500'
                          }`}
                          title={phase === 'night' && isStorytellerMode ? `Aller dans le cottage de ${p.name}` : ''}

                          {hasVideo(stream) ? (
                            <StreamVideo stream={stream} className="w-full h-full object-cover" />
                          ) : (
                            <div className="w-full h-full flex flex-col items-center justify-center text-xl sm:text-2xl bg-stone-900/90 select-none">
                              <span>{p.avatar}</span>
                            </div>
                          )}

                            <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center pointer-events-none">

                            </div>

                            onMouseLeave={() => setHoverRole(null)}
                            className={`relative w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center cursor-pointer transition-all shadow-xl ${
                              !p.alive ? 'border-2 border-stone-600 bg-stone-950 grayscale' : 'border-2 border-amber-600/70 bg-stone-900 hover:border-amber-400'
                            }`}
                          >
                            {shownRole ? (
                              <img src={shownRole.cdnIcon} alt={shownRole.name} className={`w-7 h-7 sm:w-8 sm:h-8 object-contain drop-shadow ${shownRole === hypothesisObj && !(canSeeRole && roleObj) ? 'opacity-90' : ''}`} onError={(e) => { e.target.style.display = 'none'; }} />
                            ) : (
                              <span className="text-stone-600 text-xs font-serif font-bold">?</span>
                            )}
                          </div>

                          <div className="absolute left-full ml-1.5 top-1/2 -translate-y-1/2 flex flex-col gap-1 z-30 pointer-events-auto">
                            {tokens.map((remLabel, rIdx) => {
                              const preset = REMINDER_PRESETS.find(pr => pr.label === remLabel) || {
                                label: remLabel, code: 'RAPP', icon: '🏷️', color: 'bg-amber-950', border: 'border-amber-400'
                              };
                              return (
                                <div
                                  key={rIdx}
                                  onClick={(e) => { e.stopPropagation(); removeReminder(p, rIdx); }}
                                  className={`h-5 px-1.5 rounded-md ${preset.color} border ${preset.border} flex items-center gap-1 shadow-lg cursor-pointer hover:scale-110 transition whitespace-nowrap`}
                                  title={`${preset.label} (cliquer pour retirer)`}
                                >
                                  <span className="text-[11px] leading-none">{preset.icon}</span>
                                  <span className="text-[8px] font-black text-white tracking-wider font-mono">{preset.code}</span>
                                </div>
                              );
                            })}
                            <button
                              onClick={(e) => { e.stopPropagation(); setReminderPickerModal(index); }}
                              className="w-5 h-5 rounded-md bg-stone-900 hover:bg-amber-600 border border-stone-500 text-stone-200 hover:text-white flex items-center justify-center text-xs font-bold transition shadow"
                              title="Ajouter un jeton (bourré, empoisonné...)"
                            >
                              +
                            </button>
                          </div>
                        </div>

                        <div className="mt-0.5 px-1.5 rounded-md bg-black/90 border border-stone-800 text-center shadow max-w-[90px]">

                        </div>

                            <button
                              onClick={() => togglePlayerLife(p.id)}
                              className={`p-0.5 rounded text-[9px] border shadow ${p.alive ? 'bg-red-950 border-red-600 text-red-200 hover:bg-red-900' : 'bg-emerald-950 border-emerald-600 text-emerald-200 hover:bg-emerald-900'}`}

                              <Icon name={p.alive ? 'Skull' : 'Heart'} className="w-2.5 h-2.5" />
                            </button>
                          )}
                          {isStorytellerMode && phase === 'night' && (
                            <button
                              onClick={() => moveToCottage(cottageIdOf(p.id))}
                              className="px-1 rounded bg-indigo-950 hover:bg-indigo-800 border border-indigo-500 text-[9px] shadow"

                            </button>

                              title="Inviter en aparté"
                            >
                              <Icon name="UserPlus" className="w-2.5 h-2.5" />
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
