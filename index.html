    const FIREBASE_DB_URL = "https://botc-3e48e-default-rtdb.europe-west1.firebasedatabase.app";

    const generateUniqueRoomCode = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    };

    const firebaseSync = {
      async getRoom(code) {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`);
          if (!res.ok) return null;
          return await res.json();
        } catch (e) {
          return null;
        }
      },
      async setRoom(code, data) {
        try {
          await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } catch (e) {}
      },
      async updateRoom(code, partial) {
        try {
          await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(partial)
          });
        } catch (e) {}
      }
    };

    const sanitizePlayerList = (raw) => {
      if (!raw) return [];
      const arr = Array.isArray(raw) ? raw : Object.values(raw);
      return arr.filter(Boolean).map(p => ({
        id: p.id || (Date.now() + Math.random()),
        name: p.name || 'Villageois',
        avatar: p.avatar || '🐴',
        role: p.role || null,
        hypothesisRole: p.hypothesisRole || null,
        alive: p.alive !== undefined ? p.alive : true,
        ghostVote: p.ghostVote !== undefined ? p.ghostVote : true,
        reminders: Array.isArray(p.reminders) ? p.reminders : [],
        inRoom: p.inRoom || 'square',
        micActive: p.micActive !== undefined ? p.micActive : true
      }));
    };

    const PLAYER_DISTRIBUTION = {
      5:  { townsfolk: 3, outsider: 0, minion: 1, demon: 1 },

    const DAY_BREAKOUT_ROOMS = [
      { id: 'square', name: 'Place du Village', icon: '🏛️' },
      { id: 'tavern', name: 'Taverne du Corbeau', icon: '🍺' },
      { id: 'forest', name: 'Forêt Sombre', icon: '🌲' },
      { id: 'library', name: 'Bibliothèque', icon: '📚' },
      { id: 'belfry', name: 'Haut Clocher', icon: '🔔' }
    ];

    const BOT_NAMES = ['Brockwell', 'Danielle', 'Kapt’n Kadaver', 'Elizabeth', 'Markus', 'Elin', 'Beardy', 'Ginge', 'Conor', 'Rhett', 'Kurobold', 'Schnauzer'];
    const BOT_AVATARS = ['🐴', '🐺', '🦉', '🦊', '🦅', '🐗', '🦇', '🐈‍⬛', '🦌', '🗡️', '🛡️', '🕯️'];

    function App() {
      // --- LOBBY & SESSION ---
      const [inLobbyScreen, setInLobbyScreen] = useState(true);
      const [authMode, setAuthMode] = useState('create');
      const [userPseudo, setUserPseudo] = useState('');
      const [inputRoomCode, setInputRoomCode] = useState('');
      const [roomCode, setRoomCode] = useState('');
      const [currentUserId, setCurrentUserId] = useState(null);
      const [joinError, setJoinError] = useState(null);
      const [isConnecting, setIsConnecting] = useState(false);

      // --- STORYTELLER (MJ) & VUE ---
      const [storyteller, setStoryteller] = useState({
        name: 'Arif',
        avatar: '🧙‍♂️',
        cameraActive: false,
        micActive: true,
        currentRoom: 'square'
      });
      const [isStorytellerMode, setIsStorytellerMode] = useState(true);

      // --- SCRIPT & BLUFFS ---
      const [selectedScriptId, setSelectedScriptId] = useState('tb');
      const [isScriptDrawerOpen, setIsScriptDrawerOpen] = useState(false);
      const [demonBluffs, setDemonBluffs] = useState([null, null, null]);
      const [demonBluffPickerIndex, setDemonBluffPickerIndex] = useState(null);

      // --- PHASES & MINUTEUR DU JOUR ---
      const [phase, setPhase] = useState('day');
      const [dayNumber, setDayNumber] = useState(1);
      const [dayTimerSeconds, setDayTimerSeconds] = useState(300);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // 8. HISTORIQUE DES VOTES PAR JOUR (RÉSERVÉ AU MJ)
      const [voteHistory, setVoteHistory] = useState([]); // [{ day, nominatorName, nomineeName, votesCount, majorityRequired, voters: [{ name, voted }] }]
      const [voteHistoryModalOpen, setVoteHistoryModalOpen] = useState(false);

      useEffect(() => {
        let interval = null;
        if (phase === 'day' && isTimerRunning && dayTimerSeconds > 0) {
          interval = setInterval(() => {
            setDayTimerSeconds(prev => Math.max(0, prev - 1));
          }, 1000);
        } else if (dayTimerSeconds === 0 && isTimerRunning) {
          setIsTimerRunning(false);
          playSound('gavel');
        }
        return () => clearInterval(interval);
      }, [phase, isTimerRunning, dayTimerSeconds]);

      // --- JOUEURS DU CERCLE ---
      const [players, setPlayers] = useState([]);
      const playersRef = useRef([]);
      playersRef.current = players;
      const [rolesDistributedToPlayers, setRolesDistributedToPlayers] = useState(false);
      const [gameStarted, setGameStarted] = useState(false);

      // --- 3. RÉVÉLATION SECRÈTE DE RÔLE & FERMETURE ---
      const [secretRoleCardOpen, setSecretRoleCardOpen] = useState(false);
      const myPlayer = useMemo(() => {
        return players.find(p => p.id === currentUserId) || null;
      }, [players, currentUserId]);

      const myRoleObj = useMemo(() => {
        if (!myPlayer || !myPlayer.role) return null;
        return ROLES_DB[myPlayer.role] || null;
      }, [myPlayer]);

      useEffect(() => {
        if (!isStorytellerMode && rolesDistributedToPlayers && myRoleObj) {
          setSecretRoleCardOpen(true);
        }
      }, [rolesDistributedToPlayers, isStorytellerMode, myRoleObj]);

      // --- SALONS & COTTAGES ---
      const [currentDayRoom, setCurrentDayRoom] = useState('square');
      const [pendingInvite, setPendingInvite] = useState(null);
      const [customPrivateRooms, setCustomPrivateRooms] = useState([]);
      const [visitingCottagePlayer, setVisitingCottagePlayer] = useState(null);
      const [cottageGuestPlayerId, setCottageGuestPlayerId] = useState(null);
      const [cottageChatMessages, setCottageChatMessages] = useState([]);
      const [cottageInputText, setCottageInputText] = useState('');
      const [cottageMailboxOpen, setCottageMailboxOpen] = useState(false);
      const [hasUnreadMessages, setHasUnreadMessages] = useState(false);

      // 7. NETTOYAGE AUTOMATIQUE DES SALONS D'APARTÉ VIDES
      useEffect(() => {
        if (customPrivateRooms.length === 0) return;
        setCustomPrivateRooms(prev => prev.filter(r => {
          const hasPlayers = players.some(p => p.inRoom === r.id);
          const hasHost = storyteller.currentRoom === r.id;
          return hasPlayers || hasHost;
        }));
      }, [players, storyteller.currentRoom]);

      // --- MODALES ---
      const [rolePickerModal, setRolePickerModal] = useState(null);
      const [reminderPickerModal, setReminderPickerModal] = useState(null);
      const [wikiRoleModal, setWikiRoleModal] = useState(null);
      const [nightOrderModalOpen, setNightOrderModalOpen] = useState(false);
      const [nightOrderTab, setNightOrderTab] = useState('first');
      const [settingsModalOpen, setSettingsModalOpen] = useState(false);
      const [victoryModal, setVictoryModal] = useState(null);
      const [switchStorytellerModalOpen, setSwitchStorytellerModalOpen] = useState(false);

      // --- 4. ACCUSATION ET VOTE (DOUBLE AIGUILLE FLUIDE) ---
      const [accusationWizard, setAccusationWizard] = useState(null);
      const [pendingAccusation, setPendingAccusation] = useState(null);
      const [nomination, setNomination] = useState({
        active: false,
        nominatorId: null,
        nomineeId: null,
        clockIndex: -1,
        isRunning: false,
        votes: {},
        speed: 1600
      });
      const [onTheBlock, setOnTheBlock] = useState(null);
      const [revealedSeats, setRevealedSeats] = useState({});

      // --- 2. WEBCAM & MICROPHONE FIABILISÉS ---
      const videoRef = useRef(null);
      const playerVideoRef = useRef(null);
      const [webcamStream, setWebcamStream] = useState(null);
      const [audioStream, setAudioStream] = useState(null);
      const [isMicMuted, setIsMicMuted] = useState(false);
      const [playerCamActive, setPlayerCamActive] = useState(false);
      const [remoteStreams, setRemoteStreams] = useState({}); // { [peerId]: MediaStream }
      const peerInstance = useRef(null);

      // Initialisation WebRTC P2P (PeerJS)
      useEffect(() => {
        if (!roomCode || inLobbyScreen) return;
        const myPeerId = isStorytellerMode ? `botc_${roomCode}_host` : `botc_${roomCode}_p_${String(currentUserId || 'guest').replace(/[^a-zA-Z0-9]/g, '')}`;

        let peer = null;
        try {
          peer = new window.Peer(myPeerId, { debug: 0 });
          peerInstance.current = peer;

          peer.on('call', (call) => {
            const currentLocal = webcamStream || audioStream;
            call.answer(currentLocal || undefined);
            call.on('stream', (remoteStream) => {
              setRemoteStreams(prev => ({ ...prev, [call.peer]: remoteStream }));
            });
          });
        } catch (e) {
          console.warn("PeerJS init:", e);
        }

        return () => {
          if (peer) peer.destroy();
        };
      }, [roomCode, inLobbyScreen, currentUserId, isStorytellerMode]);

      // Connecter aux autres dès qu'un flux local s'active
      const connectToPeer = (targetPeerId) => {
        if (!peerInstance.current) return;
        const local = webcamStream || audioStream;
        if (!local) return;
        const call = peerInstance.current.call(targetPeerId, local);
        if (call) {
          call.on('stream', (remoteStream) => {
            setRemoteStreams(prev => ({ ...prev, [targetPeerId]: remoteStream }));
          });
        }
      };

      const toggleMicrophone = async () => {
        try {
          if (!audioStream) {
            const stream = await navigator.mediaDevices.getUserMedia({ 
              audio: { echoCancellation: true, noiseSuppression: true } 
            });
            setAudioStream(stream);
            setIsMicMuted(false);
            if (!isStorytellerMode) {
              connectToPeer(`botc_${roomCode}_host`);
            }
          } else {
            const nextState = !isMicMuted;
            audioStream.getAudioTracks().forEach(t => { t.enabled = !nextState; });
            setIsMicMuted(nextState);
          }
        } catch (e) {
          console.warn("Erreur microphone:", e);
        }
      };

      const toggleUserWebcam = async () => {
        if (webcamStream) {
          webcamStream.getVideoTracks().forEach(t => t.stop());
          setWebcamStream(null);
          if (isStorytellerMode) {
            setStoryteller(s => ({ ...s, cameraActive: false }));
          } else {
            setPlayerCamActive(false);
          }
        } else {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
              video: { width: { ideal: 320 }, height: { ideal: 240 } },
              audio: true
            });
            setWebcamStream(stream);
            if (isStorytellerMode) {
              setStoryteller(s => ({ ...s, cameraActive: true }));
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                videoRef.current.play().catch(() => {});
              }
            } else {
              setPlayerCamActive(true);
              if (playerVideoRef.current) {
                playerVideoRef.current.srcObject = stream;
                playerVideoRef.current.play().catch(() => {});
              }
              connectToPeer(`botc_${roomCode}_host`);
            }
          } catch (err) {
            console.warn("Erreur webcam:", err);
          }
        }
      };

      useEffect(() => {
        if (videoRef.current && webcamStream && isStorytellerMode) {
          videoRef.current.srcObject = webcamStream;
          videoRef.current.play().catch(() => {});
        }
        if (playerVideoRef.current && webcamStream && !isStorytellerMode) {
          playerVideoRef.current.srcObject = webcamStream;
          playerVideoRef.current.play().catch(() => {});
        }
      }, [webcamStream, isStorytellerMode, playerCamActive]);

      // Lecture des flux audios distants
      useEffect(() => {
        Object.entries(remoteStreams).forEach(([pId, stream]) => {
          let audioEl = document.getElementById(`audio_peer_${pId}`);
          if (!audioEl) {
            audioEl = document.createElement('audio');
            audioEl.id = `audio_peer_${pId}`;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);
          }
          if (audioEl.srcObject !== stream) {
            audioEl.srcObject = stream;
            audioEl.play().catch(() => {});
          }
        });
      }, [remoteStreams]);

      // --- AUDIO SYNTHÉTISEUR ---
      const playSound = (type = 'bell') => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'bell') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(293.66, ctx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
            osc.start();
            osc.stop(ctx.currentTime + 1.3);
          } else if (type === 'tick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.start();
            osc.stop(ctx.currentTime + 0.09);
          } else if (type === 'gavel') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          }
        } catch (e) {}
      };

      // --- SYNCHRONISATION MULTIJOUEUR EN TEMPS RÉEL ---
      useEffect(() => {
        if (!roomCode || inLobbyScreen) return;
        let isCancelled = false;

        const pollGameState = async () => {
          try {
            const data = await firebaseSync.getRoom(roomCode);
            if (data && !isCancelled) {
              if (data.players) {
                const sanitized = sanitizePlayerList(data.players);
                // 4. PRÉSERVER LES JETONS D'HYPOTHÈSES LOCAUX DU JOUEUR S'ILS EXISTENT
                setPlayers(prev => {
                  return sanitized.map(remoteP => {
                    const localP = prev.find(lp => lp.id === remoteP.id);
                    return {
                      ...remoteP,
                      hypothesisRole: localP?.hypothesisRole !== undefined ? localP.hypothesisRole : remoteP.hypothesisRole
                    };
                  });
                });
              }
              if (data.phase) setPhase(data.phase);
              if (data.dayNumber !== undefined) setDayNumber(data.dayNumber);
              if (data.gameStarted !== undefined) setGameStarted(data.gameStarted);
              if (data.rolesDistributedToPlayers !== undefined) {
                setRolesDistributedToPlayers(data.rolesDistributedToPlayers);
              }
              if (data.nomination) setNomination(data.nomination);
              if (data.storyteller) setStoryteller(data.storyteller);
              if (data.selectedScriptId) setSelectedScriptId(data.selectedScriptId);
              if (data.demonBluffs) setDemonBluffs(data.demonBluffs);
              if (data.onTheBlock !== undefined) setOnTheBlock(data.onTheBlock);
              if (data.voteHistory) setVoteHistory(data.voteHistory);
              if (data.cottageChatMessages) {
                setCottageChatMessages(data.cottageChatMessages);
                if (data.cottageChatMessages.length > cottageChatMessages.length) {
                  setHasUnreadMessages(true);
                }
              }
              // 3. OUVERTURE AUTOMATIQUE DU COTTAGE CHEZ LE JOUEUR
              if (data.nightActiveCottageTargetId) {
                if (currentUserId && (data.nightActiveCottageTargetId === currentUserId || data.nightActiveCottageGuestId === currentUserId)) {
                  const targetP = sanitized.find(p => p.id === data.nightActiveCottageTargetId);
                  if (targetP) setVisitingCottagePlayer(targetP);
                }
              } else if (!isStorytellerMode) {
                setVisitingCottagePlayer(null);
              }
              if (data.dayTimerSeconds !== undefined && !isStorytellerMode) setDayTimerSeconds(data.dayTimerSeconds);
              if (data.isTimerRunning !== undefined && !isStorytellerMode) setIsTimerRunning(data.isTimerRunning);
            }
          } catch (e) {}
        };

        const interval = setInterval(pollGameState, 1000);
        pollGameState();

        return () => {
          isCancelled = true;
          clearInterval(interval);
        };
      }, [roomCode, inLobbyScreen, isStorytellerMode, currentUserId, cottageChatMessages.length]);

      const broadcastGameState = (
        newPlayers = playersRef.current, 
        newPhase = phase, 
        newStarted = gameStarted,
        extraUpdates = {}
      ) => {
        if (!roomCode) return;
        const payload = {
          roomCode,
          players: newPlayers,
          phase: newPhase,
          dayNumber,
          gameStarted: newStarted,
          rolesDistributedToPlayers,
          storyteller,
          nomination,
          selectedScriptId,
          demonBluffs,
          onTheBlock,
          voteHistory,
          cottageChatMessages,
          nightActiveCottageTargetId: visitingCottagePlayer ? visitingCottagePlayer.id : null,
          nightActiveCottageGuestId: cottageGuestPlayerId || null,
          dayTimerSeconds,
          isTimerRunning,
          lastUpdated: Date.now(),
          ...extraUpdates
        };

        firebaseSync.setRoom(roomCode, payload);
      };

      // --- QUOTAS OFFICIELS BOTC ---
      const currentScript = SCRIPTS_DATA[selectedScriptId] || SCRIPTS_DATA.tb;
      const officialQuota = PLAYER_DISTRIBUTION[players.length] || null;

      const dynamicQuota = useMemo(() => {
        if (!officialQuota) return null;
        let townsfolk = officialQuota.townsfolk;
        let outsider = officialQuota.outsider;
        let minion = officialQuota.minion;
        let demon = officialQuota.demon;

        const hasBaron = players.some(p => p.role === 'baron');
        if (hasBaron) {
          outsider += 2;
          townsfolk = Math.max(0, townsfolk - 2);
        }

        return { townsfolk, outsider, minion, demon, hasBaron };
      }, [officialQuota, players]);

      const addPlayerSeat = (customName = null) => {
        if (players.length >= 15 || gameStarted) return;
        const nextIdx = players.length;
        const name = customName || BOT_NAMES[nextIdx % BOT_NAMES.length] || `Joueur ${nextIdx + 1}`;
        const newPlayer = {
          id: Date.now() + Math.random(),
          name,
          avatar: BOT_AVATARS[nextIdx % BOT_AVATARS.length],
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };
        const updated = [...playersRef.current, newPlayer];
        setPlayers(updated);
        broadcastGameState(updated);
      };

      const handleAutoDistributeRoles = () => {
        if (players.length < 5 || gameStarted) return;
        const dist = PLAYER_DISTRIBUTION[players.length];
        if (!dist) return;

        let targetTownsfolk = dist.townsfolk;
        let targetOutsiders = dist.outsider;
        let targetMinions = dist.minion;
        let targetDemons = dist.demon;

        const scriptRoles = currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean);
        const avTownsfolk = scriptRoles.filter(r => r.team === 'townsfolk');
        const avOutsiders = scriptRoles.filter(r => r.team === 'outsider');
        const avMinions = scriptRoles.filter(r => r.team === 'minion');
        const avDemons = scriptRoles.filter(r => r.team === 'demon');

        const chosenDemon = avDemons[Math.floor(Math.random() * avDemons.length)];
        const chosenMinions = [...avMinions].sort(() => 0.5 - Math.random()).slice(0, targetMinions);

        if (chosenMinions.some(m => m.id === 'baron')) {
          targetOutsiders = Math.min(targetOutsiders + 2, avOutsiders.length);
          targetTownsfolk = Math.max(0, targetTownsfolk - 2);
        }

        const chosenOutsiders = [...avOutsiders].sort(() => 0.5 - Math.random()).slice(0, targetOutsiders);
        const chosenTownsfolk = [...avTownsfolk].sort(() => 0.5 - Math.random()).slice(0, targetTownsfolk);

        const fullPool = [
          chosenDemon,
          ...chosenMinions,
          ...chosenOutsiders,
          ...chosenTownsfolk
        ].filter(Boolean).sort(() => 0.5 - Math.random());

        const updated = playersRef.current.map((p, idx) => ({ ...p, role: fullPool[idx]?.id || null }));
        setPlayers(updated);
        broadcastGameState(updated);
        playSound('bell');
      };

      const handleRandomizeDemonBluffs = () => {
        const inGameRoles = new Set(players.map(p => p.role).filter(Boolean));
        const availableGood = currentScript.roles
          .map(id => ROLES_DB[id])
          .filter(r => r && (r.team === 'townsfolk' || r.team === 'outsider') && !inGameRoles.has(r.id));

        const shuffled = [...availableGood].sort(() => 0.5 - Math.random());
        const bluffs = [shuffled[0]?.id || null, shuffled[1]?.id || null, shuffled[2]?.id || null];
        setDemonBluffs(bluffs);
        broadcastGameState(playersRef.current, phase, gameStarted, { demonBluffs: bluffs });
        playSound('bell');
      };

      const handleStartGame = () => {
        if (players.length < 5) return;
        let currentPoolPlayers = [...playersRef.current];
        const needsDistribution = currentPoolPlayers.some(p => !p.role);
        
        // 3. DISTRIBUTION ET TRANSMISSION AUTOMATIQUE DES RÔLES AU DÉMARRAGE
        if (needsDistribution) {
          const dist = PLAYER_DISTRIBUTION[players.length];
          if (dist) {
            let targetTownsfolk = dist.townsfolk;
            let targetOutsiders = dist.outsider;
            let targetMinions = dist.minion;
            let targetDemons = dist.demon;

            const scriptRoles = currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean);
            const avTownsfolk = scriptRoles.filter(r => r.team === 'townsfolk');
            const avOutsiders = scriptRoles.filter(r => r.team === 'outsider');
            const avMinions = scriptRoles.filter(r => r.team === 'minion');
            const avDemons = scriptRoles.filter(r => r.team === 'demon');

            const chosenDemon = avDemons[Math.floor(Math.random() * avDemons.length)];
            const chosenMinions = [...avMinions].sort(() => 0.5 - Math.random()).slice(0, targetMinions);

            if (chosenMinions.some(m => m.id === 'baron')) {
              targetOutsiders = Math.min(targetOutsiders + 2, avOutsiders.length);
              targetTownsfolk = Math.max(0, targetTownsfolk - 2);
            }

            const chosenOutsiders = [...avOutsiders].sort(() => 0.5 - Math.random()).slice(0, targetOutsiders);
            const chosenTownsfolk = [...avTownsfolk].sort(() => 0.5 - Math.random()).slice(0, targetTownsfolk);

            const fullPool = [
              chosenDemon,
              ...chosenMinions,
              ...chosenOutsiders,
              ...chosenTownsfolk
            ].filter(Boolean).sort(() => 0.5 - Math.random());

            currentPoolPlayers = currentPoolPlayers.map((p, idx) => ({ ...p, role: fullPool[idx]?.id || null }));
            setPlayers(currentPoolPlayers);
          }
        }
        
        setGameStarted(true);
        setRolesDistributedToPlayers(true);
        setPhase('night');
        setDayNumber(1);
        broadcastGameState(currentPoolPlayers, 'night', true, { rolesDistributedToPlayers: true });
        playSound('bell');
      };

      // --- 4. DOUBLE AIGUILLE & TOUR DE VOTE DÉTAILLÉ ---
      const nomineeIndex = useMemo(() => {
        if (!nomination.active || !nomination.nomineeId || players.length === 0) return -1;
        return players.findIndex(p => p.id === nomination.nomineeId);
      }, [nomination.active, nomination.nomineeId, players]);

      // L'ordre des votants fait STRICTEMENT le tour dans le sens des aiguilles :
      // commence par le joueur juste après l'accusé, et se termine par l'accusé lui-même.
      const orderedVoters = useMemo(() => {
        if (nomineeIndex === -1 || players.length === 0) return [];
        const ordered = [];
        for (let i = 1; i <= players.length; i++) {
          const idx = (nomineeIndex + i) % players.length;
          ordered.push(players[idx]);
        }
        return ordered;
      }, [nomineeIndex, players]);

      const nomineeAngle = useMemo(() => {
        if (nomineeIndex === -1 || players.length === 0) return 0;
        return (nomineeIndex / players.length) * 360;
      }, [nomineeIndex, players.length]);

      const sweeperAngle = useMemo(() => {
        if (nomination.clockIndex < 0 || orderedVoters.length === 0 || players.length === 0) return 0;
        const currentTarget = orderedVoters[nomination.clockIndex];
        const targetIdx = players.findIndex(p => p.id === currentTarget?.id);
        if (targetIdx === -1) return 0;
        return (targetIdx / players.length) * 360;
      }, [nomination.clockIndex, orderedVoters, players]);

      const currentVoter = nomination.clockIndex >= 0 ? orderedVoters[nomination.clockIndex] : null;

      // REFONTE COMPLETE DU TIMER D'ACCUSATION : progression fluide de chaque vote
      useEffect(() => {
        if (!nomination.active || !nomination.isRunning || orderedVoters.length === 0) return;

        const timer = setTimeout(() => {
          playSound('tick');
          const nextIdx = nomination.clockIndex + 1;

          if (nextIdx >= orderedVoters.length) {
            playSound('gavel');
            const totalVotes = Object.values(nomination.votes || {}).filter(Boolean).length;
            const aliveTotal = playersRef.current.filter(p => p.alive).length;
            const required = Math.ceil(aliveTotal / 2);
            const nominee = playersRef.current.find(p => p.id === nomination.nomineeId);

            if (totalVotes >= required && nominee) {
              if (!onTheBlock || totalVotes > onTheBlock.votes) {
                setOnTheBlock({ playerId: nominee.id, playerName: nominee.name, votes: totalVotes });
              } else if (onTheBlock && totalVotes === onTheBlock.votes) {
                setOnTheBlock(null);
              }
            }

            // Consommation du vote fantôme
            const updatedAfterGhosts = playersRef.current.map(p => {
              if (!p.alive && nomination.votes && nomination.votes[p.id]) {
                return { ...p, ghostVote: false };
              }
              return p;
            });
            setPlayers(updatedAfterGhosts);

            if (nominee) {
              const nominator = playersRef.current.find(p => p.id === nomination.nominatorId);
              const votersList = playersRef.current.map(p => ({
                id: p.id,
                name: p.name,
                voted: Boolean(nomination.votes && nomination.votes[p.id])
              }));
              const newRecord = {
                day: dayNumber,
                nominatorName: nominator ? nominator.name : 'Inconnu',
                nomineeName: nominee.name,
                votesCount: totalVotes,
                majorityRequired: required,
                voters: votersList
              };
              setVoteHistory(vh => [...vh, newRecord]);
              broadcastGameState(updatedAfterGhosts, phase, gameStarted, {
                voteHistory: [...voteHistory, newRecord],
                nomination: { ...nomination, isRunning: false, clockIndex: -1 }
              });
            } else {
              broadcastGameState(updatedAfterGhosts, phase, gameStarted, {
                nomination: { ...nomination, isRunning: false, clockIndex: -1 }
              });
            }

            setNomination(prev => ({ ...prev, isRunning: false, clockIndex: -1 }));
          } else {
            const updatedNom = { ...nomination, clockIndex: nextIdx };
            setNomination(updatedNom);
            broadcastGameState(playersRef.current, phase, gameStarted, { nomination: updatedNom });
          }
        }, nomination.speed || 1800);

        return () => clearTimeout(timer);
      }, [nomination.active, nomination.isRunning, nomination.clockIndex, orderedVoters, onTheBlock, dayNumber, voteHistory, phase, gameStarted]);

      const handleApproveAccusation = () => {
        if (!pendingAccusation) return;
        playSound('bell');
        const newNom = {
          active: true,
          nominatorId: pendingAccusation.nominatorId,
          nomineeId: pendingAccusation.nomineeId,
          clockIndex: -1,
          isRunning: false,
          votes: {},
          speed: 1800
        };
        setNomination(newNom);
        setPendingAccusation(null);
        broadcastGameState(playersRef.current, phase, gameStarted, { nomination: newNom });
      };

      const togglePlayerLife = (playerId) => {
        const updated = playersRef.current.map(p => p.id === playerId ? { ...p, alive: !p.alive } : p);
        setPlayers(updated);
        broadcastGameState(updated);
      };

      const executePlayerOnBlock = () => {
        if (!onTheBlock) return;
        playSound('gavel');
        const updated = playersRef.current.map(p => p.id === onTheBlock.playerId ? { ...p, alive: false } : p);
        setPlayers(updated);
        setOnTheBlock(null);
        const newNom = { ...nomination, active: false, isRunning: false };
        setNomination(newNom);
        broadcastGameState(updated, phase, gameStarted, { onTheBlock: null, nomination: newNom });
      };

      const sendRoomInvite = (targetPlayer, explicitRoomId = null, explicitRoomName = null) => {
        const customRoomId = explicitRoomId || `private_${Date.now()}`;
        const roomName = explicitRoomName || `Aparté avec ${targetPlayer.name}`;
        setPendingInvite({
          fromPlayerName: isStorytellerMode ? storyteller.name : 'Un villageois',
          toPlayerId: targetPlayer.id,
          roomName,
          roomId: customRoomId
        });
        setCustomPrivateRooms(prev => {
          if (prev.some(r => r.id === customRoomId)) return prev;
          return [...prev, { id: customRoomId, name: roomName, icon: '🔒' }];
        });
        playSound('bell');
      };

      const acceptInvite = () => {
        if (!pendingInvite) return;
        changeUserRoom(pendingInvite.roomId);
        setPendingInvite(null);
      };

      const shufflePlayerSeats = () => {
        if (players.length < 2) return;
        const updated = [...playersRef.current].sort(() => 0.5 - Math.random());
        setPlayers(updated);
        broadcastGameState(updated);
        playSound('bell');
      };

      const handlePromoteToStoryteller = (newStorytellerPlayer) => {
        const demotedStorytellerPlayer = {
          id: Date.now() + Math.random(),
          name: storyteller.name,
          avatar: storyteller.avatar,
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square',
          micActive: true
        };

        const updatedSt = {
          name: newStorytellerPlayer.name,
          avatar: newStorytellerPlayer.avatar,
          cameraActive: false,
          micActive: true,
          currentRoom: 'square'
        };

        setStoryteller(updatedSt);

        const updatedPlayers = [
          ...playersRef.current.filter(p => p.id !== newStorytellerPlayer.id),
          demotedStorytellerPlayer
        ];

        setPlayers(updatedPlayers);
        setSwitchStorytellerModalOpen(false);
        broadcastGameState(updatedPlayers, phase, gameStarted);
        playSound('bell');
      };

      const resetGameForRematch = () => {
        setGameStarted(false);
        setPhase('day');
        setDayNumber(1);
        setRolesDistributedToPlayers(false);
        setNomination({ active: false, nominatorId: null, nomineeId: null, clockIndex: -1, isRunning: false, votes: {}, speed: 1600 });
        setOnTheBlock(null);
        setVictoryModal(null);
        setRevealedSeats({});
        setVisitingCottagePlayer(null);
        setCottageGuestPlayerId(null);
        setDemonBluffs([null, null, null]);
        setDayTimerSeconds(300);
        setIsTimerRunning(false);

        const updated = playersRef.current.map(p => ({
          ...p,
          role: null,
          hypothesisRole: null,
          alive: true,
          ghostVote: true,
          reminders: [],
          inRoom: 'square'
        }));

        setPlayers(updated);
        broadcastGameState(updated, 'day', false);
        playSound('bell');
      };

      const aliveCount = players.filter(p => p.alive).length;
      const majorityRequired = Math.ceil(aliveCount / 2);

      // ==========================================
      // RENDU 1 : ÉCRAN DE CONNEXION / LOBBY
      // ==========================================
      if (inLobbyScreen) {
        return (
          <div className="h-screen w-screen flex items-center justify-center p-4 bg-[#0e0712] text-stone-100 font-sans relative overflow-hidden select-none">
            <div className="absolute inset-0 pointer-events-none opacity-30 bg-[radial-gradient(#4a1d4a_1px,transparent_1px)] [background-size:24px_24px]" />
            
            <div className="relative z-10 w-full max-w-sm sm:max-w-md bg-stone-950/90 border-2 border-amber-600/60 rounded-3xl p-6 shadow-2xl backdrop-blur-xl">
              <div className="text-center space-y-2 mb-5">
                <div className="w-14 h-14 rounded-full bg-purple-950/90 border-2 border-amber-500/80 flex items-center justify-center text-3xl mx-auto shadow-lg">
                  😈
                </div>
                <h1 className="font-serif font-black text-2xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200">
                  BOTC ONLINE
                </h1>
                <p className="text-xs text-stone-400 font-serif italic">
                  Grimoire & Place du Village de Ravenswood Bluff
                </p>
              </div>

              <div className="flex rounded-xl bg-stone-900/80 p-1 border border-stone-800 mb-5">
                <button
                  onClick={() => setAuthMode('create')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${
                    authMode === 'create'
                      ? 'bg-amber-600 text-stone-950 shadow-md font-black'
                      : 'text-stone-400 hover:text-stone-200'
                  }`}
                >
                  <Icon name="Crown" className="w-3.5 h-3.5" /> Créer (MJ)
                </button>
                <button
                  onClick={() => setAuthMode('join')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${
                    authMode === 'join'
                      ? 'bg-purple-700 text-white shadow-md'
                      : 'text-stone-400 hover:text-stone-200'
                  }`}
                >
                  <Icon name="LogIn" className="w-3.5 h-3.5" /> Rejoindre
                </button>
              </div>

              <div className="space-y-4 text-xs">
                <div>
                  <label className="block text-stone-300 font-bold mb-1">Votre Pseudo</label>
                  <input
                    type="text"
                    placeholder="Ex: Arif, Markus..."
                    value={userPseudo}
                    onChange={(e) => setUserPseudo(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-stone-900 border border-stone-700 focus:border-amber-500 focus:outline-none text-stone-100 placeholder:text-stone-600"
                  />
                </div>

                {authMode === 'create' ? (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Script de départ</label>
                    <select
                      value={selectedScriptId}
                      onChange={(e) => setSelectedScriptId(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-stone-900 border border-stone-700 focus:border-amber-500 focus:outline-none text-stone-200"
                    >
                      <optgroup label="Scripts Officiels">
                        <option value="tb">Trouble Brewing (Recommandé)</option>
                        <option value="bmr">Bad Moon Rising</option>
                        <option value="snv">Sects & Violets</option>
                      </optgroup>
                      <optgroup label="Teensyville (5-6 Joueurs)">
                        <option value="ngj">Teensyville: No Greater Joy</option>
                        <option value="luf">Teensyville: Laissez un Faire</option>
                      </optgroup>
                    </select>
                  </div>
                ) : (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Code de la Partie</label>
                    <input
                      type="text"
                      placeholder="Ex: 8X3B9Z"
                      value={inputRoomCode}
                      onChange={(e) => {
                        setInputRoomCode(e.target.value.toUpperCase());
                        setJoinError(null);
                      }}
                      className="w-full px-3 py-2 rounded-xl bg-stone-900 border border-stone-700 focus:border-purple-500 focus:outline-none text-amber-300 uppercase font-mono tracking-widest font-bold placeholder:text-stone-600"
                    />
                  </div>
                )}

                {joinError && (
                  <div className="p-2 rounded-lg bg-red-950/80 border border-red-500/80 text-red-200 text-xs font-semibold flex items-center gap-1.5">
                    <Icon name="AlertTriangle" className="w-3.5 h-3.5 text-red-400 shrink-0" />
                    <span>{joinError}</span>
                  </div>
                )}

                <button
                  disabled={isConnecting}
                  onClick={async () => {
                    const finalPseudo = userPseudo.trim() || (authMode === 'create' ? 'Conteur' : 'Villageois');
                    setJoinError(null);
                    setIsConnecting(true);

                    if (authMode === 'create') {
                      const newCode = generateUniqueRoomCode();
                      const initialStoryteller = {
                        name: finalPseudo,
                        avatar: '🧙‍♂️',
                        cameraActive: false,
                        micActive: true,
                        currentRoom: 'square'
                      };

                      const newRoomData = {
                        roomCode: newCode,
                        storyteller: initialStoryteller,
                        players: [],
                        selectedScriptId,
                        phase: 'day',
                        dayNumber: 1,
                        gameStarted: false,
                        rolesDistributedToPlayers: false,
                        demonBluffs: [null, null, null],
                        createdAt: Date.now()
                      };

                      await firebaseSync.setRoom(newCode, newRoomData);

                      setRoomCode(newCode);
                      setStoryteller(initialStoryteller);
                      setIsStorytellerMode(true);
                      setPlayers([]);
                      setInLobbyScreen(false);
                      setIsConnecting(false);
                      playSound('bell');
                    } else {
                      const codeToJoin = inputRoomCode.trim().toUpperCase();
                      if (!codeToJoin) {
                        setJoinError("Veuillez saisir le code du salon.");
                        setIsConnecting(false);
                        return;
                      }

                      let existingRoom = await firebaseSync.getRoom(codeToJoin);
                      if (!existingRoom) {
                        setJoinError(`Le salon « ${codeToJoin} » n'existe pas.`);
                        setIsConnecting(false);
                        return;
                      }

                      const myId = Date.now() + Math.random();
                      const sanitizedExisting = sanitizePlayerList(existingRoom.players);
                      const nextAvatar = BOT_AVATARS[sanitizedExisting.length % BOT_AVATARS.length];
                      const newJoinedPlayer = {
                        id: myId,
                        name: finalPseudo,
                        avatar: nextAvatar,
                        role: null,
                        hypothesisRole: null,
                        alive: true,
                        ghostVote: true,
                        reminders: [],
                        inRoom: 'square',
                        micActive: true
                      };

                      const updatedPlayers = [...sanitizedExisting, newJoinedPlayer];
                      await firebaseSync.updateRoom(codeToJoin, { players: updatedPlayers });

                      setRoomCode(codeToJoin);
                      setCurrentUserId(myId);
                      setStoryteller(existingRoom.storyteller || storyteller);
                      setSelectedScriptId(existingRoom.selectedScriptId || 'tb');
                      setPlayers(updatedPlayers);
                      setPhase(existingRoom.phase || 'day');
                      setDayNumber(existingRoom.dayNumber || 1);
                      setGameStarted(Boolean(existingRoom.gameStarted));
                      setIsStorytellerMode(false);
                      setInLobbyScreen(false);
                      setIsConnecting(false);
                      playSound('bell');
                    }
                  }}
                  className={`w-full py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 text-xs shadow-xl transition active:scale-95 ${
                    isConnecting
                      ? 'bg-stone-800 text-stone-500 cursor-not-allowed'
                      : authMode === 'create'
                      ? 'bg-gradient-to-r from-amber-600 to-amber-500 text-stone-950 font-black'
                      : 'bg-gradient-to-r from-purple-700 to-indigo-700 text-white'
                  }`}
                >
                  <span>
                    {isConnecting
                      ? 'Connexion...'
                      : authMode === 'create'
                      ? 'Créer la Partie (Grimoire)'
                      : 'Rejoindre le Cercle'}
                  </span>
                  {!isConnecting && <Icon name="ArrowRight" className="w-3.5 h-3.5" />}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // RENDU 2 : APPLICATION PRINCIPALE SUR 1 SEULE PAGE
      // ==========================================
      return (
        <div className="h-screen w-screen flex flex-col font-sans select-none bg-[#100a14] text-stone-100 overflow-hidden relative">
          <div className="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#4a1d4a_1px,transparent_1px)] [background-size:24px_24px]" />

          {/* 3. MODALE DE RÉVÉLATION SECRÈTE DE RÔLE : BOUTON FERMER FIABILISÉ */}
          {secretRoleCardOpen && myRoleObj && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-amber-500 rounded-3xl max-w-xs sm:max-w-sm w-full p-5 text-center space-y-3 shadow-2xl">
                <span className="text-[10px] uppercase font-bold tracking-widest text-amber-400">
                  Votre Rôle Secret
                </span>
                <div className="w-20 h-20 rounded-full border-4 border-amber-400/80 bg-stone-900 flex items-center justify-center mx-auto shadow-2xl">
                  <img src={myRoleObj.cdnIcon} alt={myRoleObj.name} className="w-14 h-14 object-contain drop-shadow" />
                </div>
                <div>
                  <h3 className="text-xl font-serif font-black text-amber-200">{myRoleObj.name}</h3>
                  <span className="text-[10px] font-mono uppercase tracking-wider text-amber-400">{myRoleObj.team}</span>
                </div>
                <div className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-xs text-stone-200 italic leading-relaxed">
                  « {myRoleObj.ability} »
                </div>
                <button
                  onClick={() => setSecretRoleCardOpen(false)}
                  className="w-full py-2 bg-gradient-to-r from-amber-600 to-amber-500 text-stone-950 font-bold rounded-xl text-xs shadow-lg hover:from-amber-500 transition"
                >
                  J'ai compris mon rôle
                </button>
              </div>
            </div>
          )}

          {/* BARRE SUPÉRIEURE DE NAVIGATION */}

                  <button
                    onClick={() => setNightOrderTab('first')}
                    className={`flex-1 py-1.5 rounded-lg font-bold transition ${nightOrderTab === 'first' ? 'bg-indigo-600 text-white shadow' : 'text-stone-400'}`}
                  >
                    Première Nuit
                  </button>
                  <button
                    onClick={() => setNightOrderTab('other')}
                    className={`flex-1 py-1.5 rounded-lg font-bold transition ${nightOrderTab === 'other' ? 'bg-indigo-600 text-white shadow' : 'text-stone-400'}`}
                  >
                    Autres Nuits
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs overflow-x-hidden">
                  {(nightOrderTab === 'first'
                    ? currentScript.roles.map(id => ROLES_DB[id]).filter(r => r && r.firstNight > 0).sort((a, b) => a.firstNight - b.firstNight)
                    : currentScript.roles.map(id => ROLES_DB[id]).filter(r => r && r.otherNight > 0).sort((a, b) => a.otherNight - b.otherNight)
                  ).map((role, idx) => (
                    <div key={role.id} className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 flex items-center gap-3">
                      <span className="w-6 h-6 rounded-full bg-indigo-950 text-indigo-300 font-mono text-xs font-bold flex items-center justify-center border border-indigo-800 shrink-0">
                        {idx + 1}
                      </span>
                      <img src={role.cdnIcon} alt={role.name} className="w-7 h-7 object-contain shrink-0" onError={(e) => { e.target.style.display = 'none'; }} />
                      <div className="flex-1 min-w-0">
                        <span className="font-bold text-stone-200 text-xs block">{role.name}</span>
                        <p className="text-[11px] text-stone-400 leading-snug">{role.ability}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 8. MODALE : HISTORIQUE DES VOTES PAR JOUR POUR LE MJ */}
          {voteHistoryModalOpen && isStorytellerMode && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-3 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <Icon name="Gavel" className="w-4 h-4 text-amber-400" />
                    <h4 className="font-serif font-bold text-base text-amber-200">Historique des Votes par Jour</h4>
                  </div>
                  <button onClick={() => setVoteHistoryModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-1 text-xs">
                  {voteHistory.length === 0 ? (
                    <p className="text-stone-500 italic text-center py-4">Aucun vote n'a encore eu lieu.</p>
                  ) : (
                    voteHistory.map((vh, vIdx) => (
                      <div key={vIdx} className="p-3 rounded-2xl bg-stone-900 border border-stone-800 space-y-2">
                        <div className="flex items-center justify-between font-bold">
                          <span className="text-amber-300">Jour {vh.day} : {vh.nominatorName} accuse {vh.nomineeName}</span>
                          <span className={`px-2 py-0.5 rounded text-[10px] ${vh.votesCount >= vh.majorityRequired ? 'bg-red-950 text-red-200 border border-red-500' : 'bg-stone-800 text-stone-400'}`}>
                            {vh.votesCount} / {vh.majorityRequired} voix
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-1 pt-1">
                          {vh.voters.map((vt, vtIdx) => (
                            <span
                              key={vtIdx}
                              className={`px-1.5 py-0.5 rounded text-[10px] font-semibold flex items-center gap-1 ${
                                vt.voted
                                  ? 'bg-amber-400 text-stone-950'
                                  : 'bg-stone-800 text-stone-500'
                              }`}
                            >
                              {vt.voted ? '✋' : '—'} {vt.name}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODALE : VISITE DU COTTAGE DE NUIT PAR LE MJ (VOCAL PRIVÉ & TCHAT) */}
          {visitingCottagePlayer && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-indigo-500 rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <div className="text-2xl bg-indigo-950 p-2 rounded-xl border border-indigo-500">
                      🏠
                    </div>
                    <div>
                      <h3 className="font-serif font-bold text-base text-indigo-300 flex items-center gap-1.5">
                        <span>Cottage de {visitingCottagePlayer.name}</span>
                        <span className="px-1.5 py-0.2 rounded-full bg-emerald-950 border border-emerald-500 text-emerald-300 text-[9px] font-bold">
                          Vocal Isolé
                        </span>
                      </h3>
                      <p className="text-[10px] text-stone-400">
                        Seuls les occupants de ce cottage s'entendent. Le village dort.
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setVisitingCottagePlayer(null);
                      setCottageGuestPlayerId(null);
                      broadcastGameState(playersRef.current, phase, gameStarted, {
                        nightActiveCottageTargetId: null,
                        nightActiveCottageGuestId: null
                      });
                    }}
                    className="text-stone-400 hover:text-white"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-2.5 bg-stone-900 rounded-xl border border-stone-800 space-y-1.5">
                  <span className="text-[9px] uppercase font-bold text-indigo-400 block">Présents dans la chambre :</span>
                  <div className="flex flex-wrap items-center gap-1.5 text-xs">
                    <span className="px-2 py-1 rounded-lg bg-amber-950 border border-amber-600 text-amber-200 font-bold">
                      🧙‍♂️ {storyteller.name} (MJ)
                    </span>
                    <span className="px-2 py-1 rounded-lg bg-indigo-950 border border-indigo-500 text-indigo-200 font-bold">
                      {visitingCottagePlayer.avatar} {visitingCottagePlayer.name}
                    </span>
                    {cottageGuestPlayerId && (() => {
                      const guest = players.find(p => p.id === cottageGuestPlayerId);
                      if (!guest) return null;
                      return (
                        <span className="px-2 py-1 rounded-lg bg-purple-950 border border-purple-500 text-purple-200 font-bold flex items-center gap-1">
                          <span>{guest.avatar} {guest.name} (Invité)</span>
                          {isStorytellerMode && (
                            <button
                              onClick={() => {
                                setCottageGuestPlayerId(null);
                                broadcastGameState(playersRef.current, phase, gameStarted, { nightActiveCottageGuestId: null });
                              }}
                              className="text-stone-400 hover:text-red-400"
                            >
                              <Icon name="X" className="w-3 h-3" />
                            </button>
                          )}
                        </span>
                      );
                    })()}
                  </div>
                </div>

                {/* Rôle affiché uniquement au Conteur ou au joueur concerné */}
                {(isStorytellerMode || (currentUserId && visitingCottagePlayer.id === currentUserId)) && (
                  <div className="p-2.5 bg-stone-900 rounded-xl border border-stone-800 text-xs space-y-1">
                    <div className="flex items-center justify-between">
                      <span className="text-stone-400">Rôle réel du joueur :</span>
                      <span className="font-bold text-amber-300">
                        {visitingCottagePlayer.role ? ROLES_DB[visitingCottagePlayer.role]?.name : 'Aucun rôle'}
                      </span>
                    </div>
                    {visitingCottagePlayer.role && ROLES_DB[visitingCottagePlayer.role]?.ability && (
                      <p className="text-stone-300 italic text-[10px] leading-relaxed pt-1 border-t border-stone-800">
                        « {ROLES_DB[visitingCottagePlayer.role].ability} »
                      </p>
                    )}
                  </div>
                )}

                {isStorytellerMode && (
                  <div className="space-y-1">
                    <label className="text-[9px] uppercase font-bold text-stone-400">
                      Convoquer un autre joueur dans ce cottage (ex: Démon & Sbires) :
                    </label>
                    <select
                      value={cottageGuestPlayerId || ''}
                      onChange={(e) => {
                        const guestId = e.target.value ? Number(e.target.value) || e.target.value : null;
                        setCottageGuestPlayerId(guestId);
                        broadcastGameState(playersRef.current, phase, gameStarted, { nightActiveCottageGuestId: guestId });
                      }}
                      className="w-full px-2 py-1.5 bg-stone-900 border border-stone-700 rounded-xl text-xs text-white focus:outline-none"
                    >
                      <option value="">-- Convoquer un invité --</option>
                      {players.filter(p => p.id !== visitingCottagePlayer.id).map(p => (
                        <option key={p.id} value={p.id}>
                          {p.name} ({p.role ? ROLES_DB[p.role]?.name : 'Sans rôle'})
                        </option>
                      ))}
                    </select>
                  </div>
                )}

                {/* Tchat secret nocturne */}
                <div className="space-y-1.5 pt-1 border-t border-stone-800">
                  <span className="text-[9px] uppercase font-bold text-stone-400 block">Messages silencieux de la nuit :</span>
                  <div className="h-24 bg-stone-950 rounded-xl p-2 border border-stone-800 overflow-y-auto space-y-1 text-[11px]">
                    {cottageChatMessages.length === 0 ? (
                      <span className="text-stone-600 italic">Aucun message chuchoté...</span>
                    ) : (
                      cottageChatMessages.map((msg, mIdx) => (
                        <div key={mIdx} className="text-stone-300">
                          <strong className="text-amber-400">{msg.sender} :</strong> {msg.text}
                        </div>
                      ))
                    )}
                  </div>
                  <div className="flex gap-1.5">
                    <input
                      type="text"
                      placeholder="Chuchoter discrètement..."
                      value={cottageInputText}
                      onChange={(e) => setCottageInputText(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && cottageInputText.trim()) {
                          const newMsg = {
                            sender: isStorytellerMode ? storyteller.name : (myPlayer?.name || 'Moi'),
                            text: cottageInputText.trim(),
                            timestamp: Date.now()
                          };
                          const updatedMsgs = [...cottageChatMessages, newMsg];
                          setCottageChatMessages(updatedMsgs);
                          setCottageInputText('');
                          broadcastGameState(playersRef.current, phase, gameStarted, { cottageChatMessages: updatedMsgs });
                        }
                      }}
                      className="flex-1 px-2.5 py-1 bg-stone-900 border border-stone-700 rounded-lg text-xs text-white focus:outline-none"
                    />
                    <button
                      onClick={() => {
                        if (!cottageInputText.trim()) return;
                        const newMsg = {
                          sender: isStorytellerMode ? storyteller.name : (myPlayer?.name || 'Moi'),
                          text: cottageInputText.trim(),
                          timestamp: Date.now()
                        };
                        const updatedMsgs = [...cottageChatMessages, newMsg];
                        setCottageChatMessages(updatedMsgs);
                        setCottageInputText('');
                        broadcastGameState(playersRef.current, phase, gameStarted, { cottageChatMessages: updatedMsgs });
                      }}
                      className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold"
                    >
                      Envoyer
                    </button>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2 border-t border-stone-800">
                  <span className="text-[10px] text-stone-500 italic">Vocal actif uniquement entre vous.</span>
                  <button
                    onClick={() => {
                      setVisitingCottagePlayer(null);
                      setCottageGuestPlayerId(null);
                      broadcastGameState(playersRef.current, phase, gameStarted, {
                        nightActiveCottageTargetId: null,
                        nightActiveCottageGuestId: null
                      });
                    }}
                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow"
                  >
                    Quitter le cottage
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3. MODALE DE LA BOÎTE DE MESSAGERIE HISTORIQUE DU JOUEUR */}
          {cottageMailboxOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3 max-h-[80vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">✉️</span>
                    <h4 className="font-serif font-bold text-base text-amber-200">
                      Messages Secrets du Conteur
                    </h4>
                  </div>
                  <button onClick={() => setCottageMailboxOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                  {cottageChatMessages.length === 0 ? (
                    <p className="text-stone-500 italic text-center py-6">Aucun message secret reçu pour le moment.</p>
                  ) : (
                    cottageChatMessages.map((msg, idx) => (
                      <div key={idx} className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-amber-400">{msg.sender}</span>
                          <span className="text-[9px] text-stone-500 font-mono">
                            {msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}
                          </span>
                        </div>
                        <p className="text-stone-200 text-xs">{msg.text}</p>
                      </div>
                    ))
                  )}
                </div>

                <div className="pt-2 text-right border-t border-stone-800">
                  <button
                    onClick={() => setCottageMailboxOpen(false)}
                    className="px-4 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-xl text-xs font-semibold"
                  >
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : FIN DE PARTIE & VICTOIRE */}
          {victoryModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-500 rounded-3xl max-w-lg w-full p-6 shadow-2xl text-center space-y-4">
                <div className="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl shadow-xl bg-purple-950 border-2 border-amber-400">
                  {victoryModal === 'good' ? '🕊️' : '😈'}
                </div>

                <h3 className={`font-serif font-black text-2xl tracking-widest ${
                  victoryModal === 'good' ? 'text-blue-400' : 'text-red-500'
                }`}>
                  {victoryModal === 'good' ? 'VICTOIRE DU BIEN !' : 'VICTOIRE DU MAL !'}
                </h3>

                <p className="text-xs text-stone-300">
                  La partie est terminée. Vous pouvez tout révéler, mélanger les sièges ou réinitialiser.
                </p>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                  <button
                    onClick={() => {
                      playSound('bell');
                      const allRev = {};
                      players.forEach((_, idx) => { allRev[idx] = true; });
                      setRevealedSeats(allRev);
                    }}
                    className="px-2 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow"
                  >
                    Tout Révéler
                  </button>

                  <button
                    onClick={shufflePlayerSeats}
                    className="px-2 py-1.5 rounded-xl bg-indigo-900 hover:bg-indigo-800 text-indigo-100 font-bold text-xs shadow flex items-center justify-center gap-1"
                  >
                    <Icon name="Shuffle" className="w-3 h-3" /> Mélanger
                  </button>

                  <button
                    onClick={() => setSwitchStorytellerModalOpen(true)}
                    className="px-2 py-1.5 rounded-xl bg-purple-900 hover:bg-purple-800 text-purple-100 font-bold text-xs shadow flex items-center justify-center gap-1"
                  >
                    <Icon name="Crown" className="w-3 h-3 text-amber-300" /> Changer MJ
                  </button>

                  <button
                    onClick={resetGameForRematch}
                    className="px-2 py-1.5 rounded-xl bg-emerald-800 hover:bg-emerald-700 text-emerald-100 font-bold text-xs shadow flex items-center justify-center gap-1"
                  >
                    <Icon name="RotateCcw" className="w-3 h-3" /> Rejouer
                  </button>
                </div>

                <div className="pt-2">
                  <button
                    onClick={() => setVictoryModal(null)}
                    className="px-4 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold text-xs"
                  >
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : CHANGER DE CONTEUR */}
          {switchStorytellerModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-500 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-sm text-amber-200 flex items-center gap-1.5">
                    <Icon name="Crown" className="w-4 h-4 text-amber-400" /> Transférer le rôle de Conteur
                  </h4>
                  <button onClick={() => setSwitchStorytellerModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                  {players.map(p => (
                    <button
                      key={p.id}
                      onClick={() => handlePromoteToStoryteller(p)}
                      className="w-full p-2 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-400 flex items-center justify-between text-left transition"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-lg">{p.avatar}</span>
                        <span className="text-xs font-bold text-stone-200">{p.name}</span>
                      </div>
                      <span className="text-[10px] font-bold text-amber-400">Promouvoir →</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE : WIKI OFFICIEL */}
          {wikiRoleModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <img src={wikiRoleModal.cdnIcon} alt={wikiRoleModal.name} className="w-8 h-8 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                    <h3 className="font-serif font-black text-lg text-amber-200">{wikiRoleModal.name}</h3>
                  </div>
                  <button onClick={() => setWikiRoleModal(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
                <div className="p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-xs italic text-stone-200">
                  « {wikiRoleModal.ability} »
                </div>
              </div>
            </div>
          )}

          {/* MODALE : PARAMÈTRES */}
          {settingsModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-stone-700 rounded-2xl max-w-xs w-full p-4 shadow-2xl space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-sm text-amber-200">Paramètres</h4>
                  <button onClick={() => setSettingsModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-1.5">
                  <label className="text-stone-300 font-semibold text-[11px]">
                    Vitesse balayage vote : {nomination.speed} ms
                  </label>
                  <input
                    type="range"
                    min="800"
                    max="3000"
                    step="100"
                    value={nomination.speed}
                    onChange={(e) => setNomination(n => ({ ...n, speed: Number(e.target.value) }))}
                    className="w-full accent-amber-500"
                  />
                </div>

                {isStorytellerMode && (
                  <div className="space-y-1.5 pt-2 border-t border-stone-800">
                    <span className="text-stone-400 text-[10px] block">Déclarer la victoire :</span>
                    <div className="flex gap-1.5">
                      <button
                        onClick={() => { setVictoryModal('good'); setSettingsModalOpen(false); playSound('bell'); }}
                        className="flex-1 py-1 bg-blue-900/80 hover:bg-blue-800 border border-blue-500 text-blue-200 font-bold rounded-lg text-xs"
                      >
                        Bien
                      </button>
                      <button
                        onClick={() => { setVictoryModal('evil'); setSettingsModalOpen(false); playSound('bell'); }}
                        className="flex-1 py-1 bg-red-900/80 hover:bg-red-800 border border-red-500 text-red-200 font-bold rounded-lg text-xs"
                      >
                        Mal
                      </button>
                    </div>
                  </div>
                )}

                <div className="pt-2 border-t border-stone-800">
                  <button
                    onClick={() => {
                      setInLobbyScreen(true);
                      setSettingsModalOpen(false);
                    }}
                    className="w-full py-1.5 bg-red-950 hover:bg-red-900 text-red-200 rounded-lg font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="LogOut" className="w-3.5 h-3.5" /> Quitter la salle
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
