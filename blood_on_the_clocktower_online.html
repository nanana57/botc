      const [dayNumber, setDayNumber] = useState(1);
      const [players, setPlayers] = useState([]);
      const [gameStarted, setGameStarted] = useState(false);

      // Bluffs & Minuteur
      const [demonBluffs, setDemonBluffs] = useState([null, null, null]);
      const [dayTimerSeconds, setDayTimerSeconds] = useState(300);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Modales & Visites
      const [rolePickerModal, setRolePickerModal] = useState(null);
      const [reminderPickerModal, setReminderPickerModal] = useState(null);
      const [visitingCottagePlayer, setVisitingCottagePlayer] = useState(null);
      const [cottageGuestPlayerId, setCottageGuestPlayerId] = useState(null);
      const [wikiRoleModal, setWikiRoleModal] = useState(null);
      const [nightOrderModalOpen, setNightOrderModalOpen] = useState(false);
      const [nightOrderTab, setNightOrderTab] = useState('first');
      const [settingsModalOpen, setSettingsModalOpen] = useState(false);

      // Vote & Accusation
      const [accusationWizard, setAccusationWizard] = useState(null);
      const [pendingAccusation, setPendingAccusation] = useState(null);
      const [nomination, setNomination] = useState({ active: false, nominatorId: null, nomineeId: null, clockIndex: -1, isRunning: false, votes: {}, speed: 1600 });
      const [onTheBlock, setOnTheBlock] = useState(null);

      const currentScript = SCRIPTS_DATA[selectedScriptId] || SCRIPTS_DATA.tb;
      const officialQuota = PLAYER_DISTRIBUTION[players.length] || null;

      const dynamicQuota = useMemo(() => {
        if (!officialQuota) return null;
        let townsfolk = officialQuota.townsfolk;
        let outsider = officialQuota.outsider;
        let minion = officialQuota.minion;
        let demon = officialQuota.demon;
        if (players.some(p => p.role === 'baron')) {
          outsider += 2;
          townsfolk = Math.max(0, townsfolk - 2);
        }
        return { townsfolk, outsider, minion, demon, hasBaron: players.some(p => p.role === 'baron') };
      }, [officialQuota, players]);

      const assignedCounts = useMemo(() => {
        const counts = { townsfolk: 0, outsider: 0, minion: 0, demon: 0 };
        players.forEach(p => {
          if (p.role && ROLES_DB[p.role]) {
            const team = ROLES_DB[p.role].team;
            if (counts[team] !== undefined) counts[team]++;
          }
        });
        return counts;
      }, [players]);

      useEffect(() => {
        let interval = null;
        if (phase === 'day' && isTimerRunning && dayTimerSeconds > 0) {
          interval = setInterval(() => setDayTimerSeconds(s => Math.max(0, s - 1)), 1000);
        }
        return () => clearInterval(interval);
      }, [phase, isTimerRunning, dayTimerSeconds]);

      const addPlayerSeat = (name = null) => {
        if (players.length >= 15 || gameStarted) return;
        const nextIdx = players.length;
        setPlayers(prev => [...prev, {
          id: Date.now() + Math.random(),
          name: name || BOT_NAMES[nextIdx % BOT_NAMES.length] || `Joueur ${nextIdx + 1}`,
          avatar: BOT_AVATARS[nextIdx % BOT_AVATARS.length],
          role: null, hypothesisRole: null, alive: true, ghostVote: true, reminders: [], inRoom: 'square'
        }]);
      };

      const handleAutoDistribute = () => {
        if (players.length < 5 || gameStarted) return;
        const dist = PLAYER_DISTRIBUTION[players.length];
        if (!dist) return;
        let tT = dist.townsfolk, tO = dist.outsider, tM = dist.minion, tD = dist.demon;
        const scriptRoles = currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean);
        const avM = scriptRoles.filter(r => r.team === 'minion');
        const chosenM = [...avM].sort(() => 0.5 - Math.random()).slice(0, tM);
        if (chosenM.some(m => m.id === 'baron')) {
          tO += 2;
          tT = Math.max(0, tT - 2);
        }
        const chosenT = scriptRoles.filter(r => r.team === 'townsfolk').sort(() => 0.5 - Math.random()).slice(0, tT);
        const chosenO = scriptRoles.filter(r => r.team === 'outsider').sort(() => 0.5 - Math.random()).slice(0, tO);
        const chosenD = scriptRoles.filter(r => r.team === 'demon').sort(() => 0.5 - Math.random()).slice(0, tD);
        const pool = [...chosenD, ...chosenM, ...chosenO, ...chosenT].sort(() => 0.5 - Math.random());
        setPlayers(curr => curr.map((p, idx) => ({ ...p, role: pool[idx]?.id || null })));
      };

      // VOTE PAR AIGUILLES
      const nomineeIndex = nomination.nomineeId ? players.findIndex(p => p.id === nomination.nomineeId) : -1;
      const orderedVoters = useMemo(() => {
        if (nomineeIndex === -1 || players.length === 0) return [];
        const arr = [];
        for (let i = 1; i <= players.length; i++) {
          arr.push(players[(nomineeIndex + i) % players.length]);
        }
        return arr;
      }, [nomineeIndex, players]);

      useEffect(() => {
        if (!nomination.active || !nomination.isRunning || orderedVoters.length === 0) return;
        const timer = setTimeout(() => {
          setNomination(prev => {
            const next = prev.clockIndex + 1;
            if (next >= orderedVoters.length) {
              const totalVotes = Object.values(prev.votes).filter(Boolean).length;
              const alive = players.filter(p => p.alive).length;
              const req = Math.ceil(alive / 2);
              const nom = players.find(p => p.id === prev.nomineeId);
              if (totalVotes >= req && nom) {
                if (!onTheBlock || totalVotes > onTheBlock.votes) {
                  setOnTheBlock({ playerId: nom.id, playerName: nom.name, votes: totalVotes });
                }
              }
              return { ...prev, isRunning: false, clockIndex: orderedVoters.length - 1 };
            }
            return { ...prev, clockIndex: next };
          });
        }, nomination.speed);
        return () => clearTimeout(timer);
      }, [nomination.active, nomination.isRunning, nomination.clockIndex, orderedVoters]);

      const nomineeAngle = nomineeIndex !== -1 && players.length > 0 ? (nomineeIndex / players.length) * 360 : 0;
      const currentVoter = nomination.clockIndex >= 0 ? orderedVoters[nomination.clockIndex] : null;
      const sweeperAngle = currentVoter && players.length > 0 ? (players.findIndex(p => p.id === currentVoter.id) / players.length) * 360 : 0;

      if (inLobbyScreen) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center p-4 bg-[#0e0712] text-stone-100 font-sans relative">
            <div className="w-full max-w-md bg-stone-950/90 border-2 border-amber-600/60 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
              <div className="text-center space-y-2 mb-6">
                <div className="w-16 h-16 rounded-full bg-purple-950 border-2 border-amber-500/80 flex items-center justify-center text-3xl mx-auto shadow-lg">
                  😈
                </div>
                <h1 className="font-serif font-black text-2xl tracking-widest text-amber-300">BOTC ONLINE</h1>
                <p className="text-xs text-stone-400 font-serif italic">Place du Village de Ravenswood Bluff</p>
              </div>

              <div className="flex rounded-xl bg-stone-900 p-1 border border-stone-800 mb-6">
                <button
                  onClick={() => setAuthMode('create')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${authMode === 'create' ? 'bg-amber-600 text-stone-950 font-black' : 'text-stone-400'}`}
                >
                  <Icon name="Crown" className="w-3.5 h-3.5" /> Créer (Hôte / MJ)
                </button>
                <button
                  onClick={() => setAuthMode('join')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${authMode === 'join' ? 'bg-purple-700 text-white font-bold' : 'text-stone-400'}`}
                >
                  <Icon name="LogIn" className="w-3.5 h-3.5" /> Rejoindre
                </button>
              </div>

              <div className="space-y-4 text-xs">
                <div>
                  <label className="block text-stone-300 font-bold mb-1">Votre Pseudo</label>
                  <input
                    type="text"
                    placeholder="Ex: Arif, Éléonore, Markus..."
                    value={userPseudo}
                    onChange={(e) => setUserPseudo(e.target.value)}
                    className="w-full px-3 py-2.5 rounded-xl bg-stone-900 border border-stone-700 text-stone-100 focus:outline-none"
                  />
                </div>

                {authMode === 'create' ? (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Script de départ</label>
                    <select
                      value={selectedScriptId}
                      onChange={(e) => setSelectedScriptId(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-stone-900 border border-stone-700 text-stone-200 focus:outline-none"
                    >
                      <option value="tb">Trouble Brewing</option>
                      <option value="bmr">Bad Moon Rising</option>
                      <option value="snv">Sects & Violets</option>
                      <option value="ngj">Teensyville: No Greater Joy</option>
                      <option value="luf">Teensyville: Laissez un Faire</option>
                    </select>
                  </div>
                ) : (
                  <div>
                    <label className="block text-stone-300 font-bold mb-1">Code de la Partie</label>
                    <input
                      type="text"
                      placeholder="Ex: RAVENS"
                      value={inputRoomCode}
                      onChange={(e) => setInputRoomCode(e.target.value.toUpperCase())}
                      className="w-full px-3 py-2.5 rounded-xl bg-stone-900 border border-stone-700 text-amber-300 uppercase font-mono font-bold"
                    />
                  </div>
                )}

                <button
                  onClick={() => {
                    const final = userPseudo.trim() || (authMode === 'create' ? 'Conteur' : 'Villageois');
                    if (authMode === 'create') {
                      setRoomCode('BLUFFS');
                      setStoryteller(s => ({ ...s, name: final }));
                      setIsStorytellerMode(true);
                    } else {
                      setRoomCode(inputRoomCode.trim() || 'BLUFFS');
                      setIsStorytellerMode(false);
                      addPlayerSeat(final);
                    }
                    setInLobbyScreen(false);
                  }}
                  className="w-full py-3 rounded-xl font-black bg-gradient-to-r from-amber-600 to-amber-500 text-stone-950 flex items-center justify-center gap-2 shadow-xl"
                >
                  <span>{authMode === 'create' ? 'Ouvrir le Grimoire & Créer' : 'Prendre Place au Village'}</span>
                  <Icon name="ArrowRight" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>
        );
      }

      const aliveCount = players.filter(p => p.alive).length;
      const majorityRequired = Math.ceil(aliveCount / 2);

      return (
        <div className="min-h-screen w-full flex flex-col font-sans select-none bg-[#100a14] text-stone-100 overflow-hidden relative">
          
          {/* HEADER */}
          <header className="h-12 border-b border-purple-900/40 bg-black/85 px-4 flex items-center justify-between z-40">
            <div className="flex items-center gap-3">
              <span className="font-serif font-black tracking-widest text-amber-200 text-sm">BOTC ONLINE</span>
              <span className="px-2 py-0.5 rounded bg-purple-950 border border-purple-600/40 text-[10px] font-mono text-purple-300 font-bold">{roomCode}</span>
              
              {!gameStarted ? (
                <select
                  value={selectedScriptId}
                  onChange={(e) => setSelectedScriptId(e.target.value)}
                  className="px-2 py-1 rounded bg-stone-900 border border-amber-600/50 text-xs text-amber-300 font-bold focus:outline-none"
                >
                  <option value="tb">Trouble Brewing</option>
                  <option value="bmr">Bad Moon Rising</option>
                  <option value="snv">Sects & Violets</option>
                  <option value="ngj">Teensy: No Greater Joy</option>
                  <option value="luf">Teensy: Laissez un Faire</option>
                </select>
              ) : (
                <span className="text-xs text-amber-300 font-serif font-bold">{currentScript.name}</span>
              )}

              <button
                onClick={() => setIsScriptDrawerOpen(true)}
                className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-stone-900 border border-amber-500/60 text-xs text-amber-200 font-bold shadow"
              >
                <Icon name="BookOpen" className="w-3.5 h-3.5 text-amber-400" />
                <span>Liste des Rôles</span>
              </button>
            </div>

            <div className="flex items-center gap-3 text-xs">
              {gameStarted && phase === 'day' && (
                <div className="flex items-center gap-1.5 bg-stone-900 border border-stone-700 px-2.5 py-1 rounded-xl">
                  <Icon name="Timer" className={`w-3.5 h-3.5 ${isTimerRunning ? 'text-amber-400' : 'text-stone-400'}`} />
                  <span className="font-mono font-bold text-amber-200">
                    {Math.floor(dayTimerSeconds / 60)}:{(dayTimerSeconds % 60).toString().padStart(2, '0')}
                  </span>
                  {isStorytellerMode && (
                    <button onClick={() => setIsTimerRunning(!isTimerRunning)} className="ml-1 text-stone-300 hover:text-amber-300">
                      <Icon name={isTimerRunning ? "Pause" : "Play"} className="w-3 h-3" />
                    </button>
                  )}
                </div>
              )}

              <div className="flex items-center gap-1.5 font-bold">
                <Icon name="Heart" className="w-4 h-4 text-rose-500" />
                <span>{aliveCount}/{players.length}</span>
              </div>
              <div className="flex items-center gap-1.5 font-bold text-amber-300">
                <Icon name="Gavel" className="w-4 h-4 text-amber-400" />
                <span>{majorityRequired} maj</span>
              </div>

              {onTheBlock && (
                <div className="flex items-center gap-1 bg-red-950 border border-red-500 px-2 py-0.5 rounded-full text-red-300 font-bold">
                  <Icon name="Skull" className="w-3 h-3" />
                  <span>{onTheBlock.playerName}</span>
                </div>
              )}

              <button
                onClick={() => setIsStorytellerMode(!isStorytellerMode)}
                className={`px-2.5 py-1 rounded-lg text-xs font-bold border flex items-center gap-1 ${isStorytellerMode ? 'bg-amber-950 border-amber-500 text-amber-200' : 'bg-stone-800 border-stone-600 text-stone-300'}`}
              >
                <Icon name="Crown" className="w-3.5 h-3.5 text-amber-400" />
                <span>{isStorytellerMode ? 'MJ' : 'Joueur'}</span>
              </button>

              <button onClick={() => setNightOrderModalOpen(true)} className="p-1.5 rounded-lg bg-stone-900 border border-stone-700 text-indigo-300">
                <Icon name="Clock" className="w-3.5 h-3.5" />
              </button>

              {isStorytellerMode && gameStarted && (
                <button
                  onClick={() => {
                    setPhase(p => p === 'day' ? 'night' : 'day');
                    if (phase === 'night') setDayNumber(d => d + 1);
                  }}
                  className="px-2 py-1 rounded-lg bg-stone-900 border border-stone-700 text-xs text-amber-300 flex items-center gap-1"
                >
                  <Icon name={phase === 'day' ? "Sun" : "Moon"} className="w-3.5 h-3.5 text-amber-400" />
                  <span>{phase === 'day' ? `J${dayNumber}` : `N${dayNumber}`}</span>
                </button>
              )}

              <button onClick={() => setSettingsModalOpen(true)} className="p-1.5 rounded-lg bg-stone-900 border border-stone-700 text-stone-300">
                <Icon name="Settings" className="w-3.5 h-3.5" />
              </button>
            </div>
          </header>

          {/* BANDEAU ACCUSATION EN ATTENTE */}
          {pendingAccusation && (
            <div className="bg-amber-950/95 border-b-2 border-amber-500 px-4 py-2 z-40 flex items-center justify-between text-xs">
              <span className="text-amber-200">
                Accusation : <strong>{pendingAccusation.nominatorName}</strong> accuse <strong className="text-red-400">{pendingAccusation.nomineeName}</strong> !
              </span>
              {isStorytellerMode && (
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      setNomination({ active: true, nominatorId: pendingAccusation.nominatorId, nomineeId: pendingAccusation.nomineeId, clockIndex: -1, isRunning: false, votes: {}, speed: 1600 });
                      setPendingAccusation(null);
                    }}
                    className="px-3 py-1 bg-emerald-600 text-white font-bold rounded flex items-center gap-1"
                  >
                    <Icon name="Check" className="w-3.5 h-3.5" /> Valider & Lancer
                  </button>
                  <button onClick={() => setPendingAccusation(null)} className="px-3 py-1 bg-red-800 text-white font-bold rounded flex items-center gap-1">
                    <Icon name="X" className="w-3.5 h-3.5" /> Rejeter
                  </button>
                </div>
              )}
            </div>
          )}

          {/* SALONS DU JOUR */}
          <div className="min-h-10 bg-stone-950 border-b border-stone-800 px-4 py-1 flex items-center gap-2 overflow-x-auto text-xs z-30">
            <span className="text-stone-400 font-bold uppercase text-[10px] tracking-wider shrink-0 flex items-center gap-1">
              <Icon name="Compass" className="w-3.5 h-3.5 text-amber-400" /> Salons :
            </span>
            {DAY_BREAKOUT_ROOMS.map(r => (
              <div key={r.id} className="p-1 px-2.5 rounded-xl border border-stone-800 bg-stone-900/80 flex items-center gap-1.5 cursor-pointer">
                <span>{r.icon}</span>
                <span className="text-stone-200 font-bold text-[11px]">{r.name}</span>
                <span className="text-stone-400 text-[10px]">({players.filter(p => p.inRoom === r.id).length})</span>
              </div>
            ))}
          </div>

          {/* ZONE CENTRALE DU CERCLE */}
          <div className="flex-1 flex overflow-hidden relative">
            
            {/* CONTEUR EN HAUT À GAUCHE */}
            <div className="absolute top-4 left-4 z-30 flex flex-col items-start gap-1">
              <div className="w-24 h-24 rounded-2xl bg-stone-950 border-2 border-amber-500/80 flex flex-col items-center justify-center text-4xl shadow-2xl relative">
                <span>{storyteller.avatar}</span>
                <div className="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-amber-500 text-stone-950 flex items-center justify-center font-bold text-xs">🦋</div>
              </div>
              <div className="px-2.5 py-0.5 rounded-lg bg-black/80 border border-stone-800 text-xs font-bold text-amber-300">
                {storyteller.name}
              </div>
            </div>

            {/* 3 BLUFFS DÉMON */}
            <div className="absolute bottom-4 left-4 z-30 flex flex-col gap-1">
              <span className="text-[10px] uppercase font-bold text-rose-400 flex items-center gap-1">
                <Icon name="Flame" className="w-3 h-3 text-rose-500" /> Bluffs du Démon :
              </span>
              <div className="flex items-center gap-2 bg-stone-950/90 border border-rose-900/60 p-2 rounded-2xl shadow-xl">
                {demonBluffs.map((roleId, bIdx) => {
                  const roleObj = roleId ? ROLES_DB[roleId] : null;
                  return (
                    <div key={bIdx} className="w-12 h-12 rounded-full border-2 border-dashed border-rose-600/80 bg-stone-900 flex items-center justify-center relative shadow-lg">
                      {roleObj ? (
                        <img src={roleObj.cdnIcon} alt={roleObj.name} className="w-8 h-8 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                      ) : (
                        <span className="text-stone-500 text-xs font-bold">—</span>
                      )}
                      <span className="absolute -bottom-1 -right-1 w-4 h-4 bg-rose-950 border border-rose-500 text-rose-200 rounded-full text-[9px] font-bold flex items-center justify-center">{bIdx + 1}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* BARRE HÔTE LOBBY */}
            {isStorytellerMode && !gameStarted && (
              <div className="absolute bottom-4 left-48 z-30 flex items-center gap-2 bg-stone-950/90 border border-stone-800 p-2 rounded-2xl shadow-2xl">
                <button onClick={() => addPlayerSeat()} className="px-2.5 py-1.5 rounded-xl bg-indigo-900 border border-indigo-600 text-xs font-bold text-white flex items-center gap-1.5">
                  <Icon name="UserPlus" className="w-3.5 h-3.5" /> Ajouter Joueur ({players.length}/15)
                </button>
                {players.length >= 5 && (
                  <button onClick={handleAutoDistribute} className="px-2.5 py-1.5 rounded-xl bg-amber-900 border border-amber-500 text-xs font-bold text-amber-200 flex items-center gap-1.5">
                    <Icon name="Shuffle" className="w-3.5 h-3.5" /> Distribution Auto
                  </button>
                )}
                {players.length >= 5 && (
                  <button
                    onClick={() => { setGameStarted(true); setPhase('night'); setDayNumber(1); }}
                    className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-700 border border-purple-400 text-xs font-black text-white flex items-center gap-1.5"
                  >
                    <Icon name="Play" className="w-3.5 h-3.5" /> Lancer Partie (Nuit 1)
                  </button>
                )}
              </div>
            )}

            {/* BOUTON ACCUSATION */}
            {gameStarted && phase === 'day' && !nomination.active && (
              <div className="absolute bottom-4 right-4 z-30">
                <button
                  onClick={() => setAccusationWizard({ step: 1, nominatorId: null, nomineeId: null })}
                  className="px-4 py-2.5 bg-gradient-to-r from-red-700 to-amber-700 border-2 border-amber-400 rounded-2xl font-bold text-xs flex items-center gap-2 text-white shadow-2xl"
                >
                  <Icon name="Gavel" className="w-4 h-4" /> Formuler une Accusation
                </button>
              </div>
            )}

            {/* CERCLE */}
            <main className="flex-1 flex items-center justify-center relative p-4">
              {players.length === 0 ? (
                <div className="text-center p-8 rounded-3xl bg-black/70 border border-purple-900/40 max-w-md shadow-2xl">
                  <h2 className="font-serif font-bold text-xl text-amber-200 mb-1">Ravenswood Bluff est désert</h2>
                  <p className="text-xs text-stone-400 mb-4">Le cercle est vide. Ajoutez des joueurs ou invitez des amis.</p>
                  {isStorytellerMode && (
                    <button onClick={() => addPlayerSeat()} className="px-4 py-2 bg-amber-600 text-white font-bold rounded-xl text-xs flex items-center gap-2 mx-auto">
                      <Icon name="UserPlus" className="w-4 h-4" /> Assis le premier joueur
                    </button>
                  )}
                </div>
              ) : (
                <div className="relative w-[340px] h-[340px] sm:w-[500px] sm:h-[500px] lg:w-[620px] lg:h-[620px] rounded-full flex items-center justify-center">
                  
                  {/* AIGUILLES DE VOTE */}
                  {nomination.active && (
                    <>
                      <div
                        className="absolute w-2 h-[48%] origin-bottom bottom-1/2 rounded-full pointer-events-none z-10 transition-transform duration-500 ease-out"
                        style={{ transform: `rotate(${nomineeAngle}deg)`, background: 'linear-gradient(to top, rgba(220,38,38,1), #ef4444)', boxShadow: '0 0 35px 10px rgba(239,68,68,0.95)' }}
                      >
                        <div className="w-8 h-8 -ml-[11px] -mt-4 bg-red-600 border-2 border-white rounded-full flex items-center justify-center text-xs">🎯</div>
                      </div>
                      {nomination.clockIndex >= 0 && (
                        <div
                          className="absolute w-2.5 h-[50%] origin-bottom bottom-1/2 rounded-full pointer-events-none z-20 transition-transform duration-500 ease-out"
                          style={{ transform: `rotate(${sweeperAngle}deg)`, background: 'linear-gradient(to top, rgba(217,119,6,1), #fbbf24)', boxShadow: '0 0 40px 12px rgba(251,191,36,1)' }}
                        >
                          <div className="w-9 h-9 -ml-[13px] -mt-4.5 bg-amber-400 border-2 border-amber-950 rounded-full flex items-center justify-center text-base">✋</div>
                        </div>
                      )}
                    </>
                  )}

                  {/* CENTRE */}
                  <div className="w-44 h-44 sm:w-56 sm:h-56 rounded-full bg-stone-950 border-2 border-amber-700/60 shadow-[0_0_60px_rgba(0,0,0,0.9)] flex flex-col items-center justify-center p-3 text-center z-20">
                    {nomination.active ? (
                      <>
                        <span className="text-[10px] uppercase font-bold text-amber-400">Vote en cours</span>
                        <div className="text-2xl font-serif font-black text-amber-200 my-1">
                          ✋ {Object.values(nomination.votes).filter(Boolean).length} / {majorityRequired}
                        </div>
                        <div className="flex gap-1.5 mt-1">
                          <button
                            onClick={() => setNomination(p => ({ ...p, isRunning: !p.isRunning, clockIndex: p.clockIndex === -1 ? 0 : p.clockIndex }))}
                            className="px-2.5 py-1 bg-amber-500 text-stone-950 font-bold rounded text-xs"
                          >
                            {nomination.isRunning ? 'Pause' : 'Lancer'}
                          </button>
                          <button onClick={() => setNomination(p => ({ ...p, active: false }))} className="p-1 bg-stone-800 rounded">
                            <Icon name="X" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </>
                    ) : (
                      <>
                        <div className="text-2xl mb-1">{phase === 'day' ? '☀️' : '🌙'}</div>
                        <span className="font-serif font-bold text-sm text-amber-200">{gameStarted ? (phase === 'day' ? `Jour ${dayNumber}` : `Nuit ${dayNumber}`) : 'Salon d’attente'}</span>
                        <span className="text-[10px] text-stone-400 mt-1">{players.length} villageois</span>
                      </>
                    )}
                  </div>

                  {/* SIÈGES */}
                  {players.map((p, index) => {
                    const angle = (index / players.length) * 2 * Math.PI - Math.PI / 2;
                    const radius = 43;
                    const left = `${50 + radius * Math.cos(angle)}%`;
                    const top = `${50 + radius * Math.sin(angle)}%`;
                    const roleObj = p.role ? ROLES_DB[p.role] : null;

                    return (
                      <div key={p.id} style={{ left, top }} className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-20 group">
                        
                        {/* MAIN LEVÉE */}
                        {nomination.active && (
                          <div
                            onClick={() => setNomination(curr => ({ ...curr, votes: { ...curr.votes, [p.id]: !curr.votes[p.id] } }))}
                            className={`mb-1 px-2.5 py-0.5 rounded-full text-[11px] font-black cursor-pointer shadow ${nomination.votes[p.id] ? 'bg-amber-400 text-stone-950' : 'bg-stone-900 text-stone-400'}`}
                          >
                            {nomination.votes[p.id] ? '✋ OUI' : '— Non'}
                          </div>
                        )}

                        {/* AVATAR / COTTAGE */}
                        <div
                          onClick={() => { if (isStorytellerMode && phase === 'night') setVisitingCottagePlayer(p); }}
                          className={`w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-stone-950 border-2 overflow-hidden shadow-2xl mb-1.5 flex flex-col items-center justify-center text-3xl sm:text-4xl relative ${!p.alive ? 'border-red-600 grayscale' : 'border-stone-700'}`}
                        >
                          <span>{p.avatar}</span>
                          {!p.alive && (
                            <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center">
                              <Icon name="Skull" className="w-8 h-8 text-red-500" />
                              <span className="text-[9px] font-bold text-red-400 uppercase">Défunt</span>
                            </div>
                          )}
                        </div>

                        {/* JETON DE RÔLE & RAPPELS SANS SUPERPOSITION */}
                        <div className="relative flex items-center justify-center">
                          <div
                            onClick={() => setRolePickerModal({ seatIndex: index, isPlayerHypothesis: !isStorytellerMode })}
                            className="w-14 h-14 sm:w-16 sm:h-16 rounded-full border-2 border-amber-600/70 bg-stone-900 flex items-center justify-center cursor-pointer shadow-2xl relative"
                          >
                            {isStorytellerMode && roleObj ? (
                              <img src={roleObj.cdnIcon} alt={roleObj.name} className="w-10 h-10 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                            ) : (
                              <span className="text-stone-500 text-xs font-serif font-bold">Vide</span>
                            )}
                          </div>

                          {/* MINI-RAPPELS DÉPORTÉS */}
                          <div className="absolute left-full ml-1.5 top-1/2 -translate-y-1/2 flex flex-col gap-1 z-30">
                            {p.reminders.map((rem, rIdx) => (
                              <div key={rIdx} className="h-6 px-1.5 rounded bg-amber-600 border border-amber-300 text-[9px] font-black text-white flex items-center gap-1 shadow">
                                <span>{rem}</span>
                              </div>
                            ))}
                            {isStorytellerMode && (
                              <button onClick={() => setReminderPickerModal(index)} className="w-6 h-6 rounded bg-stone-900 border border-stone-500 text-white flex items-center justify-center text-xs font-bold">
                                +
                              </button>
                            )}
                          </div>
                        </div>

                        {/* NOM */}
                        <div className="mt-1 px-2.5 py-0.5 rounded-lg bg-black/90 border border-stone-800 text-[11px] font-bold text-stone-200 truncate max-w-[120px]">
                          {p.name}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </main>

            {/* SCRIPT LATÉRAL */}
            <aside className={`w-80 border-l border-amber-900/40 bg-[#140b15] p-4 flex flex-col justify-between transition-all duration-300 z-30 ${isScriptDrawerOpen ? 'mr-0' : '-mr-80'}`}>
              <div className="flex items-center justify-between border-b border-stone-800 pb-2 mb-3">
                <h3 className="font-serif font-bold text-amber-200">{currentScript.name}</h3>
                <button onClick={() => setIsScriptDrawerOpen(false)} className="text-stone-400 hover:text-white">
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>
              <div className="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                {currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean).map(r => (
                  <div key={r.id} onClick={() => setWikiRoleModal(r)} className="p-2 rounded-lg bg-stone-900 border border-stone-800 flex items-center justify-between cursor-pointer">
                    <div className="flex items-center gap-2">
                      <img src={r.cdnIcon} alt={r.name} className="w-5 h-5 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                      <span className="font-semibold text-stone-200">{r.name}</span>
                    </div>
                    <Icon name="Info" className="w-3.5 h-3.5 text-stone-500" />
                  </div>
                ))}
              </div>
            </aside>
          </div>

          {/* MODALE VISITE COTTAGE DE NUIT */}
          {visitingCottagePlayer && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-indigo-500 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h3 className="font-serif font-bold text-lg text-indigo-300">Cottage de {visitingCottagePlayer.name}</h3>
                  <button onClick={() => setVisitingCottagePlayer(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-3 bg-stone-900 rounded-xl text-xs space-y-1">
                  <span className="text-stone-400">Rôle : </span>
                  <span className="font-bold text-amber-300">{visitingCottagePlayer.role ? ROLES_DB[visitingCottagePlayer.role]?.name : 'Sans rôle'}</span>
                  {visitingCottagePlayer.role && (
                    <p className="text-stone-300 italic pt-1">« {ROLES_DB[visitingCottagePlayer.role]?.ability} »</p>
                  )}
                </div>
                <div className="text-right">
                  <button onClick={() => setVisitingCottagePlayer(null)} className="px-4 py-2 bg-indigo-600 font-bold rounded-xl text-xs text-white">Quitter</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE ATTRIBUTION RÔLE AVEC QUOTAS OFFICIELS */}
          {rolePickerModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-2xl w-full p-5 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h3 className="font-serif font-bold text-base text-amber-200">
                    Attribuer un rôle à {players[rolePickerModal.seatIndex]?.name}
                  </h3>
                  <button onClick={() => setRolePickerModal(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                {/* BANDEAU QUOTAS */}
                {dynamicQuota && (
                  <div className="grid grid-cols-4 gap-2 text-xs">
                    <div className="p-2 rounded bg-stone-900 border border-stone-800 text-center">
                      <span className="text-blue-400 font-bold block">Villageois</span>
                      <span className="font-mono">{assignedCounts.townsfolk}/{dynamicQuota.townsfolk}</span>
                    </div>
                    <div className="p-2 rounded bg-stone-900 border border-stone-800 text-center">
                      <span className="text-amber-400 font-bold block">Étrangers</span>
                      <span className="font-mono">{assignedCounts.outsider}/{dynamicQuota.outsider}</span>
                    </div>
                    <div className="p-2 rounded bg-stone-900 border border-stone-800 text-center">
                      <span className="text-purple-400 font-bold block">Sbires</span>
                      <span className="font-mono">{assignedCounts.minion}/{dynamicQuota.minion}</span>
                    </div>
                    <div className="p-2 rounded bg-stone-900 border border-stone-800 text-center">
                      <span className="text-red-400 font-bold block">Démon</span>
                      <span className="font-mono">{assignedCounts.demon}/{dynamicQuota.demon}</span>
                    </div>
                  </div>
                )}

                <div className="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2 pr-1">
                  {currentScript.roles.map(id => ROLES_DB[id]).filter(Boolean).map(r => (
                    <button
                      key={r.id}
                      onClick={() => {
                        setPlayers(prev => prev.map((p, idx) => idx === rolePickerModal.seatIndex ? { ...p, role: r.id } : p));
                        setRolePickerModal(null);
                      }}
                      className="p-2 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-400 flex items-center gap-2 text-left"
                    >
                      <img src={r.cdnIcon} alt={r.name} className="w-7 h-7 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                      <div className="truncate">
                        <div className="font-bold text-xs text-stone-200">{r.name}</div>
                        <div className="text-[10px] text-stone-500 uppercase">{r.team}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE RAPPEL */}
          {reminderPickerModal !== null && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-base text-amber-200">Ajouter un rappel</h4>
                  <button onClick={() => setReminderPickerModal(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>
                <div className="space-y-1.5">
                  {REMINDERS_PRESETS.map(preset => (
                    <button
                      key={preset.id}
                      onClick={() => {
                        setPlayers(prev => prev.map((p, idx) => idx === reminderPickerModal ? { ...p, reminders: [...p.reminders, preset.label] } : p));
                        setReminderPickerModal(null);
                      }}
                      className="w-full p-2 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-400 flex items-center gap-2 text-left text-xs"
                    >
                      <span className="text-lg">{preset.icon}</span>
                      <span className="font-bold text-stone-200">{preset.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE ASSISTANT ACCUSATION */}
          {accusationWizard && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-red-600 rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h3 className="font-serif font-bold text-base text-amber-200">
                    {accusationWizard.step === 1 ? 'Qui accuse ?' : 'Qui est accusé ?'}
                  </h3>
                  <button onClick={() => setAccusationWizard(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>
                <div className="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto pr-1">
                  {players.map(p => (
                    <button
                      key={p.id}
                      onClick={() => {
                        if (accusationWizard.step === 1) {
                          setAccusationWizard(w => ({ ...w, step: 2, nominatorId: p.id }));
                        } else {
                          const nominator = players.find(pl => pl.id === accusationWizard.nominatorId);
                          setPendingAccusation({ nominatorId: nominator.id, nomineeId: p.id, nominatorName: nominator.name, nomineeName: p.name });
                          setAccusationWizard(null);
                        }
                      }}
                      className="p-2 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-400 text-left text-xs"
                    >
                      <span className="text-lg">{p.avatar}</span>
                      <div className="font-bold text-stone-200 mt-1">{p.name}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE ORDRE DE NUIT */}
          {nightOrderModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-indigo-600 rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-base text-indigo-200">Ordre de Réveil Nocturne</h4>
                  <button onClick={() => setNightOrderModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>
                <div className="flex rounded-xl bg-stone-900 p-1 border border-stone-800 text-xs">
                  <button onClick={() => setNightOrderTab('first')} className={`flex-1 py-1.5 rounded-lg font-bold ${nightOrderTab === 'first' ? 'bg-indigo-600 text-white' : 'text-stone-400'}`}>Première Nuit</button>
                  <button onClick={() => setNightOrderTab('other')} className={`flex-1 py-1.5 rounded-lg font-bold ${nightOrderTab === 'other' ? 'bg-indigo-600 text-white' : 'text-stone-400'}`}>Autres Nuits</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs">
                  {currentScript.roles.map(id => ROLES_DB[id]).filter(r => r && (nightOrderTab === 'first' ? r.firstNight > 0 : r.otherNight > 0)).sort((a,b) => (nightOrderTab === 'first' ? a.firstNight - b.firstNight : a.otherNight - b.otherNight)).map((role, idx) => (
                    <div key={role.id} className="p-2 rounded-xl bg-stone-900 border border-stone-800 flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-indigo-950 text-indigo-300 font-mono text-[10px] font-bold flex items-center justify-center">{idx + 1}</span>
                      <img src={role.cdnIcon} alt={role.name} className="w-6 h-6 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                      <span className="font-bold text-stone-200">{role.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODALE WIKI */}
          {wikiRoleModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-amber-600 rounded-3xl max-w-md w-full p-6 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <div className="flex items-center gap-2">
                    <img src={wikiRoleModal.cdnIcon} alt={wikiRoleModal.name} className="w-8 h-8 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                    <h3 className="font-serif font-black text-lg text-amber-200">{wikiRoleModal.name}</h3>
                  </div>
                  <button onClick={() => setWikiRoleModal(null)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>
                <div className="text-xs text-stone-300 space-y-2">
                  <p className="italic font-serif">« {wikiRoleModal.ability} »</p>
                </div>
              </div>
            </div>
          )}

          {/* MODALE PARAMÈTRES */}
          {settingsModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-stone-950 border-2 border-stone-700 rounded-2xl max-w-sm w-full p-4 space-y-3 text-xs shadow-2xl">
                <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                  <h4 className="font-serif font-bold text-base text-amber-200">Paramètres</h4>
                  <button onClick={() => setSettingsModalOpen(false)} className="text-stone-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
                <button
                  onClick={() => { setInLobbyScreen(true); setSettingsModalOpen(false); }}
                  className="w-full py-2 bg-red-950 text-red-200 rounded-lg font-bold flex items-center justify-center gap-1"
                >
                  <Icon name="LogOut" className="w-3.5 h-3.5" /> Quitter la partie
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
